    <script>
        // XML Sprite Atlas Reader and Animator
        class SpriteAtlas {
            constructor(xmlPath, imagePath) {
                this.xmlPath = xmlPath;
                this.imagePath = imagePath;
                this.frames = [];
                this.image = null;
                this.loaded = false;
            }

            async load() {
                try {
                    const [xmlText, image] = await Promise.all([
                        fetch(this.xmlPath).then(r => r.text()),
                        this.loadImage(this.imagePath)
                    ]);
                    
                    this.image = image;
                    this.parseXML(xmlText);
                    this.loaded = true;
                    return true;
                } catch (error) {
                    console.error('Failed to load sprite atlas:', error);
                    return false;
                }
            }

            loadImage(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = src;
                });
            }

            parseXML(xmlText) {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                const subTextures = xmlDoc.querySelectorAll('SubTexture');
                
                this.frames = Array.from(subTextures).map(st => ({
                    name: st.getAttribute('name'),
                    x: parseInt(st.getAttribute('x')),
                    y: parseInt(st.getAttribute('y')),
                    width: parseInt(st.getAttribute('width')),
                    height: parseInt(st.getAttribute('height')),
                    frameX: parseInt(st.getAttribute('frameX') || 0),
                    frameY: parseInt(st.getAttribute('frameY') || 0),
                    frameWidth: parseInt(st.getAttribute('frameWidth')),
                    frameHeight: parseInt(st.getAttribute('frameHeight'))
                }));
            }

            drawFrame(ctx, frameIndex, x, y, scale = 1) {
                if (!this.loaded || !this.frames[frameIndex]) return;
                
                const frame = this.frames[frameIndex];
                
                // En FNF/Sparrow, frameX y frameY son negativos y representan el offset desde el borde del frameWidth/frameHeight
                // El sprite se dibuja en su posición real dentro del frame completo
                const offsetX = Math.abs(frame.frameX);
                const offsetY = Math.abs(frame.frameY);
                
                ctx.drawImage(
                    this.image,
                    frame.x, frame.y, frame.width, frame.height,
                    x + offsetX * scale, y + offsetY * scale, 
                    frame.width * scale, frame.height * scale
                );
            }
        }

        let currentFrame = 0;
        let animationSpeed = 12; // FPS (reducido de 24 a 12)
        let lastFrameTime = 0;

        // Canvas size matches frameWidth/frameHeight from XML
        canvas.width = 640;
        canvas.height = 640;

        function animate(timestamp) {
            if (!currentAtlas || !currentAtlas.loaded) {
                requestAnimationFrame(animate);
                return;
            }

            const deltaTime = timestamp - lastFrameTime;
            if (deltaTime > 1000 / animationSpeed) {
                // Clear with transparent background
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw centered - the drawFrame handles the offset internally
                currentAtlas.drawFrame(ctx, currentFrame, 0, 0, 1);
                
                currentFrame = (currentFrame + 1) % currentAtlas.frames.length;
                lastFrameTime = timestamp;
            }

            requestAnimationFrame(animate);
        }

        async function loadStage(stage3DPath) {
            const atlas = new SpriteAtlas(
                `${stage3DPath}.xml`,
                `${stage3DPath}.png`
            );
            
            const loaded = await atlas.load();
            if (loaded) {
                currentAtlas = atlas;
                currentFrame = 0;
            }
        }

        async function renderSong() {
            const song = songs[currentSong];
            songName.textContent = song.name;
            coverImage.src = song.cover;
            timeEl.textContent = song.stats.time;
            
            // Show/hide version buttons
            if (song.hasVersions) {
                versionButtons.classList.add('active');
                playBtn.style.display = 'none';
            } else {
                versionButtons.classList.remove('active');
                playBtn.style.display = 'block';
            }
            
            // Change background tint on right panel background (not the 3D)
            rightPanelBg.className = 'right-panel-bg ' + (song.tint || '');
            
            await loadStage(song.stage3D);
        }

        function playSound(el) {
            if (!el) return;
            el.currentTime = 0;
            el.play().catch(() => {});
        }

        function enableAudio() {
            bgMusic.volume = 0.5;
            bgMusic.play().catch(() => {});
            document.removeEventListener('click', enableAudio);
            document.removeEventListener('keydown', enableAudio);
            document.removeEventListener('touchstart', enableAudio);
        }

        function navigatePrev() {
            currentSong = (currentSong - 1 + songs.length) % songs.length;
            renderSong();
            playSound(scrollSound);
        }

        function navigateNext() {
            currentSong = (currentSong + 1) % songs.length;
            renderSong();
            playSound(scrollSound);
        }

        navUp.addEventListener('click', navigatePrev);
        navDown.addEventListener('click', navigateNext);
        
        playBtn.addEventListener('click', () => {
            playSound(confirmSound);
            loadingOverlay.classList.add('active');
            setTimeout(() => { window.location.href = songs[currentSong].url; }, 800);
        });
        
        oldVersionBtn.addEventListener('click', () => {
            playSound(confirmSound);
            loadingOverlay.classList.add('active');
            setTimeout(() => { window.location.href = songs[currentSong].urlOld; }, 800);
        });
        
        newVersionBtn.addEventListener('click', () => {
            playSound(confirmSound);
            loadingOverlay.classList.add('active');
            setTimeout(() => { window.location.href = songs[currentSong].url; }, 800);
        });
        
        coverImage.addEventListener('click', () => {
            const song = songs[currentSong];
            if (song.hasVersions) return; // Don't auto-play if has versions
            playSound(confirmSound);
            loadingOverlay.classList.add('active');
            setTimeout(() => { window.location.href = song.url; }, 800);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') navigatePrev();
            if (e.key === 'ArrowDown') navigateNext();
            if (e.key === 'Enter') {
                playSound(confirmSound);
                loadingOverlay.classList.add('active');
                setTimeout(() => { window.location.href = songs[currentSong].url; }, 800);
            }
        });

        document.addEventListener('click', enableAudio);
        document.addEventListener('keydown', enableAudio);
        document.addEventListener('touchstart', enableAudio);
        
        renderSong();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
