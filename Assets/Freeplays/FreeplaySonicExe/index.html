<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic.exe - Freeplay</title>
    <link rel="icon" type="image/png" href="../../../images/logo_sonic_puto_exe.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Press Start 2P', cursive;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        .background {
            position: fixed;
            inset: 0;
            background-image: url('../../../Assets/BG/backgroundlool.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1;
        }
        .sidebar-right {
            position: fixed;
            right: 0;
            top: 0;
            width: 1500px;
            height: 100vh;
            z-index: 50;
            overflow: hidden;
            pointer-events: none;
            background-image: url('Assets/Images/sidebar.png'), url('Assets/Images/sidebar.png');
            background-size: contain;
            background-repeat: repeat-y;
            background-position: right top, right bottom;
            animation: scrollBg 30s linear infinite;
        }
        @keyframes scrollBg {
            from { background-position: right 0, right 100vh; }
            to { background-position: right 100vh, right 200vh; }
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #ff0000;
            color: #ff0000;
            font-size: 0.6rem;
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 200;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover {
            background: rgba(255,0,0,0.2);
            box-shadow: 0 0 10px #ff0000;
        }
        .character-name {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 3rem;
            text-align: center;
            text-shadow: 3px 3px 0 #000;
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 100;
        }
        .cover-container {
            position: fixed;
            left: 200px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        .cover-wrapper {
            position: relative;
            transition: all 0.5s ease;
        }
        .cover-wrapper.slide-down {
            animation: slideDown 0.5s ease;
        }
        .cover-wrapper.slide-up {
            animation: slideUp 0.5s ease;
        }
        @keyframes slideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .cover-bg {
            position: absolute;
            width: 600px;
            height: 345px;
            background-image: url('../../../images/FreeBox.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .cover-image {
            width: 360px;
            height: 360px;
            border-radius: 8px;
            border: none;
            box-shadow: none;
            object-fit: cover;
            position: relative;
            z-index: 1;
        }
        .cover-image.contain {
            object-fit: contain;
            width: 280px;
            height: 280px;
            margin: 40px;
        }
        .preview-cover {
            width: 180px;
            height: 180px;
            border-radius: 8px;
            object-fit: cover;
            opacity: 0.4;
            transition: opacity 0.3s;
            cursor: pointer;
        }
        .preview-cover.contain {
            object-fit: contain;
            width: 140px;
            height: 140px;
            margin: 20px;
        }
        .preview-cover:hover {
            opacity: 0.7;
        }
        .nav-arrows {
            position: fixed;
            left: 200px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 90;
            display: none;
            gap: 700px;
        }
        .arrow {
            background: rgba(0,0,0,0.7);
            border: 2px solid #ff0000;
            color: #ff0000;
            font-size: 2rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .arrow:hover {
            background: rgba(255,0,0,0.3);
            box-shadow: 0 0 20px rgba(255,0,0,0.6);
            transform: scale(1.1);
        }
        .arrow:active {
            background: rgba(255,0,0,0.5);
            transform: scale(0.95);
        }
        .songs-container {
            position: fixed;
            right: 350px;
            top: 50%;
            transform: translate(50%, -50%);
            z-index: 150;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 400px;
        }
        .song-item {
            background: transparent;
            border: none;
            color: #fff;
            padding: 18px 35px;
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            text-align: center;
            text-shadow: 3px 3px 0 #000;
            text-transform: uppercase;
            letter-spacing: 2px;
            word-break: break-word;
            line-height: 1.4;
        }
        .song-item:hover {
            background: rgba(255,0,0,0.2);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #ff0000;
            font-size: 1rem;
            gap: 20px;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top-color: #ff0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .sidebar-right { 
                width: 600px;
                background-size: contain;
            }
            .character-name { 
                font-size: 1.2rem; 
                top: 25px;
            }
            .cover-container { 
                left: 30px;
                top: 50%;
                transform: translateY(-50%);
                gap: 15px;
            }
            .cover-image { 
                width: 180px; 
                height: 180px;
            }
            .cover-image.contain {
                width: 140px;
                height: 140px;
                margin: 20px;
            }
            .cover-bg { 
                width: 300px; 
                height: 172px; 
            }
            .preview-cover {
                width: 90px;
                height: 90px;
            }
            .preview-cover.contain {
                width: 70px;
                height: 70px;
                margin: 10px;
            }
            .nav-arrows {
                display: flex;
                left: 240px;
                top: 50%;
                transform: translateY(-50%);
                flex-direction: column;
                gap: 20px;
            }
            .arrow {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
                padding: 10px;
            }
            .songs-container { 
                right: 50px;
                transform: translateY(-50%);
                width: 200px;
                gap: 12px;
            }
            .song-item { 
                font-size: 0.7rem; 
                padding: 12px 15px;
                letter-spacing: 1px;
            }
            .back-btn {
                font-size: 0.5rem;
                padding: 8px 12px;
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>
    <a href="../../../freeplay.html" class="back-btn">◀ BACK</a>
    <div class="background"></div>
    <div class="overlay"></div>
    <div class="sidebar-right"></div>
    <div class="character-name" id="characterName">SUNKY</div>
    <div class="nav-arrows">
        <div class="arrow" id="prevArrow">▲</div>
        <div class="arrow" id="nextArrow">▼</div>
    </div>
    <div class="cover-container">
        <img class="preview-cover" id="prevCover" src="Assets/Covers/Fight_or_Flight_Freeplay_Art_WIP.webp" alt="Previous">
        <div class="cover-wrapper">
            <div class="cover-bg"></div>
            <img class="cover-image" id="coverImage" src="Assets/Covers/sunky.png" alt="Character">
        </div>
        <img class="preview-cover" id="nextCover" src="Assets/Covers/fatalerror.png" alt="Next">
    </div>
    <div class="songs-container" id="songsContainer"></div>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <span>LOADING...</span>
    </div>
    <audio id="scrollSound" src="../../../sounds/pauseScrollMenu.ogg"></audio>
    <audio id="confirmSound" src="../../../sounds/confirmMenu.ogg"></audio>
    <audio id="bgMusic" src="Assets/Music/sonicexe-menu.ogg" loop></audio>
    <script src="../../../Assets/js/christmas-lite.js"></script>
    <script>
        const characters = [
            { name: "SUNKY", cover: "Assets/Covers/sunky.png",
              songs: [{ name: "MILK", url: "https://funkymaker.kingamescreator.com/_app/levels/01jsdf2p7ve5nwjekbxx4mc7be/releases/01jsdf2p7ymhte7r81vqcgttrk" }]},
            { name: "FATAL ERROR", cover: "Assets/Covers/fatalerror.png",
              songs: [{ name: "FATALITY", url: "https://www.dropbox.com/scl/fi/afssdxee8fvkfhp4kxn0p/Fatality.FNMM?rlkey=tv56dae5rp9arv83qt6fgv3z5&st=9okgbqlc&dl=0" }]},
            { name: "LORD X", cover: "Assets/Covers/lord x.png",
              songs: [{ name: "CYCLES ENCORE", url: "https://drive.google.com/file/d/1VwACThhkjt6mKqB8Nru2IMda6bTi5yxG/view?usp=drivesdk" }]},
            { name: "MAJIN SONIC", cover: "Assets/Covers/majin.png",
              songs: [{ name: "ENDLESS", url: "https://funkymaker-app.kingamescreator.com/levels/01ks1n40fn257fntv34vbdggzn/releases/01ks1n40frxys59ht4seftjmnt" }]},
            { name: "TAILS DOLL", cover: "Assets/Covers/tails doll.png",
              songs: [
                { name: "SUNSHINE", url: "https://funkymaker-app.kingamescreator.com/levels/01kv4b56s4f2php10pdbjtcvvt/releases/01kv4b56s6z7jszg1xkts35myk" },
                { name: "SOULLESS", url: "https://funkymaker-app.kingamescreator.com/levels/01kv61x8gedf36gr0rykjg1x82/releases/01kv61x8ghrx0s5a6795heamf5" }
              ]},
            { name: "STARVED & FURNACE", cover: "Assets/Covers/Fight_or_Flight_Freeplay_Art_WIP.webp",
              songs: [
                { name: "PREY", url: "https://funkymaker.kingamescreator.com/_app/levels/01jzs1rsvcsg4et3wsg08jqht7/releases/01jzs1rsvh3qmx05b68hv1bjn9" },
                { name: "FIGHT OR FLIGHT", url: "https://funkymaker-app.kingamescreator.com/levels/01jed29688stjg7asx8s9d54ng/releases/01jfp35cehcr4d9v3e5h39wfvh" }
              ]},
            { name: "NEEDLEMOUSE", cover: "Assets/Covers/needlemouse.png",
              songs: [{ name: "ROUND A BOUT", url: "https://funkymaker-app.kingamescreator.com/levels/01kvh2zs0ghsptbqfdahnmgctk/releases/01kvh2zs0kvb1pejccdg4aa3n0" }]}
        ];
        const characterName = document.getElementById('characterName');
        const coverImage = document.getElementById('coverImage');
        const coverWrapper = document.querySelector('.cover-wrapper');
        const prevCover = document.getElementById('prevCover');
        const nextCover = document.getElementById('nextCover');
        const songsContainer = document.getElementById('songsContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const scrollSound = document.getElementById('scrollSound');
        const confirmSound = document.getElementById('confirmSound');
        const bgMusic = document.getElementById('bgMusic');
        const prevArrow = document.getElementById('prevArrow');
        const nextArrow = document.getElementById('nextArrow');
        let currentCharacter = 0;

        function updatePreviews() {
            const prevIndex = (currentCharacter - 1 + characters.length) % characters.length;
            const nextIndex = (currentCharacter + 1) % characters.length;
            prevCover.src = characters[prevIndex].cover;
            nextCover.src = characters[nextIndex].cover;
            
            // Aplicar contain solo a Starved
            if (characters[prevIndex].cover.includes('Fight_or_Flight')) {
                prevCover.classList.add('contain');
            } else {
                prevCover.classList.remove('contain');
            }
            
            if (characters[nextIndex].cover.includes('Fight_or_Flight')) {
                nextCover.classList.add('contain');
            } else {
                nextCover.classList.remove('contain');
            }
        }

        function renderCharacter(direction = null) {
            const char = characters[currentCharacter];
            characterName.textContent = char.name;
            
            if (direction) {
                coverWrapper.classList.remove('slide-down', 'slide-up');
                void coverWrapper.offsetWidth;
                coverWrapper.classList.add(direction === 'next' ? 'slide-down' : 'slide-up');
            }
            
            coverImage.src = char.cover;
            
            // Aplicar contain solo a Starved
            if (char.cover.includes('Fight_or_Flight')) {
                coverImage.classList.add('contain');
            } else {
                coverImage.classList.remove('contain');
            }
            
            updatePreviews();
            
            songsContainer.innerHTML = '';
            char.songs.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.textContent = song.name;
                item.addEventListener('click', () => {
                    playSound(confirmSound);
                    loadingOverlay.classList.add('active');
                    setTimeout(() => { window.location.href = song.url; }, 800);
                });
                songsContainer.appendChild(item);
            });
        }

        function navigatePrev() {
            currentCharacter = (currentCharacter - 1 + characters.length) % characters.length;
            renderCharacter('prev');
            playSound(scrollSound);
        }

        function navigateNext() {
            currentCharacter = (currentCharacter + 1) % characters.length;
            renderCharacter('next');
            playSound(scrollSound);
        }

        prevArrow.addEventListener('click', navigatePrev);
        nextArrow.addEventListener('click', navigateNext);
        prevCover.addEventListener('click', navigatePrev);
        nextCover.addEventListener('click', navigateNext);

        function playSound(el) {
            if (!el) return;
            el.currentTime = 0;
            el.play().catch(() => {});
        }

        function enableAudio() {
            bgMusic.volume = 0.5;
            bgMusic.play().catch(() => {});
            document.removeEventListener('click', enableAudio);
            document.removeEventListener('keydown', enableAudio);
            document.removeEventListener('touchstart', enableAudio);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                navigatePrev();
            }
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                navigateNext();
            }
        });
        document.addEventListener('click', enableAudio);
        document.addEventListener('keydown', enableAudio);
        document.addEventListener('touchstart', enableAudio);
        renderCharacter();
    </script>
</body>
</html>
