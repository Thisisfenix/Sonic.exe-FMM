<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Permissions-Policy" content="storage-access=()">
    <title>Créditos - Sonic.exe</title>
    <link rel="icon" type="image/png" href="images/logo_sonic_puto_exe.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="preload" href="sounds/Credits.ogg" as="audio" type="audio/ogg">
    <link rel="preload" href="BG/menuBG.png" as="image">
    <style>
        :root {
            --transition-time: 0.6s;
            --main-color: #00E5E5;
            --secondary-color: #FF00FF;
            --text-color: #FFFFFF;
            --bg-dark: rgba(0, 0, 0, 0.9);
            --ex-color: #FF6666;
            --external-color: #FFE033;
            --bg-gradient: linear-gradient(45deg, #000014, #001428);
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-inset-left: env(safe-area-inset-left, 0px);
            --safe-area-inset-right: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html,
        body {
            font-family: 'Press Start 2P', cursive;
            color: var(--text-color);
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
            touch-action: pan-y pinch-zoom;
            perspective: 1000px;
            background: #1a1a2e;
            overscroll-behavior: none;
        }

        /* Fondo animado con overlay grisáceo */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background:
                linear-gradient(rgba(30, 30, 50, 0.7), rgba(30, 30, 50, 0.7)),
                url('BG/menuBG.png') repeat-x;
            background-size: auto 100%;
            z-index: -2;
            animation: bgScroll 30s linear infinite;
        }

        @keyframes bgScroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .credits-container {
            position: fixed;
            top: var(--safe-area-inset-top);
            left: var(--safe-area-inset-left);
            width: calc(100vw - var(--safe-area-inset-left) - var(--safe-area-inset-right));
            height: calc(100vh - var(--safe-area-inset-top) - var(--safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            padding-bottom: max(15px, var(--safe-area-inset-bottom), 60px);
            z-index: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .credits-title {
            font-size: min(3rem, 8vw);
            color: var(--text-color);
            text-shadow: 0 0 10px var(--main-color), 0 0 20px var(--main-color);
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: titleGlow 2s ease-in-out infinite alternate;
            position: relative;
            text-align: center;
            line-height: 1.2;
            padding: 0 10px;
        }

        .credits-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--main-color), transparent);
            box-shadow: 0 0 10px var(--main-color);
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 10px var(--main-color), 0 0 20px var(--main-color);
            }

            to {
                text-shadow: 0 0 15px var(--main-color), 0 0 30px var(--main-color), 0 0 40px var(--secondary-color);
            }
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--main-color);
            padding-bottom: 5px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
        }

        .category-tab {
            font-family: 'Press Start 2P', cursive;
            font-size: min(0.9rem, 3vw);
            padding: 8px 16px;
            background: transparent;
            color: var(--main-color);
            border: 2px solid var(--main-color);
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .category-tab:focus {
            outline: 3px solid var(--secondary-color);
            outline-offset: 3px;
            z-index: 10;
        }

        .category-tab:active {
            transform: scale(0.95);
            transition: transform 0.1s ease;
        }

        .category-tab.active {
            background: var(--main-color);
            color: #000;
            box-shadow: 0 0 15px var(--main-color);
        }

        .category-tab.ex-active {
            border-color: var(--ex-color);
            color: var(--ex-color);
        }

        .category-tab.ex-active.active {
            background: var(--ex-color);
            color: #000;
            box-shadow: 0 0 15px var(--ex-color);
        }

        .category-tab.external-active {
            border-color: var(--external-color);
            color: var(--external-color);
        }

        .category-tab.external-active.active {
            background: var(--external-color);
            color: #000;
            box-shadow: 0 0 15px var(--external-color);
        }

        .credits-slider-container {
            position: relative;
            width: 100%;
            max-width: min(1200px, 95vw);
            height: auto;
            max-height: 80vh;
            margin-bottom: 20px;
            overflow: visible;
            touch-action: pan-y;
        }

        .credits-slider {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 20px;
            transition: opacity 0.3s ease;
        }

        .credits-slider.transitioning {
            opacity: 0.3;
            pointer-events: none;
        }

        .credit-slide {
            position: absolute;
            width: min(320px, 85vw);
            height: auto;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            transition: all var(--transition-time) cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
            backface-visibility: hidden;
            opacity: 0;
            pointer-events: none;
            transform: translateX(100%);
            top: 0;
            left: 50%;
            transform-origin: center;
        }

        .credit-slide.active {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            z-index: 3;
            pointer-events: all;
            filter: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateX(0) translateY(20px) scale(1); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0) translateY(0) scale(1); 
            }
        }

        .credit-slide.prev {
            opacity: 0.6;
            transform: translateX(-150%) scale(0.8);
            z-index: 2;
            filter: blur(2px);
        }

        .credit-slide.next {
            opacity: 0.6;
            transform: translateX(50%) scale(0.8);
            z-index: 2;
            filter: blur(2px);
        }

        .credit-card {
            background: var(--bg-dark);
            border: 3px solid var(--main-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 15px var(--main-color);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .credit-card:hover {
            box-shadow: 0 0 20px var(--main-color);
            transform: translateY(-2px);
        }

        .credit-card:active {
            transform: scale(0.98) translateY(-2px);
            transition: transform 0.1s;
        }

        .credit-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(0, 0, 0, 0.95);
            color: var(--main-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            border: 1px solid var(--main-color);
            box-shadow: 0 0 10px var(--main-color);
            z-index: 100;
        }

        .credit-card:hover .credit-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }

        .credit-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--main-color);
        }

        .ex-card .credit-tooltip {
            color: var(--ex-color);
            border-color: var(--ex-color);
            box-shadow: 0 0 10px var(--ex-color);
        }

        .ex-card .credit-tooltip::after {
            border-top-color: var(--ex-color);
        }

        .external-card .credit-tooltip {
            color: var(--external-color);
            border-color: var(--external-color);
            box-shadow: 0 0 10px var(--external-color);
        }

        .external-card .credit-tooltip::after {
            border-top-color: var(--external-color);
        }

        .credit-card.ex-card {
            border-color: var(--ex-color);
            box-shadow: 0 0 15px var(--ex-color);
        }

        .credit-card.external-card {
            border-color: var(--external-color);
            box-shadow: 0 0 15px var(--external-color);
        }

        .credit-expand-arrow {
            margin-top: 10px;
            font-size: 1.5rem;
            color: var(--main-color);
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
            background: transparent;
            border: none;
            padding: 5px;
        }

        .credit-expand-arrow:focus {
            outline: 2px solid var(--secondary-color);
            outline-offset: 2px;
        }

        .credit-expand-arrow.expanded {
            transform: rotate(180deg);
        }

        .credit-expand-arrow.ex-arrow {
            color: var(--ex-color);
        }

        .credit-expand-arrow.external-arrow {
            color: var(--external-color);
        }

        .credit-extra-info {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            margin-top: 10px;
        }

        .credit-extra-info.expanded {
            max-height: 500px;
        }

        .credit-extra-content {
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            border: 2px solid var(--main-color);
            margin-top: 10px;
        }

        .credit-extra-content.ex-content {
            border-color: var(--ex-color);
        }

        .credit-extra-content.external-content {
            border-color: var(--external-color);
        }

        .credit-extra-text {
            font-size: min(0.8rem, 2.8vw);
            color: var(--main-color);
            text-shadow: 0 0 4px var(--main-color);
            line-height: 1.4;
        }

        .credit-extra-text.ex-text {
            color: var(--ex-color);
            text-shadow: 0 0 4px var(--ex-color);
        }

        .credit-extra-text.external-text {
            color: var(--external-color);
            text-shadow: 0 0 4px var(--external-color);
        }

        .credit-icon-container {
            position: relative;
            width: min(150px, 25vw);
            height: min(150px, 25vw);
            margin: 0 auto 15px;
            z-index: 1;
        }

        .credit-icon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--main-color);
            box-shadow: 0 0 15px var(--main-color);
            transition: all 0.4s ease;
            background: #0a2c42;
            position: relative;
            z-index: 2;
        }

        .credit-icon.ex-icon {
            border-color: var(--ex-color);
            box-shadow: 0 0 15px var(--ex-color);
            filter: grayscale(0.3);
        }

        .credit-icon.external-icon {
            border-color: var(--external-color);
            box-shadow: 0 0 15px var(--external-color);
        }

        .credit-icon.loading {
            animation: pulse 1.5s infinite;
            background: #1a3c5c;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .credit-icon-container::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            border: 2px solid var(--secondary-color);
            opacity: 0;
            animation: pulseRing 2s infinite;
            z-index: 1;
        }

        .credit-icon-container.ex-icon-container::after {
            border-color: var(--ex-color);
        }

        .credit-icon-container.external-icon-container::after {
            border-color: var(--external-color);
        }

        @keyframes pulseRing {
            0% {
                transform: scale(0.9);
                opacity: 0.7;
            }

            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .credit-name {
            font-size: min(1.2rem, 4vw);
            color: var(--text-color);
            margin-bottom: 10px;
            text-shadow: 0 0 8px var(--main-color);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            line-height: 1.2;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            max-width: 100%;
        }

        .credit-name.ex-name {
            text-shadow: 0 0 8px var(--ex-color);
        }

        .credit-name.external-name {
            text-shadow: 0 0 8px var(--external-color);
        }

        .credit-role {
            font-size: min(1rem, 3.2vw);
            color: var(--main-color);
            line-height: 1.4;
            text-shadow: 0 0 4px var(--main-color);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .credit-role.ex-role {
            color: var(--ex-color);
            text-shadow: 0 0 4px var(--ex-color);
        }

        .credit-role.external-role {
            color: var(--external-color);
            text-shadow: 0 0 4px var(--external-color);
        }

        .ex-badge {
            display: inline-block;
            background: var(--ex-color);
            color: #000;
            font-size: min(0.7rem, 2.5vw);
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .external-badge {
            display: inline-block;
            background: var(--external-color);
            color: #000;
            font-size: min(0.7rem, 2.5vw);
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .credits-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: auto;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .credits-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: min(1.2rem, 3.5vw);
            color: var(--main-color);
            background: transparent;
            border: 2px solid var(--main-color);
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px var(--main-color);
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .credits-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .credits-btn:focus {
            outline: 2px solid var(--secondary-color);
            outline-offset: 2px;
        }

        .credits-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
            transition: 0.5s;
        }

        .credits-btn:hover::before {
            left: 100%;
        }

        .credits-btn:hover {
            background: var(--main-color);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--main-color), 0 0 20px var(--secondary-color);
        }

        .credits-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px var(--main-color);
        }

        .credits-btn.clicked {
            animation: btnPulse 0.3s ease;
        }

        @keyframes btnPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .progress-indicator {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
        }

        .progress-dot {
            width: min(12px, 3vw);
            height: min(12px, 3vw);
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.3);
            border: 1px solid var(--main-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .progress-dot:hover {
            transform: scale(1.3);
            opacity: 1;
        }

        .progress-dot:active {
            transform: scale(0.9);
        }

        .progress-dot.active {
            background: var(--main-color);
            box-shadow: 0 0 8px var(--main-color);
            transform: scale(1.2);
        }

        .progress-dot.ex-dot {
            background: rgba(255, 85, 85, 0.3);
            border: 1px solid var(--ex-color);
        }

        .progress-dot.ex-dot.active {
            background: var(--ex-color);
            box-shadow: 0 0 8px var(--ex-color);
        }

        .progress-dot.external-dot {
            background: rgba(255, 215, 0, 0.3);
            border: 1px solid var(--external-color);
        }

        .progress-dot.external-dot.active {
            background: var(--external-color);
            box-shadow: 0 0 8px var(--external-color);
        }

        .back-button {
            position: fixed;
            top: calc(15px + var(--safe-area-inset-top));
            left: calc(15px + var(--safe-area-inset-left));
            padding: 10px 15px;
            background: var(--bg-dark);
            color: var(--main-color);
            border: 2px solid var(--main-color);
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: min(1rem, 3vw);
            text-decoration: none;
            text-shadow: 0 0 8px var(--main-color);
            box-shadow: 0 0 15px var(--main-color);
            transition: all 0.3s ease;
            z-index: 20;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }

        /* Ajustes para todos los móviles con navbar */
        @media (max-width: 768px) {
            .credits-container {
                padding: 5px;
                padding-top: max(5px, env(safe-area-inset-top));
                padding-bottom: max(60px, env(safe-area-inset-bottom));
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                gap: 5px;
            }
            
            .credits-title {
                font-size: clamp(1rem, 4.5vw, 1.5rem);
                margin-bottom: 5px;
                padding: 0;
            }
            
            .category-tabs {
                margin-bottom: 5px;
                gap: 4px;
                padding-bottom: 0;
                border-bottom: none;
            }
            
            .category-tab {
                font-size: clamp(0.5rem, 2vw, 0.7rem);
                padding: 5px 8px;
            }
            
            .credits-slider-container {
                flex: 1;
                min-height: 250px;
                max-height: none;
                margin-bottom: 5px;
            }
            
            .credit-slide {
                width: min(280px, 92vw);
            }
            
            .credit-card {
                padding: 12px 10px;
            }
            
            .credit-icon-container {
                width: min(100px, 26vw);
                height: min(100px, 26vw);
                margin-bottom: 8px;
            }
            
            .credit-name {
                font-size: clamp(0.8rem, 3.2vw, 1rem);
                margin-bottom: 6px;
            }
            
            .credit-role {
                font-size: clamp(0.6rem, 2.5vw, 0.85rem);
                line-height: 1.3;
            }
            
            .credits-controls {
                margin-top: 5px;
                margin-bottom: max(10px, env(safe-area-inset-bottom));
                padding-bottom: max(10px, env(safe-area-inset-bottom));
                gap: 5px;
                flex-wrap: wrap;
            }
            
            .credits-btn {
                font-size: clamp(0.6rem, 2.5vw, 0.85rem);
                padding: 6px 8px;
                min-width: 36px;
            }
            
            #prevButton, #nextButton {
                font-size: 1.3rem;
                padding: 6px 10px;
                min-width: 40px;
            }
            
            .progress-indicator {
                gap: 3px;
                width: 100%;
                order: 3;
            }
            
            .progress-dot {
                width: 8px;
                height: 8px;
            }
            
            .back-button {
                position: relative;
                bottom: auto;
                left: auto;
                transform: none;
                top: auto;
                margin: 0;
                font-size: clamp(0.6rem, 2.5vw, 0.85rem);
                padding: 6px 10px;
            }
        }

        /* Ajustes específicos para pantallas muy pequeñas */
        @media (max-width: 400px) {
            .credits-container {
                padding: 4px;
                padding-bottom: max(60px, env(safe-area-inset-bottom));
                gap: 4px;
            }
            
            .credits-title {
                font-size: clamp(0.9rem, 4vw, 1.3rem);
                margin-bottom: 4px;
            }
            
            .credit-icon-container {
                width: min(90px, 24vw);
                height: min(90px, 24vw);
            }
        }

        .back-button:hover {
            background: var(--main-color);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--main-color), 0 0 25px var(--secondary-color);
        }

        .audio-toggle {
            position: fixed;
            top: calc(15px + var(--safe-area-inset-top));
            right: calc(15px + var(--safe-area-inset-right));
            width: min(40px, 10vw);
            height: min(40px, 10vw);
            background: var(--bg-dark);
            border: 2px solid var(--main-color);
            border-radius: 50%;
            color: var(--main-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 0 12px var(--main-color);
            transition: all 0.3s ease;
            font-size: min(1.2rem, 4vw);
        }

        .audio-toggle:focus {
            outline: 2px solid var(--secondary-color);
            outline-offset: 2px;

        function toggleAutoplay() {
            const states = {
                active: { text: 'STOP', opacity: '0.7', pressed: 'true', label: 'Desactivar reproducción automática' },
                inactive: { text: 'AUTO', opacity: '1', pressed: 'false', label: 'Activar reproducción automática' }
            };
            
            if (isAutoplayActive) {
                clearInterval(autoplayInterval);
                isAutoplayActive = false;
            } else {
                autoplayInterval = setInterval(showNextCredit, CONFIG.AUTOPLAY_INTERVAL);
                isAutoplayActive = true;
            }
            
            const state = states[isAutoplayActive ? 'active' : 'inactive'];
            autoplayBtn.textContent = state.text;
            autoplayBtn.style.opacity = state.opacity;
            autoplayBtn.setAttribute('aria-pressed', state.pressed);
            autoplayBtn.setAttribute('aria-label', state.label);
        }

        // Actualizar posición de los slides
        function updateSlidesPosition() {
            const slides = document.querySelectorAll('.credit-slide');
            const dots = document.querySelectorAll('.progress-dot');
            const credits = creditsData[currentCategory];

            if (credits.length === 0) return;

            // Ocultar todos los slides
            slides.forEach(slide => {
                slide.classList.remove('active', 'prev', 'next');
            });

            // Manejar casos especiales con pocos elementos
            if (credits.length === 1) {
                // Solo un elemento - mostrar solo ese
                if (slides[0]) slides[0].classList.add('active');
            } else if (credits.length === 2) {
                // Dos elementos - lógica especial
                if (currentIndex === 0) {
                    if (slides[0]) slides[0].classList.add('active');
                    if (slides[1]) slides[1].classList.add('next');
                } else {
                    if (slides[0]) slides[0].classList.add('prev');
                    if (slides[1]) slides[1].classList.add('active');
                }
            } else {
                // Tres o más elementos - lógica normal
                const prevIndex = (currentIndex - 1 + credits.length) % credits.length;
                const nextIndex = (currentIndex + 1) % credits.length;

                if (slides[prevIndex]) slides[prevIndex].classList.add('prev');
                if (slides[currentIndex]) slides[currentIndex].classList.add('active');
                if (slides[nextIndex]) slides[nextIndex].classList.add('next');
            }

            // Actualizar indicadores
            dots.forEach((dot, index) => {
                const isActive = index === currentIndex;
                dot.classList.toggle('active', isActive);
                dot.setAttribute('aria-selected', isActive);
                dot.setAttribute('tabindex', isActive ? '0' : '-1');
            });

            // Anunciar cambio a lectores de pantalla
            const activeSlide = slides[currentIndex];
            if (activeSlide) {
                const creditName = activeSlide.querySelector('.credit-name');
                if (creditName) {
                    creditsSlider.setAttribute('aria-label', `Mostrando crédito ${currentIndex + 1} de ${credits.length}: ${creditName.textContent}`);
                }
            }

            // Actualizar estado de botones
            updateButtonStates();
        }

        // Actualizar estado de los botones de navegación
        function updateButtonStates() {
            const credits = creditsData[currentCategory];

            if (credits.length <= 1) {
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                prevBtn.style.opacity = '0.5';
                nextBtn.style.opacity = '0.5';
            } else {
                prevBtn.disabled = false;
                nextBtn.disabled = false;
                prevBtn.style.opacity = '1';
                nextBtn.style.opacity = '1';
            }
        }

        // Ir a slide específico
        function goToSlide(index) {
            if (index === currentIndex) return;

            currentIndex = index;
            updateSlidesPosition();
        }

        // ============================================
        // NAVEGACIÓN DE CRÉDITOS
        // ============================================
        
        /**
         * Navega entre créditos (anterior/siguiente)
         * @param {number} direction - Dirección: -1 para anterior, 1 para siguiente
         */
        function navigateCredit(direction) {
            const credits = creditsData[currentCategory];
            if (credits.length <= 1) return;

            lightVibration();
            currentIndex = (currentIndex + direction + credits.length) % credits.length;
            
            const updateFn = () => updateSlidesPosition();
            isOperaGX ? setTimeout(updateFn, CONFIG.OPERA_GX_DELAY) : updateFn();
        }

        const showPrevCredit = () => navigateCredit(-1);
        const showNextCredit = () => navigateCredit(1);

        // Alternar música
        function toggleMusic() {
            if (!userInteracted) {
                userInteracted = true;
                document.body.classList.add('user-interacted');
            }

            if (isMusicPlaying) {
                backgroundMusic.pause();
                audioToggle.textContent = '♪';
                audioToggle.style.opacity = '0.7';
                isMusicPlaying = false;
            } else {
                // Intenta reproducir la música
                const playPromise = backgroundMusic.play();

                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        audioToggle.textContent = '♫';
                        audioToggle.style.opacity = '1';
                        isMusicPlaying = true;
                    }).catch(error => {
                        console.log('Error al reproducir música:', error);
                        audioToggle.textContent = '♪';
                        audioToggle.style.opacity = '0.7';
                        isMusicPlaying = false;
                    });
                }
            }
        }

        /**
         * Añade animación de feedback visual a un botón
         * @param {HTMLElement} button - Botón a animar
         */
        const addButtonFeedback = (button) => {
            button.classList.add('clicked');
            setTimeout(() => button.classList.remove('clicked'), CONFIG.BUTTON_FEEDBACK_DURATION);
        };

        // Consolidar event listeners usando delegación de eventos
        const eventHandlers = {
            click: {
                prevButton: showPrevCredit,
                nextButton: showNextCredit,
                autoplayBtn: toggleAutoplay,
                audioToggle: toggleMusic
            }
        };

        // Event delegation para botones
        document.addEventListener('click', (e) => {
            const handler = eventHandlers.click[e.target.id];
            if (handler) {
                addButtonFeedback(e.target);
                handler();
            }
            
            // Manejar tabs de categoría
            if (e.target.classList.contains('category-tab')) {
                changeCategory(e.target.dataset.category);
            }
        });
        
        // Accesibilidad para audio toggle
        audioToggle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleMusic();
            }
        });

        // Navegación con teclado mejorada y accesible
        document.addEventListener('keydown', (e) => {
            // Solo procesar si no estamos en un input
            if (e.target.tagName === 'INPUT') return;
            
            // Navegación en tabs de categoría
            if (e.target.classList.contains('category-tab')) {
                const tabs = Array.from(document.querySelectorAll('.category-tab'));
                const currentIndex = tabs.indexOf(e.target);
                let nextTab;
                
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    nextTab = tabs[currentIndex - 1] || tabs[tabs.length - 1];
                } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    nextTab = tabs[currentIndex + 1] || tabs[0];
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    nextTab = tabs[0];
                } else if (e.key === 'End') {
                    e.preventDefault();
                    nextTab = tabs[tabs.length - 1];
                }
                
                if (nextTab) {
                    nextTab.focus();
                    nextTab.click();
                }
                return;
            }
            
            // Navegación global
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                showPrevCredit();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                showNextCredit();
            } else if (e.key === ' ' && e.target.tagName !== 'BUTTON') {
                e.preventDefault();
                toggleMusic();
            } else if (e.key === 'Escape') {
                if (isAutoplayActive) toggleAutoplay();
            } else if (e.key === 'Home') {
                e.preventDefault();
                goToSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                const credits = creditsData[currentCategory];
                goToSlide(credits.length - 1);
            }
        });

        // Navegación táctil mejorada para móviles
        let touchStartX = 0;
        let touchStartY = 0;

        creditsSlider.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        creditsSlider.addEventListener('touchmove', (e) => {
            // Prevenir scroll vertical durante el swipe horizontal
            if (Math.abs(e.changedTouches[0].screenX - touchStartX) >
                Math.abs(e.changedTouches[0].screenY - touchStartY)) {
                e.preventDefault();
            }
        }, { passive: false });

        creditsSlider.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;

            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            // Solo considerar como swipe si el movimiento horizontal es mayor que el vertical
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
                if (diffX > 0) {
                    showPrevCredit();
                } else {
                    showNextCredit();
                }
            }
        }, { passive: true });

        // ============================================
        // LAZY LOADING DE IMÁGENES
        // ============================================
        
        /**
         * Configura lazy loading para imágenes con IntersectionObserver
         */
        function setupLazyLoading() {
            if (!('IntersectionObserver' in window)) return;
            
            if (!imageObserver) {
                const handleIntersection = (entries) => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) return;
                        
                        const img = entry.target;
                        const src = img.dataset.src || img.getAttribute('data-src');
                        if (src) {
                            img.src = src;
                            img.removeAttribute('data-src');
                        }
                        img.classList.remove('loading');
                        imageObserver.unobserve(img);
                    });
                };
                
                imageObserver = new IntersectionObserver(handleIntersection, { 
                    rootMargin: CONFIG.LAZY_LOAD_MARGIN[isMobile ? 'mobile' : 'desktop'],
                    threshold: 0.01
                });
            }
            
            document.querySelectorAll('.credit-icon[data-src], .credit-icon.loading')
                .forEach(img => imageObserver.observe(img));
        }

        /**
         * Control del indicador de carga
         */
        const showLoading = () => loadingIndicator.style.display = 'block';
        const hideLoading = () => loadingIndicator.style.display = 'none';

        // Gestión de memoria para Opera GX
        function manageMemory() {
            if (isOperaGX && 'gc' in window) {
                try {
                    window.gc();
                } catch (e) {}
            }
        }
        
        // Gestión de almacenamiento compatible con Partitioned Cookies
        const StorageManager = {
            setItem: (key, value) => {
                try {
                    sessionStorage.setItem(key, value);
                } catch (e) {
                    console.warn('sessionStorage no disponible:', e);
                }
            },
            getItem: (key) => {
                try {
                    return sessionStorage.getItem(key);
                } catch (e) {
                    console.warn('sessionStorage no disponible:', e);
                    return null;
                }
            },
            removeItem: (key) => {
                try {
                    sessionStorage.removeItem(key);
                } catch (e) {
                    console.warn('sessionStorage no disponible:', e);
                }
            }
        };

        // Inicialización optimizada
        function initPage() {
            showLoading();
            adjustLayoutForSmallScreens();
            
            // Crear slides con delay para Opera GX
            if (isOperaGX) {
                setTimeout(() => {
                    createCreditSlides();
                    hideLoading();
                }, 50);
            } else {
                createCreditSlides();
                hideLoading();
            }

            // Precargar imágenes de forma optimizada
            const preloadImages = () => {
                if (isMobile || isOperaGX) {
                    // Solo precargar imágenes visibles
                    const firstImage = creditsData.collaborators[0];
                    if (firstImage) {
                        const img = new Image();
                        img.src = firstImage.icon;
                    }
                    requestIdleCallback(() => setupLazyLoading(), { timeout: 2000 });
                } else {
                    // Precargar en lotes para no bloquear el hilo principal
                    const allCredits = [...creditsData.collaborators, ...creditsData.externalCollaborators, ...creditsData.exCollaborators];
                    let index = 0;
                    const batchSize = 3;
                    
                    const loadBatch = () => {
                        const batch = allCredits.slice(index, index + batchSize);
                        batch.forEach(credit => {
                            const img = new Image();
                            img.src = credit.icon;
                        });
                        index += batchSize;
                        if (index < allCredits.length) {
                            requestIdleCallback(loadBatch, { timeout: 1000 });
                        }
                    };
                    requestIdleCallback(loadBatch, { timeout: 500 });
                }
            };
            
            preloadImages();

            // Configurar música
            backgroundMusic.volume = 0.7;
            backgroundMusic.preload = 'auto';

            // En móviles, no reproducir automáticamente
            if (!isMobile) {
                // Permitir que la música se reproduzca después de la interacción del usuario
                const enableMusic = function () {
                    userInteracted = true;
                    document.body.classList.add('user-interacted');

                    // Eliminar event listeners después de la primera interacción
                    document.removeEventListener('click', enableMusic);
                    document.removeEventListener('keydown', enableMusic);
                };

                document.addEventListener('click', enableMusic);
                document.addEventListener('keydown', enableMusic);
            }
        }

        // Inicializar cuando el DOM esté cargado
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }

        // Optimización para redimensionado de ventana con gestión de memoria
        let resizeTimeout;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimeout);
            const delay = isOperaGX ? 500 : 250;
            resizeTimeout = setTimeout(function () {
                adjustLayoutForSmallScreens();
                updateSlidesPosition();
                if (isOperaGX) manageMemory();
            }, delay);
        }, { passive: true });

        // Limpiar recursos cuando la página no es visible con optimizaciones para Opera GX
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                // Pausar música y autoplay cuando la pestaña no está visible
                if (isMusicPlaying && !backgroundMusic.paused) {
                    backgroundMusic.pause();
                }
                if (isAutoplayActive) {
                    clearInterval(autoplayInterval);
                }
                // Gestión agresiva de memoria para Opera GX
                if (isOperaGX) {
                    setTimeout(manageMemory, 1000);
                }
            } else {
                // Reanudar música y autoplay si estaban activos
                if (isMusicPlaying && backgroundMusic.paused) {
                    backgroundMusic.play().catch(error => {
                        console.log('Error al reanudar música:', error);
                    });
                }
                if (isAutoplayActive) {
                    autoplayInterval = setInterval(() => {
                        showNextCredit();
                    }, 3000);
                }
            }
        }, { passive: true });

        // Limpiar recursos antes de navegar
        window.addEventListener('beforeunload', function () {
            if (autoplayInterval) clearInterval(autoplayInterval);
            if (backgroundMusic) {
                backgroundMusic.pause();
                backgroundMusic.src = '';
            }
            if (imageObserver) imageObserver.disconnect();
        });

        // Consolidar eventos táctiles para mejor rendimiento
        if (isMobile) {
            let lastTouchY = 0;
            
            document.addEventListener('touchstart', (e) => {
                lastTouchY = e.touches[0].clientY;
                
                // Prevenir zoom con múltiples toques
                if (e.touches.length > 1 && (e.target === creditsSlider || e.target.closest('.credit-card'))) {
                    e.preventDefault();
                }
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                const touchY = e.touches[0].clientY;
                
                // Prevenir pull-to-refresh
                if (touchY > lastTouchY && window.scrollY === 0) {
                    e.preventDefault();
                }
                lastTouchY = touchY;
            }, { passive: false });
            
            // Prevenir zoom con doble toque
            document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
        }
    </script>
