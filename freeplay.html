<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Freeplay - Sonic.exe</title>
    <link rel="icon" type="image/png" href="images/logo_sonic_puto_exe.png">
    <!-- Bootstrap CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-red: #ff0000;
            --main-bg: #000;
            --glow-effect: 0 0 10px var(--main-red);
        }

        body {
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            text-shadow: var(--glow-effect), 0 0 20px var(--main-red);
            background: url('BG/backgroundlool.png') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: url('BG/backgroundlool.png') no-repeat center center;
            background-size: cover;
            z-index: -1;
            will-change: transform;
            transform: translateY(var(--parallax-y, 0));
        }

        .container-fluid.text-center {
            padding-top: 2rem;
            padding-bottom: 1rem !important;
            flex: 1;
            transition: all 0.5s ease;
        }

        .title {
            color: var(--main-red);
            text-shadow: 0 0 15px var(--main-red);
            font-size: 2.5rem;
            margin-bottom: 1.5rem !important;
            transition: all 0.5s ease;
        }

        .mods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .mods-grid.hiding {
            opacity: 0;
            transform: scale(0.95);
        }

        .mod-card {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid var(--main-red);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .mod-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.3);
            border-color: #fff;
        }

        .mod-card-image {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .mod-card:hover .mod-card-image {
            filter: brightness(1.2) saturate(1.3);
        }

        .mod-card-content {
            padding: 12px;
        }

        .mod-card-title {
            color: var(--main-red);
            font-size: 0.9rem;
            margin-bottom: 6px;
            text-shadow: var(--glow-effect);
        }

        .mod-card-info {
            color: #ccc;
            font-size: 0.7rem;
            margin-bottom: 8px;
        }

        .mod-card-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--main-red);
            color: #000;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 3;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: bold;
            z-index: 3;
            animation: pulse 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .status-badge.fade-out {
            opacity: 0;
            transform: scale(0);
        }

        .status-badge.new {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 10px #00ff00;
        }

        .status-badge.updated {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 10px #ffaa00;
        }

        .status-badge.popular {
            background: #ff00ff;
            color: #000;
            box-shadow: 0 0 10px #ff00ff;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        @keyframes ripple {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(4);
                opacity: 0;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.6);
            pointer-events: none;
            animation: ripple 0.6s ease-out;
        }

        .btn-clicked {
            animation: shake 0.3s ease;
        }

        .card-clicked {
            animation: cardPulse 0.4s ease;
        }

        @keyframes cardPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.95); }
        }

        .mod-card {
            opacity: 0;
            transform: translateY(30px);
        }
        
        .mod-card.animate-in {
            animation: cardFadeIn 0.6s ease forwards;
        }

        .mod-card.active {
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .mod-card-image-container {
            position: relative;
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mod-card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .mod-card-image.loaded {
            opacity: 1;
        }

        .image-loader {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 0, 0, 0.3);
            border-top: 3px solid var(--main-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #levelCatalogContainer {
            margin-bottom: 0;
        }

        .level-catalog:not(.showing) {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            display: none !important;
        }

        .back-button-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--main-bg);
            color: var(--main-red);
            border: 3px solid var(--main-red);
            border-radius: 0;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 25px;
            margin: 10px;
            transition: all 0.3s;
            text-shadow: var(--glow-effect);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            min-height: 44px;
        }

        .btn:hover {
            background: var(--main-red);
            color: var(--main-bg);
            box-shadow: 0 0 20px var(--main-red);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }
        .split-view {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            animation: fadeInSplit 0.5s ease;
        }

        @keyframes fadeInSplit {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .selected-mod-card {
            flex: 0 0 300px;
            transform: scale(1.05);
            animation: slideToLeft 0.5s ease;
            display: block !important;
            opacity: 1 !important;
        }

        .levels-section {
            flex: 1;
            animation: slideFromRight 0.5s ease;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid var(--main-red);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 30px var(--main-red);
        }

        .close-levels-btn {
            position: sticky;
            top: 0;
            z-index: 10;
            margin-bottom: 15px;
            background: var(--main-red);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-levels-btn:hover {
            background: #fff;
            transform: scale(1.05);
        }

        @keyframes slideToLeft {
            from {
                transform: translateX(0) scale(1);
            }
            to {
                transform: translateX(0) scale(1.05);
            }
        }

        @keyframes slideFromRight {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .level-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .level-item {
            flex: 1;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(20, 0, 0, 0.8));
            border: 2px solid var(--main-red);
            border-radius: 12px;
            padding: 0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
        }

        .level-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 0, 0, 0.1) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
            z-index: 1;
        }

        .level-item:hover::before {
            transform: translateX(100%);
        }

        .level-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.4);
            border-color: #fff;
        }

        .level-header {
            background: rgba(255, 0, 0, 0.1);
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .level-number {
            display: inline-block;
            background: var(--main-red);
            color: #000;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: bold;
            margin-right: 8px;
        }

        .level-name {
            color: #fff;
            font-size: 0.9rem;
            display: inline;
            text-shadow: 0 0 5px var(--main-red);
        }

        .level-artist {
            color: #aaa;
            font-size: 0.6rem;
            margin-top: 5px;
            display: block;
        }

        .level-content {
            padding: 15px;
            position: relative;
            z-index: 2;
        }

        .layout-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .layout-btn {
            background: rgba(0, 0, 0, 0.8);
            color: var(--main-red);
            border: 1px solid var(--main-red);
            border-radius: 20px;
            font-family: 'Press Start 2P', cursive;
            padding: 8px 12px;
            font-size: 0.6rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            flex: 1;
            text-align: center;
            min-height: 36px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .layout-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .layout-btn:hover::before {
            left: 100%;
        }

        .layout-btn:hover {
            background: var(--main-red);
            color: #000;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .layout-btn:active {
            transform: scale(0.95);
        }

        .layout-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: rgba(50, 50, 50, 0.5);
            color: #666;
            border-color: #666;
        }

        .layout-btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }
        @keyframes glitch {
            0% {
                text-shadow: 2px 0 red, -2px 0 cyan;
            }

            25% {
                text-shadow: -2px 0 red, 2px 0 cyan;
            }

            50% {
                text-shadow: 2px 0 red, -2px 0 cyan;
            }

            75% {
                text-shadow: -2px 0 red, 2px 0 cyan;
            }

            100% {
                text-shadow: 2px 0 red, -2px 0 cyan;
            }
        }

        .glitch-effect {
            animation: glitch 0.5s linear infinite;
        }

        .loading-spinner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            border: 5px solid rgba(255, 0, 0, 0.3);
            border-radius: 50%;
            border-top: 5px solid var(--main-red);
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
            display: none;
        }

        /* Mejoras táctiles y de feedback */
        .layout-btn:active,
        .btn:active {
            transform: scale(0.95);
            background: var(--main-red);
            color: var(--main-bg);
        }

        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Optimizaciones para dispositivos móviles */
        @supports (-webkit-touch-callout: none) {
            /* iOS Safari */
            body {
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }
        }

        /* Prevenir selección de texto en elementos interactivos */
        .mod-card, .btn, .layout-btn, .close-levels-btn {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Mejorar rendimiento de animaciones */
        .mod-card, .split-view, .levels-section {
            will-change: transform, opacity;
        }

        /* Optimizar scroll en iOS */
        .levels-section {
            -webkit-overflow-scrolling: touch;
        }

        /* ========== ESTILOS PARA MÓVIL ========== */
        @media (max-width: 768px) {
            :root {
                --glow-effect: 0 0 5px var(--main-red);
            }

            body {
                background-size: auto 100%;
                background-attachment: scroll;
                padding: 0;
                margin: 0;
            }

            .container-fluid.text-center {
                padding: 0.5rem !important;
            }

            .title {
                font-size: 1.5rem !important;
                margin-bottom: 1rem !important;
            }

            .back-button-container {
                margin-bottom: 15px;
            }

            .btn {
                padding: 8px 16px !important;
                font-size: 0.7rem !important;
                margin: 5px !important;
                border-width: 2px;
            }

            /* Grid de mods adaptado para móvil */
            .mods-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 12px;
                padding: 12px;
                justify-items: center;
            }

            .mod-card {
                max-width: 240px;
                width: 100%;
            }

            .mod-card {
                border-width: 2px;
            }

            .mod-card-image {
                height: 120px;
            }

            .mod-card-content {
                padding: 10px;
            }

            .mod-card-title {
                font-size: 0.8rem;
            }

            .mod-card-info {
                font-size: 0.7rem;
            }

            .mod-card-badge {
                font-size: 0.6rem;
                padding: 3px 6px;
            }

            /* Vista dividida adaptada para móvil */
            .split-view {
                flex-direction: column;
                gap: 15px;
            }

            .selected-mod-card {
                flex: none;
                transform: scale(1);
                max-width: 100%;
            }

            .levels-section {
                padding: 15px;
                border-width: 2px;
            }

            .close-levels-btn {
                font-size: 0.7rem;
                padding: 8px 15px;
                width: 100%;
                margin-bottom: 10px;
            }

            .levels-section h3 {
                font-size: 0.9rem;
                margin-bottom: 0.8rem !important;
            }

            .level-row {
                flex-direction: column;
                gap: 12px;
                margin-bottom: 15px;
            }

            .level-item {
                margin-bottom: 0;
                border-width: 2px;
            }

            .level-header {
                padding: 10px 12px;
            }

            .level-number {
                font-size: 0.5rem;
                padding: 1px 6px;
            }

            .level-name {
                font-size: 0.7rem;
            }

            .level-artist {
                font-size: 0.5rem;
            }

            .level-content {
                padding: 12px;
            }

            .layout-options {
                gap: 6px;
            }

            .layout-btn {
                font-size: 0.5rem !important;
                padding: 6px 10px !important;
                min-height: 32px;
                border-radius: 15px;
            }

            /* Loading spinner */
            .spinner {
                width: 40px;
                height: 40px;
                border-width: 4px;
            }

            /* Scrollbar móvil */
            .levels-section::-webkit-scrollbar {
                width: 8px;
            }

            .levels-section::-webkit-scrollbar-track {
                background: rgba(255, 0, 0, 0.1);
            }

            .levels-section::-webkit-scrollbar-thumb {
                background: var(--main-red);
                border-radius: 4px;
            }
        }

        /* Ajustes para pantallas muy pequeñas */
        @media (max-width: 480px) {
            .title {
                font-size: 1.2rem !important;
            }

            .mods-grid {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 10px;
                justify-items: center;
            }

            .mod-card {
                max-width: 280px;
                width: 100%;
            }

            .mod-card-image {
                height: 100px;
            }

            .mod-card-title {
                font-size: 0.8rem;
            }

            .btn {
                padding: 6px 12px !important;
                font-size: 0.6rem !important;
            }

            .levels-section {
                padding: 10px;
            }

            .close-levels-btn {
                font-size: 0.6rem;
                padding: 6px 12px;
            }

            .level-header {
                padding: 8px 10px;
            }

            .level-content {
                padding: 10px;
            }

            .layout-btn {
                font-size: 0.45rem !important;
                padding: 5px 8px !important;
                min-height: 30px;
                border-radius: 12px;
            }
        }

        /* Mejoras táctiles específicas para móvil */
        @media (hover: none) and (pointer: coarse) {
            .mod-card:hover {
                transform: none;
            }

            .mod-card:active {
                transform: scale(0.98);
                transition: transform 0.1s ease;
            }

            .layout-btn:hover {
                background: rgba(0, 0, 0, 0.7);
                color: var(--main-red);
            }

            .layout-btn:active {
                background: var(--main-red);
                color: var(--main-bg);
                transform: scale(0.95);
            }

            .btn:hover {
                background: var(--main-bg);
                color: var(--main-red);
            }

            .btn:active {
                background: var(--main-red);
                color: var(--main-bg);
                transform: scale(0.95);
            }
        }
    </style>
</head>

            const modsGrid = document.getElementById('modsGrid');
            const levelCatalogContainer = document.getElementById('levelCatalogContainer');
            let selectedModIndex = -1;

            // Sistema de badges vistos
            function getViewedBadges() {
                const viewed = localStorage.getItem('viewedBadges');
                return viewed ? JSON.parse(viewed) : [];
            }

            function markBadgeAsViewed(modId) {
                const viewed = getViewedBadges();
                if (!viewed.includes(modId)) {
                    viewed.push(modId);
                    localStorage.setItem('viewedBadges', JSON.stringify(viewed));
                }
            }

            function isBadgeViewed(modId) {
                return getViewedBadges().includes(modId);
            }

            // Sistema de caché de imágenes
            const imageCache = new Map();

            function preloadImage(src) {
                return new Promise((resolve, reject) => {
                    if (imageCache.has(src)) {
                        resolve(imageCache.get(src));
                        return;
                    }
                    const img = new Image();
                    img.onload = () => {
                        imageCache.set(src, img.src);
                        resolve(img.src);
                    };
                    img.onerror = reject;
                    img.src = src;
                });
            }

            // Intersection Observer para lazy loading
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const src = img.dataset.src;
                        if (src) {
                            preloadImage(src).then(cachedSrc => {
                                img.src = cachedSrc;
                                img.classList.add('loaded');
                                const loader = img.parentElement.querySelector('.image-loader');
                                if (loader) loader.style.display = 'none';
                            }).catch(() => {
                                img.src = 'images/placeholder.png';
                                img.classList.add('loaded');
                                const loader = img.parentElement.querySelector('.image-loader');
                                if (loader) loader.style.display = 'none';
                            });
                        }
                        observer.unobserve(img);
                    }
                });
            }, {
                rootMargin: '50px',
                threshold: 0.01
            });

            function hideLoadingSpinner() {
                setTimeout(() => {
                    loadingSpinner.style.display = 'none';
                }, 500);
            }

            function createLevelItem(level, levelIndex) {
                const levelItem = document.createElement('div');
                levelItem.className = 'level-item';

                // Header de la canción
                const levelHeader = document.createElement('div');
                levelHeader.className = 'level-header';

                const levelNumber = document.createElement('span');
                levelNumber.className = 'level-number';
                levelNumber.textContent = levelIndex.toString().padStart(2, '0');

                const levelName = document.createElement('span');
                levelName.className = 'level-name';
                levelName.textContent = level.name.toUpperCase();

                const levelArtist = document.createElement('span');
                levelArtist.className = 'level-artist';
                levelArtist.textContent = `vs ${level.title}`;

                levelHeader.appendChild(levelNumber);
                levelHeader.appendChild(levelName);
                levelHeader.appendChild(levelArtist);

                // Contenido de la canción
                const levelContent = document.createElement('div');
                levelContent.className = 'level-content';

                const layoutContainer = document.createElement('div');
                layoutContainer.className = 'layout-options';

                for (const [layoutType, layoutUrl] of Object.entries(level.layouts)) {
                    const layoutBtn = document.createElement('button');
                    layoutBtn.className = 'layout-btn';
                    
                    // Iconos para diferentes tipos de layout
                    let icon = '▶';
                    if (layoutType.toLowerCase().includes('vertical')) icon = '📱';
                    if (layoutType.toLowerCase().includes('horizontal')) icon = '💻';
                    if (layoutType.toLowerCase().includes('coming')) icon = '⏳';
                    if (layoutType.toLowerCase().includes('old')) icon = '🕰';
                    if (layoutType.toLowerCase().includes('new')) icon = '✨';
                    
                    layoutBtn.innerHTML = `${icon} ${layoutType.toUpperCase()}`;
                    
                    layoutBtn.onclick = (e) => {
                        e.preventDefault();
                        if (layoutUrl && layoutUrl.trim() !== '') {
                            // Efecto ripple
                            createRipple(e, layoutBtn);
                            
                            // Animación de click
                            layoutBtn.classList.add('btn-clicked');
                            
                            // Feedback visual mejorado
                            layoutBtn.style.background = '#00ff00';
                            layoutBtn.style.color = '#000';
                            layoutBtn.style.transform = 'scale(0.95)';
                            layoutBtn.textContent = '✓ ABRIENDO...';
                            
                            setTimeout(() => {
                                layoutBtn.innerHTML = `${icon} ${layoutType.toUpperCase()}`;
                                layoutBtn.style.background = '';
                                layoutBtn.style.color = '';
                                layoutBtn.style.transform = '';
                                layoutBtn.classList.remove('btn-clicked');
                            }, 1000);
                            
                            // Copiar URL y abrir
                            navigator.clipboard.writeText(layoutUrl).then(() => {
                                console.log('URL copiada:', layoutUrl);
                            }).catch(() => {
                                console.log('No se pudo copiar la URL');
                            });
                            window.open(layoutUrl, '_blank');
                        }
                    };
                    
                    if (!layoutUrl || layoutUrl.trim() === '') {
                        layoutBtn.disabled = true;
                    }
                    
                    layoutContainer.appendChild(layoutBtn);
                }

                levelContent.appendChild(layoutContainer);
                levelItem.appendChild(levelHeader);
                levelItem.appendChild(levelContent);

                return levelItem;
            }



            function createModCards() {
                modsGrid.innerHTML = '';
                modsData.mods.forEach((mod, index) => {
                    const card = document.createElement('div');
                    card.className = 'mod-card';
                    card.dataset.index = index;
                    card.style.animationDelay = `${index * 0.1}s`;
                    
                    const songCount = mod.levels.length;
                    const availableSongs = mod.levels.filter(level => 
                        Object.values(level.layouts).some(url => url && url.trim() !== '')
                    ).length;
                    
                    const showBadge = mod.status && !isBadgeViewed(mod.id);
                    const statusBadge = showBadge ? `<div class="status-badge ${mod.status}">${mod.status.toUpperCase()}</div>` : '';
                    
                    card.innerHTML = `
                        ${statusBadge}
                        <div class="mod-card-badge">${availableSongs} songs</div>
                        <div class="mod-card-image-container">
                            <div class="image-loader"></div>
                            <img class="mod-card-image" alt="${mod.title}" data-src="${mod.image}">
                        </div>
                        <div class="mod-card-content">
                            <div class="mod-card-title">${mod.title}</div>
                            <div class="mod-card-info">${songCount} total levels</div>
                        </div>
                    `;
                    
                    card.addEventListener('click', (e) => {
                        // Efecto ripple
                        createRipple(e, card);
                        
                        // Animación de click
                        card.classList.add('card-clicked');
                        setTimeout(() => card.classList.remove('card-clicked'), 400);
                        
                        // Ocultar badge si existe
                        const badge = card.querySelector('.status-badge');
                        if (badge && !isBadgeViewed(mod.id)) {
                            badge.classList.add('fade-out');
                            markBadgeAsViewed(mod.id);
                            setTimeout(() => badge.remove(), 300);
                        }
                        
                        // Remover clase active de todas las tarjetas
                        document.querySelectorAll('.mod-card').forEach(c => c.classList.remove('active'));
                        // Agregar clase active a la tarjeta seleccionada
                        card.classList.add('active');
                        selectedModIndex = index;
                        showModLevels(index);
                    });
                    
                    modsGrid.appendChild(card);
                    
                    // Activar animación de aparición
                    setTimeout(() => {
                        card.classList.add('animate-in');
                    }, index * 100);
                    
                    // Observar imagen para lazy loading
                    const img = card.querySelector('.mod-card-image');
                    if (img) {
                        imageObserver.observe(img);
                        // Fallback: cargar imagen inmediatamente si hay problemas
                        setTimeout(() => {
                            if (!img.classList.contains('loaded') && img.dataset.src) {
                                img.src = img.dataset.src;
                                img.classList.add('loaded');
                                const loader = img.parentElement.querySelector('.image-loader');
                                if (loader) loader.style.display = 'none';
                            }
                        }, 2000);
                    }
                });
                
                // Precargar primeras 3 imágenes inmediatamente
                modsData.mods.slice(0, 3).forEach(mod => {
                    if (mod.image) preloadImage(mod.image);
                });
            }
            
            function showModLevels(index) {
                const selectedCard = document.querySelector(`[data-index="${index}"]`);
                
                if (selectedCard) {
                    modsGrid.classList.add('hiding');
                    
                    setTimeout(() => {
                        const splitContainer = document.createElement('div');
                        splitContainer.className = 'split-view';
                        splitContainer.id = 'splitView';
                    
                    // Crear tarjeta seleccionada desde cero
                    const cardClone = document.createElement('div');
                    cardClone.className = 'mod-card selected-mod-card active';
                    
                    const mod = modsData.mods[index];
                    const songCount = mod.levels.length;
                    const availableSongs = mod.levels.filter(level => 
                        Object.values(level.layouts).some(url => url && url.trim() !== '')
                    ).length;
                    
                    const statusBadge = mod.status ? `<div class="status-badge ${mod.status}">${mod.status.toUpperCase()}</div>` : '';
                    
                    // Usar imagen cacheada si está disponible
                    const imgSrc = imageCache.has(mod.image) ? imageCache.get(mod.image) : mod.image;
                    
                    cardClone.innerHTML = `
                        ${statusBadge}
                        <div class="mod-card-badge">${availableSongs} songs</div>
                        <div class="mod-card-image-container">
                            <img class="mod-card-image loaded" src="${imgSrc}" alt="${mod.title}">
                        </div>
                        <div class="mod-card-content">
                            <div class="mod-card-title">${mod.title}</div>
                            <div class="mod-card-info">${songCount} total levels</div>
                        </div>
                    `;
                    
                    // Crear sección de niveles
                    const levelsSection = document.createElement('div');
                    levelsSection.className = 'levels-section';
                    
                    // Botón de cerrar con texto adaptativo
                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'close-levels-btn';
                    const isMobile = window.innerWidth <= 768;
                    closeBtn.textContent = isMobile ? '✕ CERRAR' : '✕ CLOSE LEVELS';
                    closeBtn.onclick = (e) => {
                        createRipple(e, closeBtn);
                        closeBtn.classList.add('btn-clicked');
                        setTimeout(() => {
                            closeBtn.classList.remove('btn-clicked');
                            closeLevels();
                        }, 200);
                    };
                    
                    // Agregar contenido del catálogo directamente
                    levelsSection.appendChild(closeBtn);
                    
                    // Agregar indicador de swipe en móviles
                    if (isMobile) {
                        const swipeHint = document.createElement('div');
                        swipeHint.style.cssText = `
                            text-align: center;
                            font-size: 0.6rem;
                            color: #666;
                            margin-bottom: 10px;
                            padding: 5px;
                            border: 1px dashed #333;
                            border-radius: 5px;
                        `;
                        swipeHint.textContent = '→ Desliza hacia la derecha para cerrar';
                        levelsSection.appendChild(swipeHint);
                    }
                    
                    // Copiar el contenido del catálogo original
                    const catalogTitle = document.createElement('h3');
                    catalogTitle.className = 'mb-4 glitch-effect';
                    catalogTitle.textContent = `${index + 1}. ${modsData.mods[index].title} LEVELS`;
                    levelsSection.appendChild(catalogTitle);
                    
                    // Crear filas de niveles
                    for (let i = 0; i < mod.levels.length; i += 2) {
                        const row = document.createElement('div');
                        row.className = 'level-row';
                        
                        if (mod.levels[i]) {
                            row.appendChild(createLevelItem(mod.levels[i], i + 1));
                        }
                        
                        if (mod.levels[i + 1]) {
                            row.appendChild(createLevelItem(mod.levels[i + 1], i + 2));
                        }
                        
                        levelsSection.appendChild(row);
                    }
                    
                        splitContainer.appendChild(cardClone);
                        splitContainer.appendChild(levelsSection);
                        
                        modsGrid.style.display = 'none';
                        modsGrid.classList.remove('hiding');
                        levelCatalogContainer.innerHTML = '';
                        levelCatalogContainer.appendChild(splitContainer);
                        levelCatalogContainer.style.display = 'block';
                    
                        if (isMobile) {
                            setTimeout(() => {
                                splitContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            }, 100);
                        }
                    }, 400);
                }
                
                // Actualizar URL con parámetros
                const url = new URL(window.location);
                url.searchParams.set('mod', index + 1);
                url.searchParams.set('name', modsData.mods[index].title.replace(/\s+/g, '-'));
                window.history.pushState({}, '', url);
            }
            
            function closeLevels() {
                // Limpiar contenedor de niveles primero
                levelCatalogContainer.innerHTML = '';
                levelCatalogContainer.style.display = 'none';
                
                // Restaurar vista de grid con forzado de reflow
                modsGrid.style.display = 'none';
                modsGrid.offsetHeight; // Forzar reflow
                modsGrid.style.display = 'grid';
                
                // Limpiar selección
                document.querySelectorAll('.mod-card').forEach(c => c.classList.remove('active'));
                selectedModIndex = -1;
                
                // Limpiar URL
                const url = new URL(window.location);
                url.searchParams.delete('mod');
                url.searchParams.delete('name');
                window.history.replaceState({}, '', url);
                
                // Scroll suave al inicio en móviles
                if (isMobileDevice()) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
            
            // Leer parámetros de URL al cargar
            function loadFromURL() {
                const urlParams = new URLSearchParams(window.location.search);
                const modParam = urlParams.get('mod');
                if (modParam) {
                    const modIndex = parseInt(modParam) - 1;
                    if (modIndex >= 0 && modIndex < modsData.mods.length) {
                        setTimeout(() => {
                            const card = document.querySelector(`[data-index="${modIndex}"]`);
                            if (card) {
                                card.classList.add('active');
                                selectedModIndex = modIndex;
                            }
                            showModLevels(modIndex);
                        }, 1000);
                    }
                }
            }
            // Navegación por teclado (PC) y botón atrás (móvil)
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && selectedModIndex !== -1) {
                    e.preventDefault();
                    closeLevels();
                }
            });

            // Manejar botón atrás del navegador en móviles
            window.addEventListener('popstate', function(e) {
                const urlParams = new URLSearchParams(window.location.search);
                if (!urlParams.has('mod') && selectedModIndex !== -1) {
                    closeLevels();
                }
            });

            // Orientación de pantalla
            window.addEventListener('orientationchange', function() {
                setTimeout(() => {
                    // Reajustar layout después del cambio de orientación
                    if (selectedModIndex !== -1) {
                        const splitView = document.getElementById('splitView');
                        if (splitView && window.innerWidth <= 768) {
                            // Forzar recálculo del layout
                            splitView.style.display = 'none';
                            splitView.offsetHeight; // Trigger reflow
                            splitView.style.display = 'flex';
                        }
                    }
                }, 500);
            });
            // Efecto de glitch aleatorio
            setInterval(() => {
                document.querySelectorAll('.glitch-effect').forEach(el => {
                    if (Math.random() > 0.7) {
                        el.classList.remove('glitch-effect');
                        void el.offsetWidth;
                        el.classList.add('glitch-effect');
                    }
                });
            }, 3000);

            // Funcionalidad táctil mejorada para móviles
            let touchStartX = 0;
            let touchStartY = 0;
            let isSwiping = false;

            // Prevenir doble-tap zoom (Android)
            document.addEventListener('dblclick', function (e) {
                e.preventDefault();
            }, { passive: false });

            // Prevenir gestos de zoom con múltiples toques
            document.addEventListener('gesturestart', function (e) {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gesturechange', function (e) {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gestureend', function (e) {
                e.preventDefault();
            }, { passive: false });

            // Gestos táctiles para navegación
            document.addEventListener('touchstart', function (e) {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isSwiping = false;
                }
            }, { passive: true });

            document.addEventListener('touchmove', function (e) {
                if (e.touches.length === 1 && !isSwiping) {
                    const touchX = e.touches[0].clientX;
                    const touchY = e.touches[0].clientY;
                    const deltaX = touchX - touchStartX;
                    const deltaY = touchY - touchStartY;

                    // Detectar swipe horizontal
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                        isSwiping = true;
                        
                        // Swipe hacia la derecha para cerrar niveles (solo en vista dividida)
                        if (deltaX > 0 && selectedModIndex !== -1 && window.innerWidth <= 768) {
                            closeLevels();
                        }
                    }
                }
            }, { passive: true });

            // Optimización para dispositivos móviles
            function isMobileDevice() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                       (window.innerWidth <= 768 && 'ontouchstart' in window);
            }

            // Ajustes específicos para móviles
            if (isMobileDevice()) {
                // Reducir animaciones en dispositivos de bajo rendimiento
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (prefersReducedMotion) {
                    document.documentElement.style.setProperty('--animation-duration', '0.1s');
                }

                // Optimizar scroll en iOS
                document.body.style.webkitOverflowScrolling = 'touch';
                
                // Mejorar rendimiento en dispositivos táctiles
                document.addEventListener('touchstart', function() {}, { passive: true });
            }
            // Función para crear efecto ripple
            function createRipple(event, element) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                
                const rect = element.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = event.clientX - rect.left - size / 2;
                const y = event.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                
                element.style.position = 'relative';
                element.style.overflow = 'hidden';
                element.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);
            }

            // Detección de capacidades del dispositivo
            function detectDeviceCapabilities() {
                const isMobile = isMobileDevice();
                const isLowEnd = navigator.hardwareConcurrency <= 2 || navigator.deviceMemory <= 2;
                
                if (isMobile || isLowEnd) {
                    // Reducir efectos visuales en dispositivos de bajo rendimiento
                    document.documentElement.style.setProperty('--glow-effect', '0 0 3px var(--main-red)');
                    
                    // Desactivar algunas animaciones
                    if (isLowEnd) {
                        const style = document.createElement('style');
                        style.textContent = `
                            .mod-card { animation: none !important; }
                            .glitch-effect { animation: none !important; }
                        `;
                        document.head.appendChild(style);
                    }
                }
            }
            // Feedback visual para botón de volver
            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    createRipple(e, backBtn);
                    backBtn.classList.add('btn-clicked');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 300);
                });
            }

            // Efecto parallax
            let ticking = false;
            document.documentElement.style.setProperty('--parallax-y', '0px');
            
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const scrolled = window.pageYOffset;
                        document.documentElement.style.setProperty('--parallax-y', scrolled * 0.3 + 'px');
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });

            // Inicialización
            detectDeviceCapabilities();
            createModCards();
            hideLoadingSpinner();
            loadFromURL();
            
            // Debug: Verificar que las tarjetas se crearon
            setTimeout(() => {
                const cards = document.querySelectorAll('.mod-card');
                console.log('Tarjetas creadas:', cards.length);
                if (cards.length === 0) {
                    console.error('No se crearon tarjetas. Reintentando...');
                    createModCards();
                }
            }, 1000);
        });
    </script>
</body>
