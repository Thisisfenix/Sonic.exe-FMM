<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Freeplay - Sonic.exe</title>
    <link rel="icon" type="image/png" href="images/logo_sonic_puto_exe.png">
    <!-- Bootstrap CSS -->
    <link href="Assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font -->

    <style>
        :root {
            --main-red: #ff0000;
            --main-bg: #000;
            --glow-effect: 0 0 10px var(--main-red);
        }

        body {
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            text-shadow: var(--glow-effect);
            background: url('Assets/BG/backgroundlool.png') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        .container-fluid {
            padding: 2rem 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .title {
            color: var(--main-red);
            text-shadow: 0 0 15px var(--main-red);
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .back-button-container {
            text-align: center;
            margin-bottom: 1rem;
        }

        .btn {
            background: var(--main-bg);
            color: var(--main-red);
            border: 3px solid var(--main-red);
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            padding: 10px 25px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: var(--main-red);
            color: var(--main-bg);
            text-decoration: none;
        }

        .carousel-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 2000px;
            overflow: hidden;
        }

        /* Firefox Android: simplificar 3D transforms */
        @supports (-moz-appearance:none) {
            @media (max-width: 768px) {
                .carousel-container {
                    perspective: none;
                }
                
                .carousel-track {
                    transform-style: flat;
                }
                
                .carousel-item {
                    transform-style: flat;
                }
                
                .mod-logo-3d {
                    transform-style: flat;
                }
            }
        }

        .carousel-track {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 700px;
            transform-style: preserve-3d;
        }

        .mods-grid {
            display: none;
        }

        /* NUEVO: Item del carousel contiene logo y textos separados */
        .carousel-item {
            position: absolute;
            left: 50%;
            top: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            transform-style: preserve-3d;
            transform-origin: center center;
        }

        /* Logo giratorio en 3D */
        .mod-logo-3d {
            width: 300px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mod-logo-3d img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.6));
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Nombre del mod flotante */
        .mod-title-float {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--main-red);
            font-size: 1.5rem;
            text-shadow: 0 0 20px var(--main-red), 0 0 40px var(--main-red);
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            pointer-events: none;
        }

        /* Contador flotante */
        .mod-count-float {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .count-number {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 30px var(--main-red), 0 0 60px var(--main-red);
            font-weight: bold;
            line-height: 1;
        }

        .count-label {
            font-size: 0.7rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        /* Badge de status */
        .status-badge {
            position: absolute;
            top: -20px;
            right: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 3;
            text-transform: uppercase;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(15deg);
        }

        .status-badge.new {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00, 0 0 40px rgba(0, 255, 0, 0.5);
        }

        .status-badge.updated {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 20px #ffaa00, 0 0 40px rgba(255, 170, 0, 0.5);
        }

        .status-badge.popular {
            background: #ff00ff;
            color: #000;
            box-shadow: 0 0 20px #ff00ff, 0 0 40px rgba(255, 0, 255, 0.5);
        }

        /* POSICIONES DEL CAROUSEL */
        .carousel-item.center {
            z-index: 10;
            transform: translate(-50%, -50%) translateX(0) translateZ(0) scale(1);
        }

        .carousel-item.center .mod-logo-3d {
            animation: rotateY360 20s linear infinite;
        }

        @keyframes rotateY360 {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .carousel-item.center .mod-logo-3d img {
            filter: drop-shadow(0 0 40px rgba(255, 0, 0, 0.9)) drop-shadow(0 0 80px rgba(255, 0, 0, 0.6));
        }

        .carousel-item.center .mod-title-float {
            opacity: 1;
            top: -90px;
        }

        .carousel-item.center .mod-count-float {
            opacity: 1;
            bottom: -100px;
        }

        .carousel-item.center .status-badge {
            opacity: 1;
        }

        /* Laterales izquierdos */
        .carousel-item.left-1 {
            z-index: 9;
            transform: translate(-50%, -50%) translateX(-500px) translateZ(-300px) scale(0.6) rotateY(45deg);
        }

        .carousel-item.left-1 .mod-logo-3d img {
            opacity: 0.5;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.3));
        }

        .carousel-item.left-2 {
            z-index: 8;
            transform: translate(-50%, -50%) translateX(-900px) translateZ(-600px) scale(0.4) rotateY(60deg);
        }

        .carousel-item.left-2 .mod-logo-3d img {
            opacity: 0.3;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.2));
        }

        /* Laterales derechos */
        .carousel-item.right-1 {
            z-index: 9;
            transform: translate(-50%, -50%) translateX(500px) translateZ(-300px) scale(0.6) rotateY(-45deg);
        }

        .carousel-item.right-1 .mod-logo-3d img {
            opacity: 0.5;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.3));
        }

        .carousel-item.right-2 {
            z-index: 8;
            transform: translate(-50%, -50%) translateX(900px) translateZ(-600px) scale(0.4) rotateY(-60deg);
        }

        .carousel-item.right-2 .mod-logo-3d img {
            opacity: 0.3;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.2));
        }

        /* Ocultos */
        .carousel-item.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) translateX(1500px) translateZ(-1000px) scale(0.2);
        }

        /* DEPRECATED: old card styles para compatibilidad */
        .mod-card {
            display: none;
        }

        .mod-card-image {
            display: none;
        }

        .mod-card-content {
            display: none;
        }

        .mod-info {
            display: none;
        }

        .mod-card-title {
            display: none;
        }

        .mod-card-info {
            display: none;
        }

        .mod-stats {
            display: none;
        }
        
        .mod-stats-number {
            display: none;
        }
        
        .mod-stats-label {
            display: none;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.8);
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s;
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 10px #000;
        }

        .carousel-nav:hover {
            background: rgba(255, 50, 50, 1);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
        }

        .carousel-nav:active {
            transform: translateY(-50%) scale(0.95);
        }

        .carousel-nav.prev {
            left: 50px;
        }

        .carousel-nav.next {
            right: 50px;
        }

        .carousel-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .indicator-dot {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid var(--main-red);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .indicator-dot.active {
            background: var(--main-red);
            box-shadow: 0 0 15px var(--main-red);
            transform: scale(1.3);
        }

        .indicator-dot:hover {
            background: rgba(255, 0, 0, 0.6);
        }

        .split-view {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            opacity: 0;
            transform: translateX(100%);
            animation: slideInFromRight 0.5s ease forwards;
        }

        @keyframes slideInFromRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .split-view.closing {
            animation: slideOutToRight 0.4s ease forwards;
        }

        @keyframes slideOutToRight {
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        .levels-section {
            flex: 1;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid var(--main-red);
            padding: 20px;
            border-radius: 10px;
            overflow-y: auto;
            max-height: calc(100vh - 100px);
        }

        .selected-mod-card {
            min-height: 300px;
            width: 250px;
            display: flex;
            flex-direction: column;
            text-align: center;
            flex-shrink: 0;
            background: rgba(255, 0, 0, 0.1);
            border: 3px solid #fff;
            border-radius: 10px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .mod-info-panel {
            width: 100%;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 3px solid var(--main-red);
        }

        .mod-icon {
            font-size: 4rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .mod-name-display {
            font-size: 0.8rem;
            color: var(--main-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .selected-mod-card .mod-card-content {
            padding: 0;
            flex-direction: column;
            gap: 8px;
        }

        .selected-mod-card .mod-card-title {
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .selected-mod-card .mod-card-info {
            font-size: 0.6rem;
        }

        .close-levels-btn {
            background: var(--main-red);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .level-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .level-item {
            flex: 1;
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid var(--main-red);
            border-radius: 10px;
            padding: 15px;
        }

        .level-name {
            color: #fff;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .layout-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .layout-btn {
            background: var(--main-bg);
            color: var(--main-red);
            border: 1px solid var(--main-red);
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 0.6rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Press Start 2P', cursive;
        }

        .layout-btn:hover {
            background: var(--main-red);
            color: var(--main-bg);
        }

        /* Loading Spinner */
        .loading-spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 0, 0, 0.3);
            border-top: 3px solid var(--main-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animations */
        .mod-card {
            opacity: 0;
            transform: translateY(20px);
        }

        .mod-card.animate-in {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.6s ease;
        }

        .mods-grid.hiding {
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.4s ease;
        }

        .card-clicked {
            transform: scale(0.98) !important;
            transition: transform 0.2s ease !important;
        }

        .btn-clicked {
            transform: scale(0.95) !important;
            transition: transform 0.2s ease !important;
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Level styling improvements */
        .level-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 0, 0, 0.3);
        }

        .level-number {
            background: var(--main-red);
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: bold;
            min-width: 25px;
            text-align: center;
        }

        .level-artist {
            color: #999;
            font-size: 0.6rem;
            font-style: italic;
        }

        .level-content {
            margin-top: 10px;
        }

        .mod-card-badge {
            background: var(--main-red);
            color: #000;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: bold;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 1.5rem;
            }
            
            .mods-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 10px;
            }
            
            .carousel-track {
                height: 500px;
            }
            
            .mod-logo-3d {
                width: 250px;
                height: 250px;
            }
            
            .carousel-item.center .mod-logo-3d {
                width: 250px;
                height: 250px;
            }
            
            .carousel-item.center .mod-title-float {
                font-size: 1.2rem;
                top: -80px;
            }
            
            .carousel-item.center .mod-count-float {
                bottom: -80px;
            }
            
            .carousel-item.center .count-number {
                font-size: 2.5rem;
            }
            
            .carousel-item.center .count-label {
                font-size: 0.7rem;
            }
            
            /* Simplificar transformaciones 3D en móvil */
            .carousel-item.left-1 {
                transform: translate(-50%, -50%) translateX(-300px) scale(0.55);
            }
            
            .carousel-item.right-1 {
                transform: translate(-50%, -50%) translateX(300px) scale(0.55);
            }
            
            .carousel-item.left-2,
            .carousel-item.right-2,
            .carousel-item.hidden {
                opacity: 0;
                pointer-events: none;
                display: none;
            }
            
            .carousel-nav {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }
            
            .carousel-nav.prev {
                left: 20px;
            }
            
            .carousel-nav.next {
                right: 20px;
            }
            
            .carousel-indicator {
                bottom: 15px;
                gap: 10px;
            }
            
            .indicator-dot {
                width: 10px;
                height: 10px;
            }
            
            .split-view {
                flex-direction: column;
            }
            
            .level-row {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>

</head>

            // Sistema de caché de imágenes simplificado
            function preloadImage(src) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve(img.src);
                    img.onerror = () => resolve(src); // Fallback
                    img.src = src;
                });
            }

            // Intersection Observer simplificado
            const imageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const src = img.dataset.src;
                        if (src) {
                            img.src = src;
                            img.classList.add('loaded');
                            const loader = img.parentElement.querySelector('.image-loader');
                            if (loader) loader.style.display = 'none';
                        }
                        imageObserver.unobserve(img);
                    }
                });
            });

                    if (layoutType.toLowerCase().includes('coming')) icon = '⏳';
                    if (layoutType.toLowerCase().includes('old')) icon = '🕰';
                    if (layoutType.toLowerCase().includes('new')) icon = '✨';
                    
                    layoutBtn.innerHTML = `${icon} ${layoutType.toUpperCase()}`;
                    
                    layoutBtn.onclick = (e) => {
                        e.preventDefault();

                    if (!layoutUrl || layoutUrl.trim() === '') {

            // Función para cargar el conteo de canciones de un mod
            async function loadSongCount(mod) {
                let songCount = mod.levels.length;
                let availableSongs = mod.levels.filter(level => 
                    Object.values(level.layouts).some(url => url && url.trim() !== '')
                ).length;
                
                if (SPECIAL_MODS_CONFIG.songsCountFiles[mod.id]) {
                    try {
                        const response = await fetch(SPECIAL_MODS_CONFIG.songsCountFiles[mod.id]);
                        if (response.ok) {
                            const data = await response.json();
                            songCount = data.totalSongs;
                            availableSongs = data.availableSongs;
                        }
                    } catch (error) {
                        console.log('Could not load song count for', mod.id);
                    }
                }
                
                return { songCount, availableSongs };
            }

            // ══════════════════════════════════════════════════════════════

            let currentCarouselIndex = 0;
            const carouselTrack = document.getElementById('carouselTrack');
            const carouselPrev = document.getElementById('carouselPrev');
            const carouselNext = document.getElementById('carouselNext');
            const carouselIndicator = document.getElementById('carouselIndicator');
            
            async function createCarousel() {
                carouselTrack.innerHTML = '';
                carouselIndicator.innerHTML = '';
                
                for (let i = 0; i < modsData.mods.length; i++) {
                    const mod = modsData.mods[i];
                    
                    // Cargar conteo de canciones
                    const { songCount, availableSongs } = await loadSongCount(mod);
                    
                    // Crear item del carousel con logo 3D y textos flotantes
                    const item = document.createElement('div');
                    item.className = 'carousel-item';
                    item.dataset.index = i;
                    
                    const showBadge = mod.status && !isBadgeViewed(mod.id);
                    const statusBadge = showBadge ? `<div class="status-badge ${mod.status}">${mod.status.toUpperCase()}</div>` : '';
                    
                    item.innerHTML = `
                        ${statusBadge}
                        <div class="mod-title-float">${mod.title}</div>
                        <div class="mod-logo-3d">
                            <img src="${mod.image}" alt="${mod.title}">
                        </div>
                        <div class="mod-count-float">
                            <div class="count-number">${availableSongs}</div>
                            <div class="count-label">Songs Available</div>
                        </div>
                    `;
                    
                    item.addEventListener('click', () => handleCarouselClick(mod, i));
                    carouselTrack.appendChild(item);
                    
                    // Crear indicador
                    const dot = document.createElement('div');
                    dot.className = 'indicator-dot';
                    dot.addEventListener('click', () => goToSlide(i));
                    carouselIndicator.appendChild(dot);
                }
                
                updateCarouselPositions();
            }
            
            function updateCarouselPositions() {
                const items = carouselTrack.querySelectorAll('.carousel-item');
                const dots = carouselIndicator.querySelectorAll('.indicator-dot');
                const total = items.length;
                
                items.forEach((item, index) => {
                    item.className = 'carousel-item';
                    const diff = index - currentCarouselIndex;
                    
                    if (diff === 0) {
                        item.classList.add('center');
                    } else if (diff === 1 || diff === -(total - 1)) {
                        item.classList.add('right-1');
                    } else if (diff === 2 || diff === -(total - 2)) {
                        item.classList.add('right-2');
                    } else if (diff === -1 || diff === total - 1) {
                        item.classList.add('left-1');
                    } else if (diff === -2 || diff === total - 2) {
                        item.classList.add('left-2');
                    } else {
                        item.classList.add('hidden');
                    }
                });
                
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentCarouselIndex);
                });
            }
            
            function goToSlide(index) {
                currentCarouselIndex = index;
                updateCarouselPositions();
                playSound(scrollSound);
            }
            
            function nextSlide() {
                currentCarouselIndex = (currentCarouselIndex + 1) % modsData.mods.length;
                updateCarouselPositions();
                playSound(scrollSound);
            }
            
            function prevSlide() {
                currentCarouselIndex = (currentCarouselIndex - 1 + modsData.mods.length) % modsData.mods.length;
                updateCarouselPositions();
                playSound(scrollSound);
            }
            
            function handleCarouselClick(mod, index) {
                if (index !== currentCarouselIndex) {
                    goToSlide(index);
                    return;
                }
                
                // Verificar si es COMING SOON
                if (mod.status === 'coming-soon') {
                    showComingSoonModal(mod);
                    playSound(confirmSound);
                    return;
                }
                
                // Verificar si es un mod con freeplay especial
                if (handleModRedirect(mod)) {
                    return;
                }
                
                // Para mods sin freeplay propio, mostrar lista de canciones
                selectedModIndex = index;
                showModLevels(index);
                playSound(confirmSound);
            }
            
            carouselPrev.addEventListener('click', prevSlide);
            carouselNext.addEventListener('click', nextSlide);
            
            // Navegación con teclado
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') prevSlide();
                if (e.key === 'ArrowRight') nextSlide();
            });

                    const statusBadge = mod.status ? `<div class="status-badge ${mod.status}">${mod.status.toUpperCase()}</div>` : '';
                    
                    // Usar imagen directamente o fallback

                    cardClone.innerHTML = `

                        closeBtn.classList.add('btn-clicked');

                            closeBtn.classList.remove('btn-clicked');
                            closeLevels();
                        }, 200);
                    };
                    
                    // Agregar contenido del catálogo directamente
                    levelsSection.appendChild(closeBtn);
                    
                    // Agregar indicador de swipe en móviles
                    if (isMobile) {

                        swipeHint.style.cssText = `
                            text-align: center;

                    // Copiar el contenido del catálogo original
                    const catalogTitle = document.createElement('h3');

                    catalogTitle.textContent = `${index + 1}. ${modsData.mods[index].title} LEVELS`;

                    for (let i = 0; i < mod.levels.length; i += 2) {

                    }
                    
                        splitContainer.appendChild(cardClone);
                        splitContainer.appendChild(levelsSection);
                        
                        modsGrid.style.display = 'none';
                        modsGrid.classList.remove('hiding');
                        levelCatalogContainer.innerHTML = '';

                        if (isMobile) {
                            setTimeout(() => {
                                splitContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            }, 100);
                        }
                    }, 400);
                }
                
                // Actualizar URL con parámetros
                const url = new URL(window.location);
                url.searchParams.set('mod', index + 1);
                url.searchParams.set('name', modsData.mods[index].title.replace(/\s+/g, '-'));
                window.history.pushState({}, '', url);

            function closeLevels() {
                const splitView = document.getElementById('splitView');
                if (splitView) {
                    splitView.classList.add('closing');
                    
                    setTimeout(() => {
                        // Limpiar contenedor de niveles
                        levelCatalogContainer.innerHTML = '';
                        levelCatalogContainer.style.display = 'none';
                        
                        // Restaurar vista del carrusel
                        const carouselContainer = document.getElementById('carouselContainer');
                        if (carouselContainer) {
                            carouselContainer.style.display = 'flex';
                        }
                        
                        // Restaurar vista de grid con animación
                        modsGrid.style.display = 'flex';
                        modsGrid.style.opacity = '0';
                        modsGrid.style.transform = 'scale(0.95)';
                        
                        setTimeout(() => {
                            modsGrid.style.opacity = '1';
                            modsGrid.style.transform = 'scale(1)';
                            modsGrid.style.transition = 'all 0.4s ease';
                        }, 50);
                        
                        // Limpiar selección
                        document.querySelectorAll('.mod-card').forEach(c => c.classList.remove('active'));
                        selectedModIndex = -1;
                        
                        // Limpiar URL
                        const url = new URL(window.location);
                        url.searchParams.delete('mod');
                        url.searchParams.delete('name');
                        window.history.replaceState({}, '', url);
                        
                        // Scroll suave al inicio en móviles
                        if (isMobileDevice()) {
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    }, 400);
                }
            }
            
            // Leer parámetros de URL al cargar
            function loadFromURL() {
                const urlParams = new URLSearchParams(window.location.search);
                const modParam = urlParams.get('mod');
                if (modParam) {
                    const modIndex = parseInt(modParam) - 1;
                    if (modIndex >= 0 && modIndex < modsData.mods.length) {
                        setTimeout(() => {
                            const card = document.querySelector(`[data-index="${modIndex}"]`);
                            if (card) {
                                card.classList.add('active');
                                selectedModIndex = modIndex;
                            }
                            showModLevels(modIndex);
                        }, 1000);
                    }
                }
            }
            // Navegación por teclado (PC) y botón atrás (móvil)
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && selectedModIndex !== -1) {
                    e.preventDefault();
                    closeLevels();
                }
            });

            // Manejar botón atrás del navegador en móviles
            window.addEventListener('popstate', function(e) {
                const urlParams = new URLSearchParams(window.location.search);
                if (!urlParams.has('mod') && selectedModIndex !== -1) {
                    closeLevels();
                }
            });

            // Orientación de pantalla
            window.addEventListener('orientationchange', function() {
                setTimeout(() => {
                    // Reajustar layout después del cambio de orientación
                    if (selectedModIndex !== -1) {
                        const splitView = document.getElementById('splitView');
                        if (splitView && window.innerWidth <= 768) {
                            // Forzar recálculo del layout
                            splitView.style.display = 'none';
                            splitView.offsetHeight; // Trigger reflow
                            splitView.style.display = 'flex';
                        }
                    }
                }, 500);
            });
            // Efecto de glitch simplificado
            setInterval(() => {
                const elements = document.querySelectorAll('.glitch-effect');
                if (elements.length > 0 && Math.random() > 0.8) {
                    const el = elements[Math.floor(Math.random() * elements.length)];
                    el.style.animation = 'none';
                    setTimeout(() => el.style.animation = '', 10);
                }
            }, 5000);

            // Funcionalidad táctil mejorada para móviles
            let touchStartX = 0;
            let touchStartY = 0;
            let isSwiping = false;

            // Prevenir doble-tap zoom (Android)
            document.addEventListener('dblclick', function (e) {
                e.preventDefault();
            }, { passive: false });

            // Prevenir gestos de zoom con múltiples toques
            document.addEventListener('gesturestart', function (e) {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gesturechange', function (e) {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gestureend', function (e) {
                e.preventDefault();
            }, { passive: false });

            // Gestos táctiles para navegación
            document.addEventListener('touchstart', function (e) {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isSwiping = false;
                }
            }, { passive: true });

            document.addEventListener('touchmove', function (e) {
                if (e.touches.length === 1 && !isSwiping) {
                    const touchX = e.touches[0].clientX;
                    const touchY = e.touches[0].clientY;
                    const deltaX = touchX - touchStartX;
                    const deltaY = touchY - touchStartY;

                    // Detectar swipe horizontal
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                        isSwiping = true;
                        
                        // Swipe hacia la derecha para cerrar niveles (solo en vista dividida)
                        if (deltaX > 0 && selectedModIndex !== -1 && window.innerWidth <= 768) {
                            closeLevels();
                        }
                    }
                }
            }, { passive: true });

            // Optimización para dispositivos móviles
            function isMobileDevice() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                       (window.innerWidth <= 768 && 'ontouchstart' in window);
            }

            // Ajustes específicos para móviles
            if (isMobileDevice()) {
                // Reducir animaciones en dispositivos de bajo rendimiento
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (prefersReducedMotion) {
                    document.documentElement.style.setProperty('--animation-duration', '0.1s');
                }

                // Optimizar scroll en iOS
                document.body.style.webkitOverflowScrolling = 'touch';
                
                // Mejorar rendimiento en dispositivos táctiles
                document.addEventListener('touchstart', function() {}, { passive: true });
            }
            // Función para crear efecto ripple
            function createRipple(event, element) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                
                const rect = element.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = event.clientX - rect.left - size / 2;
                const y = event.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                
                element.style.position = 'relative';
                element.style.overflow = 'hidden';
                element.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);
            }

            // Detección de capacidades del dispositivo
            function detectDeviceCapabilities() {
                const isMobile = isMobileDevice();
                const isLowEnd = navigator.hardwareConcurrency <= 2 || navigator.deviceMemory <= 2;
                
                if (isMobile || isLowEnd) {
                    // Reducir efectos visuales en dispositivos de bajo rendimiento
                    document.documentElement.style.setProperty('--glow-effect', '0 0 3px var(--main-red)');
                    
                    // Desactivar algunas animaciones
                    if (isLowEnd) {
                        const style = document.createElement('style');
                        style.textContent = `
                            .mod-card { animation: none !important; }
                            .glitch-effect { animation: none !important; }
                        `;
                        document.head.appendChild(style);
                    }
                }
            }
            // Feedback visual para botón de volver
            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    createRipple(e, backBtn);
                    backBtn.classList.add('btn-clicked');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 300);
                });
            }

            // Efecto parallax simplificado
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking && window.innerWidth > 768) {
                    requestAnimationFrame(() => {
                        const scrolled = window.pageYOffset;
                        document.documentElement.style.setProperty('--parallax-y', scrolled * 0.2 + 'px');
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });

            // Inicialización
            detectDeviceCapabilities();
            createCarousel();
            hideLoadingSpinner();
            loadFromURL();
            
            // Función para mostrar modal COMING SOON
            function showComingSoonModal(mod) {
                // Crear modal
                const modal = document.createElement('div');
                modal.id = 'comingSoonModal';
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.9);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 10000;
                    animation: fadeIn 0.3s ease;
                `;
                
                const modalContent = document.createElement('div');
                modalContent.style.cssText = `
                    background: #000;
                    border: 4px solid #ff0000;
                    border-radius: 10px;
                    padding: 40px;
                    text-align: center;
                    max-width: 500px;
                    box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
                    animation: scaleIn 0.3s ease;
                `;
                
                modalContent.innerHTML = `
                    <h2 style="color: #ff0000; font-size: 2rem; margin-bottom: 20px; text-shadow: 0 0 20px #ff0000;">
                        ${mod.title}
                    </h2>
                    <div style="font-size: 3rem; margin: 30px 0; color: #ffff00; text-shadow: 0 0 30px #ffff00;">
                        🚧 COMING SOON 🚧
                    </div>
                    <p style="color: #fff; font-size: 0.9rem; margin-bottom: 30px; line-height: 1.6;">
                        Este mod está en desarrollo.<br>
                        ¡Mantente atento para futuras actualizaciones!
                    </p>
                    <button id="closeComingSoonBtn" style="
                        background: #ff0000;
                        color: #000;
                        border: none;
                        padding: 15px 40px;
                        font-family: 'Press Start 2P', cursive;
                        font-size: 0.8rem;
                        cursor: pointer;
                        border-radius: 5px;
                        transition: all 0.3s;
                    ">
                        CERRAR
                    </button>
                `;
                
                modal.appendChild(modalContent);
                document.body.appendChild(modal);
                
                // Cerrar modal
                const closeBtn = document.getElementById('closeComingSoonBtn');
                closeBtn.addEventListener('click', () => {
                    modal.style.animation = 'fadeOut 0.3s ease';
                    setTimeout(() => modal.remove(), 300);
                });
                
                // Cerrar con ESC
                const handleEsc = (e) => {
                    if (e.key === 'Escape') {
                        modal.style.animation = 'fadeOut 0.3s ease';
                        setTimeout(() => modal.remove(), 300);
                        document.removeEventListener('keydown', handleEsc);
                    }
                };
                document.addEventListener('keydown', handleEsc);
                
                // Cerrar al hacer click fuera
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.style.animation = 'fadeOut 0.3s ease';
                        setTimeout(() => modal.remove(), 300);
                    }
                });
                
                // Añadir animaciones CSS
                if (!document.getElementById('modalAnimations')) {
                    const style = document.createElement('style');
                    style.id = 'modalAnimations';
                    style.textContent = `
                        @keyframes fadeIn {
                            from { opacity: 0; }
                            to { opacity: 1; }
                        }
                        @keyframes fadeOut {
                            from { opacity: 1; }
                            to { opacity: 0; }
                        }
                        @keyframes scaleIn {
                            from { transform: scale(0.8); opacity: 0; }
                            to { transform: scale(1); opacity: 1; }
                        }
                    `;
                    document.head.appendChild(style);
                }
            }
        });
    </script>
</body>
