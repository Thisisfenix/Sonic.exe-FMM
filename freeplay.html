    <style>
        :root {
            --main-red: #ff0000;
            --main-bg: #000;
            --glow-effect: 0 0 10px var(--main-red);
        }

        body {
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            text-shadow: var(--glow-effect);
            background: url('BG/backgroundlool.png') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container-fluid {
            padding: 2rem 1rem;
        }

        .title {
            color: var(--main-red);
            text-shadow: 0 0 15px var(--main-red);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .back-button-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .btn {
            background: var(--main-bg);
            color: var(--main-red);
            border: 3px solid var(--main-red);
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            padding: 10px 25px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: var(--main-red);
            color: var(--main-bg);
            text-decoration: none;
        }

        .mods-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
        }

        .mod-card {
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid var(--main-red);
            border-radius: 10px;
            display: flex;
            align-items: center;
            min-height: 100px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .mod-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.4);
            border-color: #fff;
        }

        .mod-card.active {
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .mod-card-image {
            width: 120px;
            height: 80px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .mod-card-content {
            padding: 15px;
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mod-info {
            flex: 1;
        }

        .mod-card-title {
            color: var(--main-red);
            font-size: 1rem;
            margin-bottom: 5px;
            text-shadow: var(--glow-effect);
        }

        .mod-card-info {
            color: #ccc;
            font-size: 0.7rem;
        }

        .mod-stats {
            text-align: right;
            color: #fff;
            font-size: 0.8rem;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 130px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: bold;
            z-index: 3;
        }

        .status-badge.new {
            background: #00ff00;
            color: #000;
        }

        .status-badge.updated {
            background: #ffaa00;
            color: #000;
        }

        .status-badge.popular {
            background: #ff00ff;
            color: #000;
        }

        .split-view {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            opacity: 0;
            transform: translateX(100%);
            animation: slideInFromRight 0.5s ease forwards;
        }

        @keyframes slideInFromRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .split-view.closing {
            animation: slideOutToRight 0.4s ease forwards;
        }

        @keyframes slideOutToRight {
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        .levels-section {
            flex: 1;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid var(--main-red);
            padding: 20px;
            border-radius: 10px;
        }

        .selected-mod-card {
            min-height: 300px;
            width: 250px;
            display: flex;
            flex-direction: column;
            text-align: center;
            flex-shrink: 0;
            background: rgba(255, 0, 0, 0.1);
            border: 3px solid #fff;
            border-radius: 10px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .mod-info-panel {
            width: 100%;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 3px solid var(--main-red);
        }

        .mod-icon {
            font-size: 4rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .mod-name-display {
            font-size: 0.8rem;
            color: var(--main-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .selected-mod-card .mod-card-content {
            padding: 0;
            flex-direction: column;
            gap: 8px;
        }

        .selected-mod-card .mod-card-title {
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .selected-mod-card .mod-card-info {
            font-size: 0.6rem;
        }

        .close-levels-btn {
            background: var(--main-red);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .level-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .level-item {
            flex: 1;
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid var(--main-red);
            border-radius: 10px;
            padding: 15px;
        }

        .level-name {
            color: #fff;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .layout-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .layout-btn {
            background: var(--main-bg);
            color: var(--main-red);
            border: 1px solid var(--main-red);
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 0.6rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Press Start 2P', cursive;
        }

        .layout-btn:hover {
            background: var(--main-red);
            color: var(--main-bg);
        }

        /* Loading Spinner */
        .loading-spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 0, 0, 0.3);
            border-top: 3px solid var(--main-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animations */
        .mod-card {
            opacity: 0;
            transform: translateY(20px);
        }

        .mod-card.animate-in {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.6s ease;
        }

        .mods-grid.hiding {
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.4s ease;
        }

        .card-clicked {
            transform: scale(0.98) !important;
            transition: transform 0.2s ease !important;
        }

        .btn-clicked {
            transform: scale(0.95) !important;
            transition: transform 0.2s ease !important;
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Level styling improvements */
        .level-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 0, 0, 0.3);
        }

        .level-number {
            background: var(--main-red);
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: bold;
            min-width: 25px;
            text-align: center;
        }

        .level-artist {
            color: #999;
            font-size: 0.6rem;
            font-style: italic;
        }

        .level-content {
            margin-top: 10px;
        }

        .mod-card-badge {
            background: var(--main-red);
            color: #000;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: bold;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 1.5rem;
            }
            
            .mod-card {
                flex-direction: column;
                text-align: center;
            }
            
            .mod-card-image {
                width: 100%;
                height: 100px;
            }
            
            .mod-card-content {
                flex-direction: column;
                gap: 10px;
            }
            
            .status-badge {
                left: 10px;
            }
            
            .split-view {
                flex-direction: column;
            }
            
            .level-row {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>

</head>

            function markBadgeAsViewed(modId) {
                const viewed = getViewedBadges();
                if (!viewed.includes(modId)) {
                    viewed.push(modId);
                    localStorage.setItem('viewedBadges', JSON.stringify(viewed));
                }
            }

            // Sistema de caché de imágenes simplificado
            function preloadImage(src) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve(img.src);
                    img.onerror = () => resolve(src); // Fallback
                    img.src = src;
                });
            }

            // Intersection Observer simplificado
            const imageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const src = img.dataset.src;
                        if (src) {
                            img.src = src;
                            img.classList.add('loaded');
                            const loader = img.parentElement.querySelector('.image-loader');
                            if (loader) loader.style.display = 'none';
                        }
                        imageObserver.unobserve(img);
                    }
                });
            });

            function createLevelItem(level, levelIndex) {
                const levelItem = document.createElement('div');
                levelItem.className = 'level-item';

                // Header de la canción
                const levelHeader = document.createElement('div');
                levelHeader.className = 'level-header';

                const levelNumber = document.createElement('span');

                levelNumber.textContent = levelIndex.toString().padStart(2, '0');

                levelName.className = 'level-name';

                const levelArtist = document.createElement('span');
                levelArtist.className = 'level-artist';
                levelArtist.textContent = `vs ${level.title}`;

                levelHeader.appendChild(levelNumber);
                levelHeader.appendChild(levelName);
                levelHeader.appendChild(levelArtist);

                // Contenido de la canción
                const levelContent = document.createElement('div');
                levelContent.className = 'level-content';

                const layoutContainer = document.createElement('div');
                layoutContainer.className = 'layout-options';

                for (const [layoutType, layoutUrl] of Object.entries(level.layouts)) {
                    const layoutBtn = document.createElement('button');
                    layoutBtn.className = 'layout-btn';
                    
                    // Iconos para diferentes tipos de layout
                    let icon = '▶';
                    if (layoutType.toLowerCase().includes('vertical')) icon = '📱';
                    if (layoutType.toLowerCase().includes('horizontal')) icon = '💻';
                    if (layoutType.toLowerCase().includes('coming')) icon = '⏳';
                    if (layoutType.toLowerCase().includes('old')) icon = '🕰';
                    if (layoutType.toLowerCase().includes('new')) icon = '✨';
                    
                    layoutBtn.innerHTML = `${icon} ${layoutType.toUpperCase()}`;
                    
                    layoutBtn.onclick = (e) => {
                        e.preventDefault();
                        if (layoutUrl && layoutUrl.trim() !== '') {
                            // Efecto ripple
                            createRipple(e, layoutBtn);
                            
                            // Animación de click
                            layoutBtn.classList.add('btn-clicked');
                            
                            // Feedback visual mejorado
                            layoutBtn.style.background = '#00ff00';
                            layoutBtn.style.color = '#000';
                            layoutBtn.style.transform = 'scale(0.95)';
                            layoutBtn.textContent = '✓ ABRIENDO...';
                            
                            setTimeout(() => {
                                layoutBtn.innerHTML = `${icon} ${layoutType.toUpperCase()}`;
                                layoutBtn.style.background = '';
                                layoutBtn.style.color = '';
                                layoutBtn.style.transform = '';
                                layoutBtn.classList.remove('btn-clicked');
                            }, 1000);
                            
                            // Copiar URL y abrir
                            navigator.clipboard.writeText(layoutUrl).then(() => {
                                console.log('URL copiada:', layoutUrl);
                            }).catch(() => {
                                console.log('No se pudo copiar la URL');
                            });
                            window.open(layoutUrl, '_blank');
                        }
                    };
                    
                    if (!layoutUrl || layoutUrl.trim() === '') {
                        layoutBtn.disabled = true;
                    }
                    
                    layoutContainer.appendChild(layoutBtn);
                }

                levelContent.appendChild(layoutContainer);
                levelItem.appendChild(levelHeader);
                levelItem.appendChild(levelContent);

                return levelItem;
            }

            });

            window.addEventListener('popstate', function(e) {

                setTimeout(() => {

                    const el = elements[Math.floor(Math.random() * elements.length)];
                    el.style.animation = 'none';
                    setTimeout(() => el.style.animation = '', 10);
                }
            }, 5000);

            // Funcionalidad táctil mejorada para móviles
            let touchStartX = 0;
            let touchStartY = 0;
            let isSwiping = false;

            // Prevenir doble-tap zoom (Android)
            document.addEventListener('dblclick', function (e) {
                e.preventDefault();
            }, { passive: false });

            // Prevenir gestos de zoom con múltiples toques
            document.addEventListener('gesturestart', function (e) {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gesturechange', function (e) {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gestureend', function (e) {
                e.preventDefault();
            }, { passive: false });

            // Gestos táctiles para navegación
            document.addEventListener('touchstart', function (e) {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isSwiping = false;
                }
            }, { passive: true });

            document.addEventListener('touchmove', function (e) {
                if (e.touches.length === 1 && !isSwiping) {
                    const touchX = e.touches[0].clientX;
                    const touchY = e.touches[0].clientY;
                    const deltaX = touchX - touchStartX;
                    const deltaY = touchY - touchStartY;

                    // Detectar swipe horizontal
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                        isSwiping = true;
                        
                        // Swipe hacia la derecha para cerrar niveles (solo en vista dividida)
                        if (deltaX > 0 && selectedModIndex !== -1 && window.innerWidth <= 768) {
                            closeLevels();
                        }
                    }
                }
            }, { passive: true });

            // Optimización para dispositivos móviles
            function isMobileDevice() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                       (window.innerWidth <= 768 && 'ontouchstart' in window);
            }

            // Ajustes específicos para móviles
            if (isMobileDevice()) {
                // Reducir animaciones en dispositivos de bajo rendimiento
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (prefersReducedMotion) {
                    document.documentElement.style.setProperty('--animation-duration', '0.1s');
                }

                // Optimizar scroll en iOS
                document.body.style.webkitOverflowScrolling = 'touch';
                
                // Mejorar rendimiento en dispositivos táctiles
                document.addEventListener('touchstart', function() {}, { passive: true });
            }
            // Función para crear efecto ripple
            function createRipple(event, element) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                
                const rect = element.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = event.clientX - rect.left - size / 2;
                const y = event.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                
                element.style.position = 'relative';
                element.style.overflow = 'hidden';
                element.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);
            }

            // Detección de capacidades del dispositivo
            function detectDeviceCapabilities() {
                const isMobile = isMobileDevice();
                const isLowEnd = navigator.hardwareConcurrency <= 2 || navigator.deviceMemory <= 2;
                
                if (isMobile || isLowEnd) {
                    // Reducir efectos visuales en dispositivos de bajo rendimiento
                    document.documentElement.style.setProperty('--glow-effect', '0 0 3px var(--main-red)');
                    
                    // Desactivar algunas animaciones
                    if (isLowEnd) {
                        const style = document.createElement('style');
                        style.textContent = `
                            .mod-card { animation: none !important; }
                            .glitch-effect { animation: none !important; }
                        `;
                        document.head.appendChild(style);
                    }
                }
            }
            // Feedback visual para botón de volver
            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    createRipple(e, backBtn);
                    backBtn.classList.add('btn-clicked');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 300);
                });
            }

            // Efecto parallax simplificado
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking && window.innerWidth > 768) {
                    requestAnimationFrame(() => {
                        const scrolled = window.pageYOffset;
                        document.documentElement.style.setProperty('--parallax-y', scrolled * 0.2 + 'px');
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });

            // Inicialización
            detectDeviceCapabilities();
            createModCards();
            hideLoadingSpinner();
            loadFromURL();
        });
    </script>
</body>

</html>
