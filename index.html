<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Sonic.exe</title>
    <link rel="icon" type="image/png" href="images/logo_sonic_puto_exe.png">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="Assets/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Fuente pixelada -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Estilos base */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            background-image: url('Assets/BG/indexBG.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            height: 100vh;
            touch-action: manipulation;
        }

        .main-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Efecto de transición oscura */
        .screen-darken {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            opacity: 0;
            z-index: 999;
            pointer-events: none;
            transition: opacity 0.8s ease-out;
        }

        .screen-darken.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* HUD superior */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 32px 0 32px;
            z-index: 30;
            pointer-events: none;
            flex-wrap: wrap;
        }

        .hud-top>* {
            pointer-events: auto;
        }

        .version-btn {
            position: static;
            margin-right: 18px;
            margin-left: 0;
            box-shadow: 0 0 10px #0ff;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            padding: 10px 22px;
            transition: box-shadow 0.3s, opacity 0.4s;
            opacity: 1;
            pointer-events: auto;
            display: flex;
            align-items: center;
        }

        .version-btn button {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            color: #0ff;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            transition: color 0.3s;
        }

        .version-btn button:active {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .version-btn button[hidden] {
            display: none !important;
        }

        .sonic-logo {
            position: static;
            max-width: 320px;
            max-height: 80px;
            margin: 0 auto;
            transition: transform 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.7s;
            opacity: 1;
            will-change: transform, opacity;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sonic-logo.hide {
            opacity: 0;
            transform: scale(0.7) translateY(-40px);
        }

        .sonic-logo.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .sonic-logo img {
            width: 100%;
            height: auto;
            max-width: 320px;
            max-height: 80px;
            filter: drop-shadow(0 0 18px #0ff);
            object-fit: contain;
        }

        /* PC: agranda el logo */
        .sonic-logo,
        .sonic-logo img {
            max-width: 420px;
            max-height: 120px;
        }

        /* Solo en PC: agranda y ajusta el logo a la derecha */
        @media (min-width: 601px) {
            .sonic-logo {
                position: absolute;
                top: 32px;
                right: 48px;
                max-width: 420px;
                max-height: 120px;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: flex-end;
            }

            .sonic-logo img {
                max-width: 420px;
                max-height: 120px;
            }
        }

        /* Menú escalera PC */
        .menu-staircase {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .menu-btn {
            display: block;
            position: relative;
            left: -80px;
            opacity: 0;
            margin-bottom: 18px;
            transition: left 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55),
                opacity 0.6s;
            width: 220px;
            height: 60px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .menu-btn.visible {
            left: 0;
            opacity: 1;
        }

        .menu-btn .btn-img {
            width: 220px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px #0ff);
            transition: transform 0.2s, filter 0.2s;
        }

        .menu-btn:hover .btn-img {
            transform: scale(1.08);
            filter: drop-shadow(0 0 18px #0ff);
        }

        .menu-btn:nth-child(2) {
            margin-left: 30px;
        }

        .menu-btn:nth-child(3) {
            margin-left: 60px;
        }

        .menu-btn:nth-child(4) {
            margin-left: 90px;
        }

        .menu-btn:nth-child(5) {
            margin-left: 120px;
        }

        .menu-btn:nth-child(6) {
            margin-left: 150px;
        }

        /* NOTICIAS MEJORADAS - Carrusel */
        .news-section {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 380px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            box-shadow: 0 0 10px #0ff;
            z-index: 15;
            padding: 18px 16px 10px 16px;
            transition: all 0.4s ease;
            max-height: 260px;
            opacity: 1;
            overflow: hidden;
        }

        .news-section.closed {
            max-height: 48px;
            opacity: 0.7;
        }

        .news-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .news-title {
            font-size: 1rem;
            color: #0ff;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            word-break: break-word;
            max-width: 70%;
        }

        .news-toggle {
            background: none;
            border: none;
            color: #0ff;
            font-size: 1.2rem;
            cursor: pointer;
            outline: none;
            transition: transform 0.3s;
            padding: 0 8px;
        }

        .news-toggle.opened {
            transform: rotate(45deg);
        }

        .news-content {
            max-height: 190px;
            overflow: hidden;
            transition: max-height 0.4s ease;
            position: relative;
        }

        .news-section.closed .news-content {
            max-height: 0;
            overflow: hidden;
        }

        .mods-carousel {
            display: flex;
            transition: transform 0.5s ease;
            width: 100%;
        }

        .mod-item {
            flex: 0 0 100%;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            text-decoration: none;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 6px;
            transition: background 0.2s;
            min-width: 0;
        }

        .mod-item:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        .mod-thumbnail {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 10px;
            filter: drop-shadow(0 0 6px #0ff);
            flex-shrink: 0;
        }

        .mod-info {
            flex: 1;
            min-width: 0;
        }

        .mod-name {
            font-size: 0.7rem;
            margin: 0;
            color: #0ff;
            font-family: 'Press Start 2P', cursive;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mod-date {
            font-size: 0.6rem;
            margin: 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Controles del carrusel */
        .carousel-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            gap: 15px;
        }

        .carousel-btn {
            background: rgba(0, 255, 255, 0.2);
            border: none;
            color: #0ff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }

        .carousel-btn:hover {
            background: rgba(0, 255, 255, 0.4);
        }

        .carousel-indicators {
            display: flex;
            gap: 6px;
            z-index: 20;
        }

        .carousel-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.3);
            cursor: pointer;
            transition: background 0.2s;
            z-index: 20;
        }

        .carousel-indicator.active {
            background: #0ff;
        }

        /* Panel de actualización moderno v2.0 */
        .update-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 255, 255, 0.3), 
                        0 0 0 1px rgba(0, 255, 255, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 100;
            padding: 0;
            min-width: 380px;
            max-width: 700px;
            width: 90vw;
            max-height: 85vh;
            color: #fff;
            opacity: 1;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .update-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #0ff, #00d4ff, #0ff);
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .update-header {
            padding: 28px 32px 24px;
            background: linear-gradient(180deg, rgba(0, 255, 255, 0.08) 0%, transparent 100%);
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            position: relative;
        }

        .update-header h5 {
            font-size: 1.4rem;
            color: #0ff;
            margin: 0 0 8px 0;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .update-header span {
            display: inline-block;
            background: rgba(0, 255, 255, 0.15);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.7rem;
            color: #0ff;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .close-update {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.4rem;
            line-height: 1;
            transition: all 0.3s ease;
        }

        .close-update:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.4);
            color: #ff4444;
            transform: rotate(90deg);
        }

        .update-content {
            max-height: calc(85vh - 180px);
            overflow-y: auto;
            padding: 24px 32px 32px;
        }

        .update-content::-webkit-scrollbar {
            width: 6px;
        }

        .update-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .update-content::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #0ff, #00a8cc);
            border-radius: 10px;
        }

        .update-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #00d4ff, #0ff);
        }

        .update-section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .update-section:hover {
            background: rgba(0, 255, 255, 0.03);
            border-color: rgba(0, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .update-section h3 {
            font-size: 1rem;
            color: #0ff;
            margin: 0 0 18px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.5;
        }

        .update-section ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .update-section li {
            font-size: 0.85rem;
            line-height: 2;
            color: rgba(255, 255, 255, 0.9);
            padding-left: 28px;
            position: relative;
            margin-bottom: 12px;
        }

        .update-section li::before {
            content: '▸';
            position: absolute;
            left: 8px;
            color: #0ff;
            font-size: 1rem;
            top: 2px;
        }

        /* Botón ver updates anteriores moderno */
        .show-older-btn {
            display: block;
            width: calc(100% - 64px);
            margin: 24px 32px;
            padding: 14px 24px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1) 0%, rgba(0, 212, 255, 0.1) 100%);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            color: #0ff;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .show-older-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .show-older-btn:hover::before {
            left: 100%;
        }

        .show-older-btn:hover {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2) 0%, rgba(0, 212, 255, 0.2) 100%);
            border-color: #0ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 255, 0.3);
        }

        .older-updates {
            display: none;
            border-top: 1px solid rgba(0, 255, 255, 0.1);
            margin-top: 20px;
            padding-top: 20px;
        }

        .older-updates.visible {
            display: block;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-updates {
            text-align: center;
            padding: 60px 20px;
            color: #0ff;
            font-size: 1rem;
        }

        .loading-updates p {
            margin: 0;
            animation: pulse 2s ease-in-out infinite;
        }

        .error-loading {
            text-align: center;
            padding: 60px 20px;
            color: #ff4444;
            font-size: 1rem;
        }

        .error-loading p {
            margin: 10px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .update-panel.show {
            display: block;
            animation: panelIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .update-panel.hide {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.95);
            pointer-events: none;
        }

        @keyframes panelIn {
            from {
                opacity: 0;
                transform: translate(-50%, -48%) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Contenedor del menú principal */
        .menu-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            margin-top: 60px;
        }

        /* Responsive tablet */
        @media (max-width: 900px) {
            .hud-top {
                height: auto;
                flex-direction: column;
                align-items: flex-start;
                padding: 10px 10vw 0 10vw;
            }

            .sonic-logo,
            .sonic-logo img {
                max-width: 180px;
                max-height: 44px;
            }

            .version-btn {
                padding: 8px 12px;
                margin-bottom: 6px;
            }

            .news-section {
                width: 90vw;
                right: 5vw;
                bottom: 20px;
                padding: 10px 8px 8px 8px;
                max-height: 220px;
            }

            .news-title {
                font-size: 0.9rem;
                max-width: 60%;
            }

            .update-panel {
                min-width: 90vw;
                max-width: 98vw;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 95vw;
                border-radius: 20px;
                max-height: 90vh;
            }

            .update-header {
                padding: 20px 20px 16px;
            }

            .update-header h5 {
                font-size: 1rem;
                margin-right: 40px;
            }

            .update-header span {
                font-size: 0.6rem;
                padding: 4px 12px;
            }

            .close-update {
                width: 32px;
                height: 32px;
                top: 16px;
                right: 16px;
                font-size: 1.2rem;
            }

            .update-content {
                padding: 16px 20px 20px;
                max-height: calc(90vh - 160px);
            }

            .update-section {
                padding: 16px 18px;
                margin-bottom: 16px;
                border-radius: 12px;
            }

            .update-section h3 {
                font-size: 0.75rem;
                margin-bottom: 12px;
            }

            .update-section li {
                font-size: 0.65rem;
                line-height: 1.7;
                margin-bottom: 8px;
                padding-left: 20px;
            }

            .show-older-btn {
                width: calc(100% - 40px);
                margin: 16px 20px;
                padding: 12px 20px;
                font-size: 0.6rem;
            }

            .mod-name {
                font-size: 0.7rem;
            }

            .mod-date {
                font-size: 0.6rem;
            }
        }

        /* Mejoras específicas para móvil/Android */
        @media (max-width: 600px) {
            body {
                background-size: auto 100%;
                background-position: center center;
            }

            .main-container {
                min-height: 100vh;
                overflow: auto;
                display: flex;
                flex-direction: column;
            }

            .hud-top {
                padding: 6px 4vw 0 4vw;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                min-height: 80px;
            }

            .version-btn {
                padding: 6px 10px;
                margin-bottom: 0;
                font-size: 0.7rem;
                box-shadow: 0 0 6px #0ff;
            }

            .version-btn button {
                font-size: 0.7rem;
            }

            .sonic-logo {
                max-width: 140px;
                max-height: 40px;
                margin-bottom: 0;
            }

            .sonic-logo img {
                max-width: 140px;
                max-height: 40px;
            }

            /* Menú para móvil - columna centrada */
            .menu-staircase {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 0 5vw;
                position: relative;
                left: 0;
                bottom: auto;
            }

            .menu-btn {
                width: 90%;
                max-width: 280px;
                height: 54px;
                margin-bottom: 12px;
                left: -50px;
                opacity: 0;
                position: relative;
            }

            .menu-btn.visible {
                left: 0;
                opacity: 1;
            }

            .menu-btn .btn-img {
                width: 100%;
                height: 100%;
            }

            /* Noticias para móvil */
            .news-section {
                width: 92vw;
                max-width: 280px;
                margin: 20px auto 40px;
                position: relative;
                bottom: auto;
                right: auto;
                padding: 8px;
                max-height: 30vh;
            }

            .news-section.closed {
                max-height: 40px;
                margin: 10px auto 30px;
            }

            .news-title {
                font-size: 0.7rem;
            }

            .news-toggle {
                font-size: 1rem;
            }

            .mod-name {
                font-size: 0.65rem;
            }

            .mod-date {
                font-size: 0.55rem;
            }

            /* Panel de actualización móvil */
            .update-panel {
                padding: 0;
                width: 95vw;
                min-width: 95vw;
                max-width: 95vw;
                border-radius: 20px;
                max-height: 90vh;
            }

            .update-header {
                padding: 20px 20px 16px;
            }

            .update-header h5 {
                font-size: 1rem;
                margin-right: 40px;
            }

            .update-header span {
                font-size: 0.6rem;
                padding: 4px 12px;
            }

            .close-update {
                width: 32px;
                height: 32px;
                top: 16px;
                right: 16px;
                font-size: 1.2rem;
            }

            .update-content {
                padding: 16px 20px 20px;
                max-height: calc(90vh - 160px);
                font-size: 0.7rem;
            }

            .update-section {
                padding: 16px 18px;
                margin-bottom: 16px;
                border-radius: 12px;
            }

            .update-section h3 {
                font-size: 0.75rem;
                margin-bottom: 12px;
            }

            .update-section li {
                font-size: 0.65rem;
                line-height: 1.7;
                margin-bottom: 8px;
                padding-left: 20px;
            }

            .show-older-btn {
                width: calc(100% - 40px);
                margin: 16px 20px;
                padding: 12px 20px;
                font-size: 0.6rem;
            }
        }

        /* Ajustes para pantallas muy pequeñas */
        @media (max-width: 400px) {
            .hud-top {
                min-height: 70px;
            }

            .version-btn {
                padding: 4px 8px;

        /* Botón del minijuego - al lado izquierdo de noticias */
        .game-button {
            position: absolute;
            bottom: 40px;
            right: 440px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .game-button:hover {
            transform: scale(1.1);
        }

        .game-button img {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 8px #ff6b00) drop-shadow(0 0 15px #ff6b00);
            transition: filter 0.3s ease, transform 0.3s ease;
            animation: pulseAura 2s infinite alternate;
        }

        .game-button:hover img {
            filter: drop-shadow(0 0 12px #ff6b00) drop-shadow(0 0 20px #ff6b00);
            transform: scale(1.05);
        }

        @keyframes pulseAura {
            0% {
                filter: drop-shadow(0 0 8px #ff6b00) drop-shadow(0 0 15px #ff6b00);
            }

            100% {
                filter: drop-shadow(0 0 12px #ff6b00) drop-shadow(0 0 20px #ff6b00);
            }
        }

        /* Responsive para móvil */
        @media (max-width: 600px) {
            .game-button {
                position: relative;
                bottom: auto;
                right: auto;
                width: 40px;
                height: 40px;
                margin: 10px auto;
                display: block;
            }
        }

        /* Mejoras de usabilidad táctil */
        .menu-btn,
        .news-toggle,
        .version-btn,
        .carousel-btn,
        .game-button {
            min-height: 44px;
            touch-action: manipulation;
        }

        .menu-btn::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
        }

        /* Animaciones para el efecto especial */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10% {
                transform: translateX(-10px);
            }

            20% {
                transform: translateX(10px);
            }

            30% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            50% {
                transform: translateX(-6px);
            }

            60% {
                transform: translateX(6px);
            }

            70% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }

            90% {
                transform: translateX(-2px);
            }
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes centerAndJump {
            0% {
                transform: translate(0, 0) scale(1);
                z-index: 20;
            }

            50% {
                transform: translate(calc(50vw - 50%), calc(50vh - 50%)) scale(2);
                z-index: 9999;
            }

            100% {
                transform: translate(calc(50vw - 50%), calc(50vh - 50%)) scale(10);
                z-index: 9999;
            }
        }

        @keyframes jumpscare {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.1);
            }

            10% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(5);
            }

            90% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(5);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.1);
            }
        }

        .jumpscare-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            z-index: 99999;
            pointer-events: none;
            animation: jumpscare 1.5s ease-out;
        }

        .jumpscare-overlay img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .shake-animation {
            animation: shake 0.5s ease-in-out;
        }

        .fall-animation {
            animation: fall 2s ease-in forwards;
        }

        .center-jump-animation {
            animation: centerAndJump 3s ease-in-out forwards;
        }

        .special-effect-active {
            pointer-events: none;
        }

        /* Copos de nieve navideños */
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            font-size: 1em;
            animation: snowfall linear infinite;
            will-change: transform, opacity;
        }

        @keyframes snowfall {
            0% {
                transform: translateY(-10px);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 100px));
                opacity: 0;
            }
        }

        /* Luces navideñas */
        .christmas-lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            z-index: 2;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
            will-change: opacity;
        }

        .light.red { background: #ff0000; box-shadow: 0 0 10px #ff0000; }
        .light.green { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .light.blue { background: #0000ff; box-shadow: 0 0 10px #0000ff; }
        .light.yellow { background: #ffff00; box-shadow: 0 0 10px #ffff00; }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Optimizaciones móviles para efectos navideños */
        @media (max-width: 600px) {
            .snowflake {
                font-size: 0.8em;
            }
            
            .christmas-lights {
                height: 15px;
            }
            
            .light {
                width: 8px;
                height: 8px;
                box-shadow: 0 0 5px currentColor;
            }
        }
    </style>

    <script>
        // Variable global para controlar el estado de navegación
        window.isNavigating = false;

        // Detectar Android y optimizar para conexiones lentas
        const isAndroid = /Android/i.test(navigator.userAgent);
        let newsIntervalTime = 5000; // Por defecto 5 segundos

        if (isAndroid && 'connection' in navigator) {
            const connection = navigator.connection;
            if (connection.effectiveType === 'slow-2g' || connection.effectiveType === '2g') {
                newsIntervalTime = 8000; // 8 segundos para conexiones lentas
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const updateBtn = document.getElementById('updateBtn');
            const updatePanel = document.getElementById('updatePanel');
            const closeUpdate = document.getElementById('closeUpdate');
            const sonicLogo = document.getElementById('sonicLogo');
            const newsSection = document.getElementById('newsSection');
            const newsToggleBtn = document.getElementById('newsToggleBtn');
            const newsHeader = document.getElementById('newsToggle');
            const bgMusic = document.getElementById('bgMusic');
            const screenDarken = document.getElementById('screenDarken');
            const menuButtons = document.querySelectorAll('.menu-btn[data-url]');

            // Elementos del carrusel de noticias
            const newsCarousel = document.getElementById('newsCarousel');
            const prevNewsBtn = document.getElementById('prevNews');
            const nextNewsBtn = document.getElementById('nextNews');
            const newsIndicators = document.getElementById('newsIndicators');

            // Variables para el carrusel
            let currentNewsIndex = 0;
            let newsItems = [];

            // Botón del minijuego
            const gameButton = document.getElementById('gameButton');
            if (gameButton) {
                gameButton.addEventListener('click', startMiniGame);
                // También para eventos táctiles
                gameButton.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    startMiniGame();
                }, { passive: false });
            }

            // Inicializar el carrusel de noticias
            function initNewsCarousel() {
                newsItems = document.querySelectorAll('.mod-item');

                // Crear indicadores
                newsIndicators.innerHTML = '';
                for (let i = 0; i < newsItems.length; i++) {
                    const indicator = document.createElement('div');
                    indicator.classList.add('carousel-indicator');
                    if (i === 0) indicator.classList.add('active');
                    indicator.addEventListener('click', () => goToNews(i));
                    newsIndicators.appendChild(indicator);
                }

                // Iniciar auto-avance
                startAutoNews();
            }

            // Navegar a una noticia específica
            function goToNews(index) {
                if (index < 0) index = newsItems.length - 1;
                if (index >= newsItems.length) index = 0;

                currentNewsIndex = index;
                newsCarousel.style.transform = `translateX(-${index * 100}%)`;

                // Actualizar indicadores
                document.querySelectorAll('.carousel-indicator').forEach((ind, i) => {
                    ind.classList.toggle('active', i === index);
                });

                // Reiniciar auto-avance
                restartAutoNews();
            }

            // Iniciar auto-avance de noticias
            function startAutoNews() {
                if (window.autoNewsTimer) clearInterval(window.autoNewsTimer);
                window.autoNewsTimer = setInterval(() => {
                    goToNews(currentNewsIndex + 1);
                }, newsIntervalTime); // Usar intervalo dinámico
            }

            // Reiniciar auto-avance
            function restartAutoNews() {
                if (window.autoNewsTimer) clearInterval(window.autoNewsTimer);
                startAutoNews();
            }

            // Configurar eventos para los controles del carrusel
            if (prevNewsBtn && nextNewsBtn) {
                prevNewsBtn.addEventListener('click', () => goToNews(currentNewsIndex - 1));
                nextNewsBtn.addEventListener('click', () => goToNews(currentNewsIndex + 1));

                // También para eventos táctiles
                prevNewsBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    goToNews(currentNewsIndex - 1);
                }, { passive: false });

                nextNewsBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    goToNews(currentNewsIndex + 1);
                }, { passive: false });
            }

            // Restablecer el estado de la pantalla oscura al cargar la página
            screenDarken.classList.remove('active');

            // Manejar el evento pageshow para detectar navegación con el botón "Atrás"
            window.addEventListener('pageshow', function (event) {
                // Si la página se carga desde la caché (navegación hacia atrás)
                if (event.persisted) {
                    // Restablecer el estado de la pantalla oscura
                    screenDarken.classList.remove('active');
                    window.isNavigating = false;
                }
            });

            // También restablecer al hacer carga normal
            window.addEventListener('load', function () {
                screenDarken.classList.remove('active');
                window.isNavigating = false;
            });

            // Animación de transición entre paneles
            function showPanel(panel) {
                panel.classList.remove('hide');
                panel.classList.add('show');
                panel.style.display = 'block';
            }

            function hidePanel(panel) {
                panel.classList.remove('show');
                panel.classList.add('hide');
                setTimeout(() => {
                    panel.style.display = 'none';
                }, 400);
            }

            // Efecto de transición oscura y redirección
            function redirectWithFade(url) {
                // Prevenir múltiples clics durante la navegación
                if (window.isNavigating) return;
                window.isNavigating = true;

                // Detener el carrusel de noticias
                if (window.autoNewsTimer) clearInterval(window.autoNewsTimer);

                // Activar pantalla oscura
                screenDarken.classList.add('active');

                // Reproducir sonido de confirmación si está disponible
                try {
                    const sound = document.getElementById('selectSound');
                    if (sound) {
                        sound.currentTime = 0;
                        sound.play().catch(() => { });
                    }
                } catch (e) {
                    console.log('Error al reproducir sonido:', e);
                }

                // Redirigir después de la animación
                setTimeout(() => {
                    window.location.href = url;
                }, 800);
            }

            // Configurar eventos para los botones del menú
            menuButtons.forEach(button => {
                button.addEventListener('click', function () {
                    const url = this.getAttribute('data-url');
                    if (url) {
                        redirectWithFade(url);
                    }
                });

                // También manejar eventos táctiles para Android
                button.addEventListener('touchstart', function (e) {
                    e.preventDefault();
                    const url = this.getAttribute('data-url');
                    if (url) {
                        redirectWithFade(url);
                    }
                }, { passive: false });
            });

            // Noticias animadas - funcionalidad completa
            function toggleNews() {
                const isOpening = newsSection.classList.contains('closed');
                newsSection.classList.toggle('closed');
                newsSection.classList.toggle('show');
                newsToggleBtn.classList.toggle('opened');

                // Si se está abriendo, reiniciar el carrusel
                if (isOpening) {
                    setTimeout(() => {
                        restartAutoNews();
                    }, 400);
                } else {
                    // Si se está cerrando, pausar el carrusel
                    if (window.autoNewsTimer) clearInterval(window.autoNewsTimer);
                }

                // Reproducir sonido solo si está disponible
                try {
                    const sound = isOpening ? document.getElementById('selectSound') : document.getElementById('hoverSound');
                    if (sound) {
                        sound.currentTime = 0;
                        sound.play().catch(() => { });
                    }
                } catch (e) {
                    console.log('Error al reproducir sonido:', e);
                }
            }

            if (newsToggleBtn && newsHeader) {
                newsToggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleNews();
                });

                newsHeader.addEventListener('click', (e) => {
                    if (e.target === newsHeader) {
                        toggleNews();
                    }
                });
            }

            // Función para cargar actualizaciones desde JSON
            async function loadUpdates() {
                try {
                    const response = await fetch('Assets/data/updates.json');
                    const data = await response.json();

                    // Actualizar versión en el título y botón
                    const currentVersionSpan = document.getElementById('currentVersionSpan');
                    if (currentVersionSpan) currentVersionSpan.textContent = data.currentVersion;
                    const updateBtn = document.getElementById('updateBtn');
                    if (updateBtn) updateBtn.innerHTML = `<i class="bi bi-stars"></i> Rework ${data.currentVersion}`;

                    const updateContent = document.getElementById('updateContent');

                    // Función para renderizar una update
                    const renderUpdate = (update) => {
                        let html = `<h4><strong>🔄 NOVEDADES ${update.version} - ${update.title}</strong></h4><br>`;
                        update.sections.forEach(section => {
                            html += `<p><strong>${section.title}:</strong></p><ul>`;
                            section.items.forEach(item => {
                                html += `<li>${item.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</li>`;
                            });
                            html += '</ul><br>';
                        });
                        return html;
                    };

                    // Solo mostrar la versión actual
                    let html = renderUpdate(data.updates[0]);

                    // Botón para ver anteriores (si hay más)
                    if (data.updates.length > 1) {
                        html += `<button class="show-older-btn" id="showOlderBtn">📜 VER ACTUALIZACIONES ANTERIORES ▼</button>`;
                        html += `<div class="older-updates" id="olderUpdates">`;
                        data.updates.slice(1).forEach(update => {
                            html += `<h4><strong>🔥 ${update.version} - ${update.title}</strong></h4><br>`;
                            update.sections.forEach(section => {
                                html += `<p><strong>${section.title}:</strong></p><ul>`;
                                section.items.forEach(item => {
                                    html += `<li>${item.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</li>`;
                                });
                                html += '</ul><br>';
                            });
                        });
                        html += `</div>`;
                    }

                    updateContent.innerHTML = html;

                    // Toggle del botón
                    const showOlderBtn = document.getElementById('showOlderBtn');
                    const olderUpdates = document.getElementById('olderUpdates');
                    if (showOlderBtn) {
                        showOlderBtn.addEventListener('click', () => {
                            const isVisible = olderUpdates.classList.toggle('visible');
                            showOlderBtn.textContent = isVisible
                                ? '📜 OCULTAR ACTUALIZACIONES ANTERIORES ▲'
                                : '📜 VER ACTUALIZACIONES ANTERIORES ▼';
                        });
                    }

                } catch (error) {
                    console.error('Error cargando actualizaciones:', error);
                    document.getElementById('updateContent').innerHTML = `
                        <div class="error-loading">
                            <p>❌ Error cargando actualizaciones</p>
                            <p>Por favor, recarga la página.</p>
                        </div>`;
                }
            }

            // Cargar actualizaciones al inicializar
            loadUpdates();

            // Botón de rework - Versión mejorada para Android
            if (updateBtn) {
                const handleUpdateClick = (e) => {
                    e.preventDefault();

                    // Reproducir sonido
                    const sound = document.getElementById('selectSound');
                    if (sound) {
                        sound.currentTime = 0;
                        sound.play().catch(() => { });
                    }

                    showPanel(updatePanel);
                    sonicLogo.classList.remove('show');
                    sonicLogo.classList.add('hide');
                    updateBtn.disabled = true;
                    updateBtn.style.pointerEvents = 'none';
                    updateBtn.style.opacity = '0.5';

                    // Pausar el carrusel de noticias
                    if (window.autoNewsTimer) clearInterval(window.autoNewsTimer);
                };

                updateBtn.addEventListener('mousedown', handleUpdateClick);
                updateBtn.addEventListener('touchstart', handleUpdateClick, { passive: true });
            }

            // Cerrar panel de actualización
            if (closeUpdate) {
                closeUpdate.addEventListener('click', () => {
                    hidePanel(updatePanel);
                    sonicLogo.classList.remove('hide');
                    sonicLogo.classList.add('show');
                    updateBtn.disabled = false;
                    updateBtn.style.pointerEvents = 'auto';
                    updateBtn.style.opacity = '1';

                    // Reanudar el carrusel de noticias
                    restartAutoNews();
                });
            }

            // Inicializar efectos navideños
            window.christmasEffects = new ChristmasEffects();
            window.christmasEffects.init();

            // Inicializar animaciones
            function initAnimations() {
                sonicLogo.classList.add('show');

                const menuButtons = document.querySelectorAll('.menu-btn');
                menuButtons.forEach((btn, index) => {
                    setTimeout(() => {
                        btn.classList.add('visible');
                    }, index * 120 + 300);
                });

                setTimeout(() => {
                    newsSection.classList.add('show');
                    // Inicializar el carrusel después de que se muestre la sección de noticias
                    initNewsCarousel();
                    // Los efectos navideños ya se inicializaron arriba
                }, menuButtons.length * 120 + 500);
            }
            initAnimations();

            // Reproducir música de fondo - Versión mejorada
            function playBgMusic() {
                // Verificar si es diciembre
                const currentDate = new Date();
                const isDecember = currentDate.getMonth() === 11; // Diciembre es el mes 11 (0-indexado)
                
                const activeMusic = window.christmasEffects.getActiveMusic() || bgMusic;
                
                if (activeMusic) {
                    activeMusic.volume = 0.4;

                    if (window.audioPlayAttempted) return;
                    window.audioPlayAttempted = true;

                    const createAudioButton = () => {
                        const audioBtn = document.createElement('button');
                        audioBtn.textContent = 'Activar Audio';
                        audioBtn.style.position = 'fixed';
                        audioBtn.style.bottom = '20px';
                        audioBtn.style.right = '20px';
                        audioBtn.style.zIndex = '1000';
                        audioBtn.style.padding = '10px 15px';
                        audioBtn.style.backgroundColor = '#0ff';
                        audioBtn.style.color = '#000';
                        audioBtn.style.border = 'none';
                        audioBtn.style.borderRadius = '5px';
                        audioBtn.style.cursor = 'pointer';
                        audioBtn.style.fontFamily = '"Press Start 2P", cursive';
                        audioBtn.style.fontSize = '12px';

                        audioBtn.addEventListener('click', () => {
                            activeMusic.play().catch(e => {
                                console.log('No se pudo reproducir el audio:', e);
                            });
                            document.body.removeChild(audioBtn);
                        });

                        document.body.appendChild(audioBtn);
                    };

                    // Intentar reproducir automáticamente
                    const playPromise = activeMusic.play();

                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.log('Reproducción automática prevenida:', error);
                            createAudioButton();
                        });
                    }
                }
            }

            // Iniciar música solo después de que la intro haya terminado
            function initMusicAfterIntro() {
                document.body.addEventListener('click', function audioInit() {
                    playBgMusic();
                    document.body.removeEventListener('click', audioInit);
                }, { once: true });

                // También iniciar con eventos táctiles
                document.body.addEventListener('touchstart', function audioInitTouch() {
                    playBgMusic();
                    document.body.removeEventListener('touchstart', audioInitTouch);
                }, { once: true });
            }

            // Si la intro está activa, esperar a que termine; si no, registrar de inmediato
            if (document.getElementById('intro-overlay')) {
                document.addEventListener('introComplete', function() {
                    playBgMusic();
                }, { once: true });
            } else {
                initMusicAfterIntro();
            }
        });



        // Función para cargar el minijuego con animación especial
        function startMiniGame() {
            // Prevenir múltiples activaciones
            if (window.specialEffectActive) return;
            window.specialEffectActive = true;

            const bgMusic = document.getElementById('bgMusic');
            const christmasMusic = document.getElementById('christmasMusic');
            const gameButton = document.getElementById('gameButton');
            const allElements = document.querySelectorAll('body > *:not(.game-button)');
            
            // Determinar qué música está sonando
            const currentDate = new Date();
            const isDecember = currentDate.getMonth() === 11;
            const activeMusic = window.christmasEffects.getActiveMusic() || bgMusic;

            // Fase 1: Ralentizar música gradualmente
            if (activeMusic) {
                let playbackRate = 1;
                const slowDown = setInterval(() => {
                    playbackRate -= 0.05;
                    if (playbackRate <= 0.25) {
                        playbackRate = 0;
                        activeMusic.pause();
                        clearInterval(slowDown);

                        // Fase 2: Shake del sitio web (después de 1 segundo)
                        setTimeout(() => {
                            document.body.classList.add('shake-animation');

                            // Fase 3: Caída de elementos (después del shake)
                            setTimeout(() => {
                                document.body.classList.remove('shake-animation');

                                // Reproducir sonido de crash
                                const crashSound = document.getElementById('crashSound');
                                if (crashSound) {
                                    crashSound.currentTime = 0;
                                    crashSound.play().catch(() => { });
                                }

                                // Hacer caer todos los elementos excepto el botón del juego y los copos de nieve
                                allElements.forEach((element, index) => {
                                    if (!element.classList.contains('snowflake')) {
                                        setTimeout(() => {
                                            element.classList.add('fall-animation');
                                        }, index * 100);
                                    }
                                });

                                // Fase 4: Centrar y hacer saltar el icono (después de 1 segundo)
                                setTimeout(() => {
                                    gameButton.classList.add('center-jump-animation');

                                    // Fase 5: Jumpscare (después de 2.5 segundos)
                                    setTimeout(() => {
                                        const jumpscareDiv = document.createElement('div');
                                        jumpscareDiv.className = 'jumpscare-overlay';
                                        jumpscareDiv.innerHTML = '<img src="images/samyholahola.png" alt="Jumpscare">';
                                        document.body.appendChild(jumpscareDiv);

                                        // Fase 6: Cargar minijuego (después del jumpscare)
                                        setTimeout(() => {
                                            document.body.removeChild(jumpscareDiv);
                                            const script = document.createElement('script');
                                            script.src = 'Assets/js/minigame-standalone.js';
                                            document.head.appendChild(script);
                                        }, 1500);
                                    }, 2500);
                                }, 1000);
                            }, 500);
                        }, 1000);
                    } else {
                        activeMusic.playbackRate = playbackRate;
                    }
                }, 100);
            } else {
                // Si no hay música, ejecutar directamente las animaciones
                setTimeout(() => {
                    document.body.classList.add('shake-animation');
                    setTimeout(() => {
                        document.body.classList.remove('shake-animation');
                        const crashSound = document.getElementById('crashSound');
                        if (crashSound) {
                            crashSound.currentTime = 0;
                            crashSound.play().catch(() => { });
                        }

                        allElements.forEach((element, index) => {
                            setTimeout(() => {
                                element.classList.add('fall-animation');
                            }, index * 100);
                        });
                        setTimeout(() => {
                            gameButton.classList.add('center-jump-animation');
                            setTimeout(() => {
                                const jumpscareDiv = document.createElement('div');
                                jumpscareDiv.className = 'jumpscare-overlay';
                                jumpscareDiv.innerHTML = '<img src="images/samyholahola.png" alt="Jumpscare">';
                                document.body.appendChild(jumpscareDiv);

                                setTimeout(() => {
                                    document.body.removeChild(jumpscareDiv);
                                    const script = document.createElement('script');
                                    script.src = 'Assets/js/minigame-standalone.js';
                                    document.head.appendChild(script);
                                }, 1500);
                            }, 2500);
                        }, 1000);
                    }, 500);
                }, 1000);
            }
        }
    </script>
