<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUND TEST</title>
    <link rel="icon" type="image/png" href="images/logo_sonic_puto_exe.png">
    <style>
        @font-face {
            font-family: 'SonicCD';
            src: url('font/sonic-cd-menu-font.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url('BG/backgroundST.png') center/cover no-repeat;
            background-color: #000;
            font-family: 'SonicCD', monospace;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .soundtest-screen {
            width: 480px;
            height: 360px;
            background: #000;
            border: 4px solid #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .title {
            font-size: 32px;
            color: #ffff00;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 3px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 60px;
            margin-bottom: 50px;
        }

        .number-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .number-label {
            font-size: 18px;
            color: #ffff00;
            letter-spacing: 2px;
        }

        .number-display {
            font-size: 48px;
            color: #ffff00;
            font-family: 'SonicCD', monospace;
            min-width: 80px;
            text-align: center;
        }

        .number-controls {
            display: flex;
            gap: 20px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            background: #ffff00;
            color: #000;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
        }

        .control-btn:hover {
            background: #cccc00;
        }

        .control-btn:active {
            background: #999900;
        }

        .separator {
            font-size: 48px;
            color: #ffff00;
        }

        .action-buttons {
            display: flex;
            gap: 40px;
        }

        .action-btn {
            padding: 15px 30px;
            font-family: 'SonicCD', monospace;
            font-size: 18px;
            background: #ffff00;
            color: #000;
            border: none;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.1s;
        }

        .action-btn:hover {
            background: #cccc00;
        }

        .action-btn:active {
            background: #999900;
        }

        .song-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            text-align: center;
            font-size: 14px;
            color: #ffff00;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .song-info.show {
            opacity: 1;
        }

        .virtual-keyboard {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            border-top: 2px solid #ffff00;
            padding: 10px;
            display: none;
            z-index: 1000;
        }

        .virtual-keyboard.show {
            display: block;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            margin-bottom: 5px;
        }

        .key-btn {
            background: #333;
            color: #ffff00;
            border: 1px solid #ffff00;
            padding: 10px 15px;
            margin: 2px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            min-width: 30px;
            text-align: center;
        }

        .key-btn:hover {
            background: #555;
        }

        .key-btn.space {
            min-width: 120px;
        }

        .text-input {
            background: #000;
            color: #ffff00;
            border: 2px solid #ffff00;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
            width: 200px;
            margin: 0 auto 10px;
            display: block;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }

        .loading-screen.show {
            display: flex;
        }

        .loading-text {
            color: #000;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #ccc;
            border-top: 5px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Responsive para tablets */
        @media (max-width: 768px) {
            .soundtest-screen {
                width: 95vw;
                height: 80vh;
                max-width: 600px;
                max-height: 500px;
            }

            .title {
                font-size: 28px;
                margin-bottom: 35px;
            }

            .controls {
                gap: 50px;
                margin-bottom: 45px;
            }

            .number-display {
                font-size: 42px;
            }

            .separator {
                font-size: 42px;
            }

            .control-btn {
                width: 44px;
                height: 44px;
                font-size: 20px;
                min-height: 44px;
            }

            .action-btn {
                padding: 15px 25px;
                font-size: 16px;
                min-height: 44px;
            }

            .action-buttons {
                gap: 25px;
            }

            .virtual-keyboard {
                padding: 15px;
            }

            .key-btn {
                padding: 12px 16px;
                font-size: 16px;
                min-width: 40px;
                min-height: 44px;
            }

            .key-btn.space {
                min-width: 140px;
            }

            .text-input {
                padding: 12px;
                font-size: 18px;
                width: 250px;
            }
        }
        
        /* Responsive para móviles */
        @media (max-width: 520px) {
            .soundtest-screen {
                width: 95vw;
                height: 85vh;
                max-width: 450px;
                max-height: 400px;
                border: 2px solid #fff;
            }

            .title {
                font-size: 20px;
                margin-bottom: 25px;
                letter-spacing: 1px;
            }

            .controls {
                gap: 30px;
                margin-bottom: 30px;
                flex-wrap: wrap;
            }

            .number-display {
                font-size: 32px;
                min-width: 70px;
            }

            .separator {
                font-size: 32px;
            }

            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
                min-height: 44px;
            }

            .action-btn {
                padding: 12px 20px;
                font-size: 14px;
                min-height: 44px;
                letter-spacing: 1px;
            }

            .action-buttons {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .virtual-keyboard {
                padding: 10px;
                max-height: 60vh;
                overflow-y: auto;
            }

            .keyboard-row {
                margin-bottom: 8px;
            }

            .key-btn {
                padding: 10px 12px;
                font-size: 14px;
                min-width: 35px;
                min-height: 44px;
                margin: 1px;
            }

            .key-btn.space {
                min-width: 120px;
            }

            .text-input {
                padding: 10px;
                font-size: 16px;
                width: 90%;
                max-width: 300px;
            }

            .song-info {
                bottom: 10px;
                left: 10px;
                right: 10px;
                font-size: 12px;
            }

            .music-prompt {
                bottom: 2px;
                font-size: 10px;
            }
        }
        
        /* Responsive para pantallas muy pequeñas */
        @media (max-width: 400px) {
            .soundtest-screen {
                width: 98vw;
                height: 90vh;
                border: 1px solid #fff;
            }

            .title {
                font-size: 18px;
                margin-bottom: 20px;
            }

            .controls {
                gap: 20px;
                margin-bottom: 25px;
            }

            .number-display {
                font-size: 28px;
                min-width: 60px;
            }

            .separator {
                font-size: 28px;
            }

            .control-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .action-btn {
                padding: 10px 16px;
                font-size: 12px;
                letter-spacing: 0.5px;
            }

            .action-buttons {
                gap: 10px;
            }

            .key-btn {
                padding: 8px 10px;
                font-size: 12px;
                min-width: 30px;
                margin: 0.5px;
            }

            .key-btn.space {
                min-width: 100px;
            }

            .text-input {
                font-size: 14px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>
    <div class="soundtest-screen">
        <div class="title">SOUND TEST</div>

        <div class="controls">
            <div class="number-section">
                <div class="number-label">PGM</div>
                <div class="number-display" id="pgm-display">00</div>
                <div class="number-controls">
                    <button class="control-btn" id="pgm-up">▲</button>
                    <button class="control-btn" id="pgm-down">▼</button>
                </div>
            </div>

            <div class="separator">-</div>

            <div class="number-section">
                <div class="number-label">DA</div>
                <div class="number-display" id="da-display">00</div>
                <div class="number-controls">
                    <button class="control-btn" id="da-up">▲</button>
                    <button class="control-btn" id="da-down">▼</button>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn" id="play-btn">PLAY</button>
            <button class="action-btn" id="keyboard-btn">KEYBOARD</button>
            <button class="action-btn" id="back-btn">BACK</button>
        </div>

        <div class="song-info" id="song-info">
            <div id="song-name"></div>
        </div>
        
        <div class="music-prompt" id="music-prompt" style="position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #ffff00; opacity: 0.7; cursor: pointer;">
            Click para reproducir música
        </div>
    </div>

    <div class="loading-screen" id="loading-screen">
        <div class="loading-text" id="loading-text">CARGANDO...</div>
        <div class="loading-spinner"></div>
    </div>

    <div class="virtual-keyboard" id="virtual-keyboard">
        <input type="text" class="text-input" id="text-input" placeholder="Type here..." maxlength="10">
        <div class="keyboard-row">
            <button class="key-btn" data-key="q">Q</button>
            <button class="key-btn" data-key="w">W</button>
            <button class="key-btn" data-key="e">E</button>
            <button class="key-btn" data-key="r">R</button>
            <button class="key-btn" data-key="t">T</button>
            <button class="key-btn" data-key="y">Y</button>
            <button class="key-btn" data-key="u">U</button>
            <button class="key-btn" data-key="i">I</button>
            <button class="key-btn" data-key="o">O</button>
            <button class="key-btn" data-key="p">P</button>
        </div>
        <div class="keyboard-row">
            <button class="key-btn" data-key="a">A</button>
            <button class="key-btn" data-key="s">S</button>
            <button class="key-btn" data-key="d">D</button>
            <button class="key-btn" data-key="f">F</button>
            <button class="key-btn" data-key="g">G</button>
            <button class="key-btn" data-key="h">H</button>
            <button class="key-btn" data-key="j">J</button>
            <button class="key-btn" data-key="k">K</button>
            <button class="key-btn" data-key="l">L</button>
        </div>
        <div class="keyboard-row">
            <button class="key-btn" data-key="z">Z</button>
            <button class="key-btn" data-key="x">X</button>
            <button class="key-btn" data-key="c">C</button>
            <button class="key-btn" data-key="v">V</button>
            <button class="key-btn" data-key="b">B</button>
            <button class="key-btn" data-key="n">N</button>
            <button class="key-btn" data-key="m">M</button>
        </div>
        <div class="keyboard-row">
            <button class="key-btn" data-key="1">1</button>
            <button class="key-btn" data-key="2">2</button>
            <button class="key-btn" data-key="3">3</button>
            <button class="key-btn" data-key="4">4</button>
            <button class="key-btn" data-key="5">5</button>
            <button class="key-btn" data-key="6">6</button>
            <button class="key-btn" data-key="7">7</button>
            <button class="key-btn" data-key="8">8</button>
            <button class="key-btn" data-key="9">9</button>
            <button class="key-btn" data-key="0">0</button>
        </div>
        <div class="keyboard-row">
            <button class="key-btn" id="clear-btn">CLEAR</button>
            <button class="key-btn space" data-key=" ">SPACE</button>
            <button class="key-btn" id="enter-btn">ENTER</button>
            <button class="key-btn" id="close-keyboard">CLOSE</button>
        </div>
    </div>

    <audio id="select-sound" preload="auto">
        <source src="sounds/pauseScrollMenu.ogg" type="audio/ogg">
    </audio>
    <audio id="confirm-sound" preload="auto">
        <source src="sounds/confirmMenu.ogg" type="audio/ogg">
    </audio>
    <audio id="error-sound" preload="auto">
        <source src="sounds/NO.ogg" type="audio/ogg">
    </audio>
    <audio id="soundtest-music" preload="auto" loop>
        <source src="sounds/soundtest.ogg" type="audio/ogg">
    </audio>

    <script>
        let pgmValue = 0;
        let daValue = 0;

        // Datos de las canciones de Sonic.EXE
        const songs = {
            '02-23': { name: 'Prey', link: 'https://funkymaker.kingamescreator.com/_app/levels/01jzs1rsvcsg4et3wsg08jqht7/releases/01jzs1rsvh3qmx05b68hv1bjn9' },
            '04-20': { name: 'Too Fest', link: 'https://funkymaker.com/play/too-fest-sonic-exe' },
            '07-07': { name: 'Cycles', link: 'https://funkymaker.com/play/cycles-sonic-exe' },
            '08-21': { name: 'Chaos', link: 'https://funkymaker.com/play/chaos-sonic-exe' },
            '11-21': { name: 'Fatality', link: 'https://funkymaker.com/play/fatality-sonic-exe' },
            '12-25': { name: 'Endless', link: 'https://funkymaker.com/play/endless-sonic-exe' },
            '12-34': { name: 'Milk', link: 'https://funkymaker.kingamescreator.com/_app/levels/01jsdf2p7ve5nwjekbxx4mc7be/releases/01jsdf2p7ymhte7r81vqcgttrk' },
            '19-63': { name: 'Round-A-bout', link: 'https://funkymaker.com/play/round-a-bout-sonic-exe' },
            '31-13': { 
                name: 'Faker', 
                horizontal: 'https://funkymaker.com/play/faker-sonic-exe',
                vertical: 'https://funkymaker.kingamescreator.com/_app/levels/01k77qc3v3g7hgp5qy25rfftz5/releases/01k77qc3v7jtbhmx1v9yt760fz'
            },
            '66-06': { name: 'Sunshine', link: 'https://funkymaker.com/play/sunshine-sonic-exe' },
            '99-99': { name: 'I AM GOD', link: 'https://funkymaker.com/play/i-am-god-sonic-exe' },
            'personnel': { name: 'Personnel', link: 'https://funkymaker.com/play/personnel-sonic-exe' },
            'hog': { name: 'Hog', link: 'https://funkymaker.com/play/hog-sonic-exe' },
            'mania': { name: 'Mania', link: 'https://funkymaker.com/play/mania-sonic-exe' },
            '09-23': { name: 'B4CKSLASH', link: 'https://funkymaker.com/play/b4ckslash-sonic-exe' },
            '06-20': { name: 'Digitalized', link: 'https://funkymaker.com/play/digitalized-sonic-exe' },
            'forestall': { name: 'Forestall Desire', link: 'https://funkymaker.com/play/forestall-desire-sonic-exe' },
            '08-17': { name: 'My Horizon (Armydillo Mix)', link: 'https://funkymaker.com/play/my-horizon-sonic-exe' },
            '01-11': { name: 'Malediction', link: 'https://funkymaker.com/play/malediction-sonic-exe' },
            'blinddate': { name: 'Blind Date', link: 'https://funkymaker.com/play/blind-date-sonic-exe' }
        };

        // Elementos DOM
        const pgmDisplay = document.getElementById('pgm-display');
        const daDisplay = document.getElementById('da-display');
        const songInfo = document.getElementById('song-info');
        const songName = document.getElementById('song-name');

        // Sonidos
        const selectSound = document.getElementById('select-sound');
        const confirmSound = document.getElementById('confirm-sound');
        const errorSound = document.getElementById('error-sound');

        // Funciones de sonido
        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(() => { });
        }

        // Actualizar displays
        function updateDisplay() {
            pgmDisplay.textContent = pgmValue.toString().padStart(2, '0');
            daDisplay.textContent = daValue.toString().padStart(2, '0');
        }

        // Cambiar valores
        function changePGM(delta) {
            playSound(selectSound);
            pgmValue = (pgmValue + delta + 100) % 100;
            updateDisplay();
            songInfo.classList.remove('show');
        }

        function changeDA(delta) {
            playSound(selectSound);
            daValue = (daValue + delta + 100) % 100;
            updateDisplay();
            songInfo.classList.remove('show');
        }

        // Variables para desbloqueos especiales
        let secretText = '';
        let cartridgesCollected = 0;
        let startTime = Date.now();
        let maniaUnlocked = false;
        let horizonToggle = false; // Para alternar entre My Horizon y Our Horizon

        // Reproducir canción
        function playSong() {
            let key = `${pgmValue.toString().padStart(2, '0')}-${daValue.toString().padStart(2, '0')}`;
            let song = songs[key];

            // Manejar código duplicado 08-17 (My Horizon vs Our Horizon)
            if (key === '08-17') {
                if (horizonToggle) {
                    song = { name: 'Our Horizon', link: 'https://funkymaker.com/play/our-horizon-sonic-exe' };
                }
                horizonToggle = !horizonToggle; // Alternar para la próxima vez
            }

            // Verificar desbloqueos especiales
            if (!song && secretText.toLowerCase() === 'personnel') {
                song = songs['personnel'];
                key = 'personnel';
                secretText = '';
            }

            // Hog - desbloquear con cartuchos
            if (!song && cartridgesCollected >= 5) {
                if (key === '00-00' || secretText.toLowerCase() === 'hog') {
                    song = songs['hog'];
                    key = 'hog';
                    secretText = '';
                }
            }

            // Mania - desbloquear después de 15 minutos
            if (!song && maniaUnlocked) {
                if (key === '00-01' || secretText.toLowerCase() === 'mania') {
                    song = songs['mania'];
                    key = 'mania';
                    secretText = '';
                }
            }

            // B4CKSLASH - desbloquear escribiendo "2005"
            if (!song && secretText === '2005') {
                song = songs['09-23'];
                key = '09-23';
                secretText = '';
            }

            // Forestall Desire - desbloquear escribiendo "forestall"
            if (!song && secretText.toLowerCase() === 'forestall') {
                song = songs['forestall'];
                key = 'forestall';
                secretText = '';
            }
            
            // Blind Date - desbloquear escribiendo "blinddate"
            if (!song && secretText.toLowerCase() === 'blinddate') {
                song = songs['blinddate'];
                key = 'blinddate';
                secretText = '';
            }

            // Verificar contenido multimedia especial
            if (!song && mediaContent[key]) {
                playSound(confirmSound);
                showMediaContent(key);
                return;
            }

            if (song) {
                playSound(confirmSound);

                // Si la canción tiene múltiples modos, mostrar selector
                if (song.horizontal && song.vertical) {
                    showModeSelector(song);
                } else {
                    // Mostrar pantalla de carga
                    const loadingScreen = document.getElementById('loading-screen');
                    const loadingText = document.getElementById('loading-text');
                    loadingText.textContent = `CARGANDO ${song.name.toUpperCase()}...`;
                    loadingScreen.classList.add('show');

                    // Abrir link después de 2 segundos
                    setTimeout(() => {
                        if (song.link) {
                            window.open(song.link, '_blank');
                        }
                    }, 2000);

                    // Volver a la normalidad después de 5 segundos
                    setTimeout(() => {
                        loadingScreen.classList.remove('show');
                        songInfo.classList.remove('show');
                    }, 5000);
                }
            } else {
                playSound(errorSound);
                songInfo.classList.remove('show');
            }
        }

        // Event listeners
        document.getElementById('pgm-up').addEventListener('click', () => changePGM(1));
        document.getElementById('pgm-down').addEventListener('click', () => changePGM(-1));
        document.getElementById('da-up').addEventListener('click', () => changeDA(1));
        document.getElementById('da-down').addEventListener('click', () => changeDA(-1));
        document.getElementById('play-btn').addEventListener('click', playSong);
        document.getElementById('back-btn').addEventListener('click', () => {
            playSound(selectSound);
            setTimeout(() => window.location.href = 'index.html', 200);
        });

        // Teclado virtual
        const virtualKeyboard = document.getElementById('virtual-keyboard');
        const textInput = document.getElementById('text-input');

        document.getElementById('keyboard-btn').addEventListener('click', () => {
            playSound(selectSound);
            virtualKeyboard.classList.add('show');
            textInput.focus();
        });

        document.getElementById('close-keyboard').addEventListener('click', () => {
            playSound(selectSound);
            virtualKeyboard.classList.remove('show');
            secretText = textInput.value;
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            playSound(selectSound);
            textInput.value = '';
        });

        document.getElementById('enter-btn').addEventListener('click', () => {
            playSound(selectSound);
            virtualKeyboard.classList.remove('show');
            secretText = textInput.value;
            playSong();
        });

        // Botones del teclado virtual
        document.querySelectorAll('.key-btn[data-key]').forEach(btn => {
            btn.addEventListener('click', () => {
                playSound(selectSound);
                const key = btn.getAttribute('data-key');
                if (textInput.value.length < 10) {
                    textInput.value += key;
                }
            });
        });

        // Actualizar secretText cuando se escribe en el input
        textInput.addEventListener('input', () => {
            secretText = textInput.value;
        });

        // Controles de teclado
        document.addEventListener('keydown', (e) => {
            // Capturar texto para códigos secretos
            if (e.key.length === 1 && (e.key.match(/[a-zA-Z]/) || e.key.match(/[0-9]/))) {
                secretText += e.key;
                // Mantener solo los últimos 10 caracteres
                if (secretText.length > 10) {
                    secretText = secretText.slice(-10);
                }
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    changePGM(1);
                    secretText = ''; // Resetear texto al usar controles
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    changePGM(-1);
                    secretText = ''; // Resetear texto al usar controles
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    changeDA(-1);
                    secretText = ''; // Resetear texto al usar controles
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    changeDA(1);
                    secretText = ''; // Resetear texto al usar controles
                    break;
                case 'Enter':
                case ' ':
                    e.preventDefault();
                    playSong();
                    break;
                case 'Escape':
                    e.preventDefault();
                    window.location.href = 'index.html';
                    break;
                case 'Backspace':
                    secretText = secretText.slice(0, -1);
                    break;
            }
        });

        // Código secreto ↑↓←→Enter
        let secretSequence = [];
        const correctSequence = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'];

        document.addEventListener('keydown', (e) => {
            // Solo capturar la secuencia si no estamos en otros controles
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) {
                secretSequence.push(e.key);

                // Mantener solo los últimos 5 elementos
                if (secretSequence.length > 5) {
                    secretSequence.shift();
                }

                // Verificar si coincide con la secuencia correcta
                if (secretSequence.length === 5 &&
                    secretSequence.every((key, index) => key === correctSequence[index])) {
                    // Código secreto activado - mostrar mensaje especial
                    playSound(confirmSound);
                    songName.textContent = 'SECRET CODE ACTIVATED!';
                    songInfo.classList.add('show');

                    // Resetear secuencia
                    secretSequence = [];

                    setTimeout(() => {
                        songInfo.classList.remove('show');
                    }, 3000);
                }
            }
        });

        // Detectar cuando el usuario vuelve a la página
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // Usuario volvió a la página, ocultar pantalla de carga
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.classList.remove('show');
                songInfo.classList.remove('show');
            }
        });

        // Detectar focus en la ventana
        window.addEventListener('focus', () => {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.classList.remove('show');
            songInfo.classList.remove('show');
        });

        // JSON de videos e imágenes por código
        const mediaContent = {
            '67-67': {
                type: 'video',
                src: 'soundtest/67.mp4',
                vertical: true
            },
            '66-66': {
                type: 'image',
                src: 'soundtest/66.jpg',
                sound: 'sounds/scream.ogg'
            },
            '13-13': {
                type: 'video',
                src: 'soundtest/13.mp4',
                vertical: false
            },
            '31-01': {
                type: 'image',
                src: 'soundtest/zorraMLL.png'
            },
            '01-08': {
                type: 'image',
                src: 'soundtest/kingref.png'
            },
            '08-63': {
                type: 'video',
                src: 'soundtest/el863gritorigen.mp4',
                vertical: false
            },
            '08-36': {
                type: 'image',
                src: 'soundtest/reallyworthy.png'
            },
            '69-69': {
                type: 'image',
                src: 'soundtest/queopinan.jpg'
            }
        };

        // Función para mostrar selector de modo
        function showModeSelector(song) {
            const container = document.createElement('div');
            container.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0,0,0,0.9);
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: #ffff00;
                font-family: 'SonicCD', monospace;
            `;

            const title = document.createElement('div');
            title.textContent = `SELECCIONAR MODO - ${song.name.toUpperCase()}`;
            title.style.cssText = `
                font-size: 24px;
                margin-bottom: 40px;
                text-align: center;
            `;

            const buttonContainer = document.createElement('div');
            buttonContainer.style.cssText = `
                display: flex;
                gap: 40px;
                flex-wrap: wrap;
                justify-content: center;
            `;

            const horizontalBtn = document.createElement('button');
            horizontalBtn.textContent = 'HORIZONTAL';
            horizontalBtn.style.cssText = `
                padding: 15px 30px;
                font-family: 'SonicCD', monospace;
                font-size: 18px;
                background: #ffff00;
                color: #000;
                border: none;
                cursor: pointer;
                letter-spacing: 2px;
            `;

            const verticalBtn = document.createElement('button');
            verticalBtn.textContent = 'VERTICAL';
            verticalBtn.style.cssText = `
                padding: 15px 30px;
                font-family: 'SonicCD', monospace;
                font-size: 18px;
                background: #ffff00;
                color: #000;
                border: none;
                cursor: pointer;
                letter-spacing: 2px;
            `;

            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'CANCELAR';
            cancelBtn.style.cssText = `
                padding: 15px 30px;
                font-family: 'SonicCD', monospace;
                font-size: 18px;
                background: #666;
                color: #fff;
                border: none;
                cursor: pointer;
                letter-spacing: 2px;
                margin-top: 20px;
            `;

            horizontalBtn.onclick = () => {
                document.body.removeChild(container);
                openSongLink(song.horizontal, song.name);
            };

            verticalBtn.onclick = () => {
                document.body.removeChild(container);
                openSongLink(song.vertical, song.name);
            };

            cancelBtn.onclick = () => {
                document.body.removeChild(container);
            };

            buttonContainer.appendChild(horizontalBtn);
            buttonContainer.appendChild(verticalBtn);
            container.appendChild(title);
            container.appendChild(buttonContainer);
            container.appendChild(cancelBtn);
            document.body.appendChild(container);
        }

        // Función para abrir enlace de canción
        function openSongLink(link, name) {
            const loadingScreen = document.getElementById('loading-screen');
            const loadingText = document.getElementById('loading-text');
            loadingText.textContent = `CARGANDO ${name.toUpperCase()}...`;
            loadingScreen.classList.add('show');

            setTimeout(() => {
                window.open(link, '_blank');
            }, 2000);

            setTimeout(() => {
                loadingScreen.classList.remove('show');
                songInfo.classList.remove('show');
            }, 5000);
        }

        // Función para mostrar contenido multimedia
        function showMediaContent(code) {
            const media = mediaContent[code];
            if (!media) return;

            // Silenciar música de fondo
            soundtestMusic.volume = 0;

            // Crear pantalla de carga
            const loadingContainer = document.createElement('div');
            loadingContainer.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: black;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: white;
                font-family: monospace;
                font-size: 18px;
            `;
            
            const loadingText = document.createElement('div');
            loadingText.textContent = `CARGANDO ${media.type.toUpperCase()}...`;
            loadingText.style.marginBottom = '20px';
            
            const loadingBar = document.createElement('div');
            loadingBar.style.cssText = `
                width: 200px;
                height: 4px;
                background: #333;
                border: 1px solid white;
                position: relative;
                overflow: hidden;
            `;
            
            const loadingProgress = document.createElement('div');
            loadingProgress.style.cssText = `
                width: 0%;
                height: 100%;
                background: white;
                transition: width 0.3s ease;
            `;
            
            loadingBar.appendChild(loadingProgress);
            loadingContainer.appendChild(loadingText);
            loadingContainer.appendChild(loadingBar);
            document.body.appendChild(loadingContainer);
            
            // Simular progreso de carga
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 30;
                if (progress > 100) progress = 100;
                loadingProgress.style.width = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    setTimeout(() => {
                        document.body.removeChild(loadingContainer);
                        showActualContent();
                    }, 500);
                }
            }, 100);
            
            function showActualContent() {
                const container = document.createElement('div');
                container.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100vw;
                    height: 100vh;
                    background: black;
                    z-index: 9999;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                `;

                // Función para restaurar música
                const restoreMusic = () => {
                    soundtestMusic.volume = 0.5;
                    document.body.removeChild(container);
                };

            // Reproducir sonido solo para imágenes
            if (media.type === 'image' && media.sound) {
                const audio = new Audio(media.sound);
                audio.volume = 0.7;
                audio.play().catch(() => {});
            }

            if (media.type === 'video') {
                const video = document.createElement('video');
                video.style.cssText = media.vertical ? `
                    height: 100vh;
                    width: auto;
                    object-fit: contain;
                ` : `
                    width: 100vw;
                    height: auto;
                    object-fit: contain;
                `;
                video.src = media.src;
                video.autoplay = true;
                video.muted = false;
                
                video.onended = () => {
                    restoreMusic();
                };
                
                container.appendChild(video);
            } else if (media.type === 'image') {
                const img = document.createElement('img');
                img.style.cssText = `
                    max-width: 100vw;
                    max-height: 100vh;
                    object-fit: contain;
                `;
                img.src = media.src;
                
                // Botón back para Android
                const backBtn = document.createElement('button');
                backBtn.textContent = '← BACK';
                backBtn.style.cssText = `
                    position: absolute;
                    bottom: 20px;
                    left: 20px;
                    padding: 10px 20px;
                    background: rgba(0,0,0,0.7);
                    color: white;
                    border: 2px solid white;
                    border-radius: 5px;
                    font-family: monospace;
                    font-size: 16px;
                    cursor: pointer;
                `;
                
                backBtn.onclick = () => {
                    restoreMusic();
                };
                
                // También cerrar con tecla Escape o Android back
                const handleBack = (e) => {
                    if (e.key === 'Escape') {
                        restoreMusic();
                        document.removeEventListener('keydown', handleBack);
                    }
                };
                document.addEventListener('keydown', handleBack);
                
                container.appendChild(img);
                container.appendChild(backBtn);
            }

                document.body.appendChild(container);
            }
        }

        // Sistema de cartuchos para Hog
        function collectCartridge() {
            cartridgesCollected++;
            playSound(confirmSound);
            songName.textContent = `CARTUCHO ENCONTRADO! (${cartridgesCollected}/5)`;
            songInfo.classList.add('show');
            setTimeout(() => songInfo.classList.remove('show'), 2000);

            if (cartridgesCollected >= 5) {
                setTimeout(() => {
                    songName.textContent = 'HOG DESBLOQUEADO!';
                    songInfo.classList.add('show');
                    setTimeout(() => songInfo.classList.remove('show'), 3000);
                }, 2500);
            }
        }

        // Evento aleatorio de cartucho (1% probabilidad por click)
        document.addEventListener('click', () => {
            if (cartridgesCollected < 5 && Math.random() < 0.01) {
                collectCartridge();
            }
        });

        // Timer para Mania (15 minutos)
        setInterval(() => {
            const timeElapsed = Date.now() - startTime;
            if (timeElapsed >= 900000 && !maniaUnlocked) { // 15 minutos
                maniaUnlocked = true;
                playSound(confirmSound);
                songName.textContent = 'CARTA DE SEGA: TAILS ASIGNADO COMO COMPAÑERO';
                songInfo.classList.add('show');
                setTimeout(() => {
                    songName.textContent = 'MANIA DESBLOQUEADO!';
                    setTimeout(() => songInfo.classList.remove('show'), 3000);
                }, 3000);
            }
        }, 60000); // Verificar cada minuto

        // Música de fondo del soundtest
        const soundtestMusic = document.getElementById('soundtest-music');
        const musicPrompt = document.getElementById('music-prompt');
        let musicStarted = false;
        
        soundtestMusic.volume = 0.5;
        
        // Función para iniciar música
        function startMusic() {
            if (!musicStarted) {
                soundtestMusic.play().catch(() => {});
                musicStarted = true;
                musicPrompt.style.display = 'none';
            }
        }
        
        // Iniciar música con cualquier interacción
        document.addEventListener('click', startMusic, { once: true });
        document.addEventListener('keydown', startMusic, { once: true });
        musicPrompt.addEventListener('click', startMusic);

        // Inicialización
        updateDisplay();
    </script>
</body>
