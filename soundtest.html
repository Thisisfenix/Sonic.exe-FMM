<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic.exe V3 - Sound Test</title>
    <link rel="icon" type="image/png" href="images/logo_sonic_puto_exe.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Fuente estilo Sonic -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Estilos base */
        .sonic-body {
            background-color: #000;
            background-image: url('BG/backgroundST.png');
            background-size: cover;
            background-position: center;
            font-family: 'Press Start 2P', cursive;
            color: #00a2ff;
        }

        .sonic-cd-container {
            width: 320px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 3px solid #00a2ff;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Efecto scanline */
        .scanline {
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.7), transparent);
            animation: scan 3s linear infinite;
            z-index: 1;
        }

        @keyframes scan {
            0% { top: -2px; }
            100% { top: 100%; }
        }

        /* Texto estilo Sonic CD */
        .sonic-title {
            font-size: 1.8rem;
            color: #00a2ff;
            text-shadow: 0 0 10px #00a2ff;
            letter-spacing: 2px;
        }

        .sonic-subtitle {
            font-size: 0.8rem;
            color: #fff;
            padding: 0 20px;
        }

        /* Display numérico */
        .sonic-display {
            margin: 25px 0;
        }

        .sonic-digit-group {
            width: 100px;
        }

        .sonic-digit-label {
            font-size: 0.8rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .sonic-digit {
            font-size: 2rem;
            color: #00ff00;
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid #00a2ff;
            border-radius: 5px;
            padding: 5px 10px;
            text-shadow: 0 0 5px #00ff00;
        }

        .sonic-separator {
            font-size: 2rem;
            color: #00a2ff;
            height: 60px;
        }

        /* Botones */
        .sonic-arrow-btn {
            color: #00a2ff;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00a2ff;
            min-width: 30px;
        }

        .sonic-arrow-btn:hover {
            color: #00ff00;
            border-color: #00ff00;
        }

        .sonic-btn-play {
            background-color: #00a2ff;
            color: #000;
            font-weight: bold;
            border: none;
        }

        .sonic-btn-play:hover {
            background-color: #00c3ff;
            box-shadow: 0 0 10px #00a2ff;
        }

        .sonic-btn-back {
            background-color: transparent;
            color: #00a2ff;
            border: 1px solid #00a2ff;
        }

        .sonic-btn-back:hover {
            color: #ff5555;
            border-color: #ff5555;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .sonic-cd-container {
                width: 280px;
                padding: 15px;
            }
            
            .sonic-title {
                font-size: 1.5rem;
            }
            
            .sonic-digit {
                font-size: 1.8rem;
            }
            
            .sonic-separator {
                font-size: 1.8rem;
            }
        }

        /* Estilos adicionales para las imágenes */
        .random-image {
            position: absolute;
            z-index: 1000;
            max-width: 200px;
            display: none;
            pointer-events: none;
            animation: appearDisappear 3s forwards;
        }
        
        @keyframes appearDisappear {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.5); display: none; }
        }
        
        .image-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: #00ff00;
            font-size: 1.5rem;
        }
    </style>
</head>
<body class="sonic-body">
    <!-- Overlay de carga -->
    <div id="loading-overlay" class="loading-overlay">
        <div>CARGANDO SONIDOS...</div>
    </div>
    
    <!-- Contenedor para imágenes aleatorias -->
    <div id="image-container" class="image-container"></div>
    
    <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100">
        <div class="sonic-cd-container position-relative p-4">
            <!-- Efecto scanline -->
            <div class="scanline position-absolute top-0 start-0 w-100"></div>
            
            <!-- Encabezado -->
            <header class="text-center mb-4">
                <h1 class="sonic-title mb-0">SOUND TEST</h1>
                <div class="sonic-subtitle d-flex justify-content-between mt-2">
                    <span>PCM</span>
                    <span id="version-number">0.1</span>
                </div>
            </header>
            
            <!-- Display numérico -->
            <div class="sonic-display d-flex justify-content-center gap-3 mb-4">
                <div class="sonic-digit-group text-center">
                    <div class="sonic-digit-label">PGM</div>
                    <div id="pgm-display" class="sonic-digit">00</div>
                    <div class="sonic-arrows d-flex justify-content-center gap-2 mt-1">
                        <button id="increment-pgm" class="sonic-arrow-btn btn btn-sm p-1">
                            <i class="bi bi-caret-up-fill"></i>
                        </button>
                        <button id="decrement-pgm" class="sonic-arrow-btn btn btn-sm p-1">
                            <i class="bi bi-caret-down-fill"></i>
                        </button>
                    </div>
                </div>
                
                <div class="sonic-separator d-flex align-items-center">-</div>
                
                <div class="sonic-digit-group text-center">
                    <div class="sonic-digit-label">DA</div>
                    <div id="da-display" class="sonic-digit">00</div>
                    <div class="sonic-arrows d-flex justify-content-center gap-2 mt-1">
                        <button id="increment-da" class="sonic-arrow-btn btn btn-sm p-1">
                            <i class="bi bi-caret-up-fill"></i>
                        </button>
                        <button id="decrement-da" class="sonic-arrow-btn btn btn-sm p-1">
                            <i class="bi bi-caret-down-fill"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Botones de control -->
            <div class="sonic-controls d-flex justify-content-center gap-3">
                <button id="play-button" class="sonic-btn-play btn px-4 py-2">
                    <i class="bi bi-play-fill me-2"></i>PLAY
                </button>
                <button id="back-button" class="sonic-btn-back btn px-3 py-2">
                    <i class="bi bi-x-lg me-1"></i>BACK
                </button>
            </div>

            <!-- Información de la canción -->
            <div id="song-info" class="mt-3 text-center" style="color: #fff; font-size: 0.7rem; display: none;">
                <div id="song-name"></div>
                <div id="song-link" class="mt-1"></div>
            </div>
        </div>
    </div>

    <!-- Elementos de audio -->
    <audio id="backgroundMusic" src="sounds/soundtest.ogg" loop></audio>
    <audio id="selectSound" src="sounds/pauseScrollMenu.ogg"></audio>
    <audio id="correctSound" src="sounds/confirmMenu.ogg"></audio>
    <audio id="errorSound" src="sounds/NO.ogg"></audio>
    <audio id="bloodSound" src="assets/sounds/blood.mp3"></audio>

    <!-- Bootstrap JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- JS personalizado -->
    <script>
        // Variables globales
        let pgmValue = 0;
        let daValue = 0;
        let currentAudio = null;
        let songsData = [];
        let imageList = [];
        
        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            // Cargar datos desde JSON
            loadSongsData();
            
            // Configurar botones
            document.getElementById('increment-pgm').addEventListener('click', () => changeValue('pgm', 1));
            document.getElementById('decrement-pgm').addEventListener('click', () => changeValue('pgm', -1));
            document.getElementById('increment-da').addEventListener('click', () => changeValue('da', 1));
            document.getElementById('decrement-da').addEventListener('click', () => changeValue('da', -1));
            
            document.getElementById('play-button').addEventListener('click', playSound);
            document.getElementById('back-button').addEventListener('click', goBack);
        });
        
        // Cargar datos de canciones desde JSON
        async function loadSongsData() {
            try {
                // En una implementación real, cargarías desde un archivo JSON
                // const response = await fetch('songs.json');
                // songsData = await response.json();
                
                // Datos de ejemplo (reemplaza con tu JSON real)
                songsData = [
                    { pgm: 0, da: 1, name: "Menu Theme", url: "https://funkymaker.com/?song=menu", imageTrigger: false },
                    { pgm: 1, da: 5, name: "Game Over", url: "https://funkymaker.com/?song=gameover", imageTrigger: false },
                    { pgm: 5, da: 12, name: "Blood Feast", url: "https://funkymaker.com/?song=blood", imageTrigger: true },
                    { pgm: 7, da: 3, name: "Nightmare", url: "https://funkymaker.com/?song=nightmare", imageTrigger: true },
                    { pgm: 13, da: 13, name: "Demon Theme", url: "https://funkymaker.com/?song=demon", imageTrigger: true }
                ];
                
                // Lista de imágenes (reemplaza con tus rutas reales)
                imageList = [
                    'assets/images/random1.png',
                    'assets/images/random2.png',
                    'assets/images/random3.jpg',
                    'assets/images/random4.png'
                ];
                
                // Ocultar overlay de carga
                document.getElementById('loading-overlay').style.display = 'none';
                
                // Iniciar música de fondo
                const bgMusic = document.getElementById('backgroundMusic');
                bgMusic.volume = 0.5;
                bgMusic.play().catch(() => {
                    // Si falla la reproducción automática, activar con interacción
                    const enableAudio = () => {
                        bgMusic.play();
                        document.removeEventListener('click', enableAudio);
                        document.removeEventListener('touchstart', enableAudio);
                    };
                    document.addEventListener('click', enableAudio);
                    document.addEventListener('touchstart', enableAudio);
                });
                
            } catch (error) {
                console.error('Error cargando datos:', error);
                document.getElementById('loading-overlay').innerHTML = 
                    '<div>ERROR CARGANDO DATOS<br><button onclick="location.reload()" class="btn btn-primary mt-3">REINTENTAR</button></div>';
            }
        }
        
        // Cambiar valores PGM o DA
        function changeValue(type, change) {
            playSoundEffect('selectSound');
            
            if (type === 'pgm') {
                pgmValue = (pgmValue + change + 100) % 100;
                document.getElementById('pgm-display').textContent = pgmValue.toString().padStart(2, '0');
            } else {
                daValue = (daValue + change + 100) % 100;
                document.getElementById('da-display').textContent = daValue.toString().padStart(2, '0');
            }
            
            // Ocultar información de canción al cambiar valores
            document.getElementById('song-info').style.display = 'none';
        }
        
        // Reproducir efecto de sonido
        function playSoundEffect(soundId) {
            const sound = document.getElementById(soundId);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Error reproduciendo sonido:", e));
            }
        }
        
        // Reproducir sonido seleccionado
        function playSound() {
            // Detener sonido anterior si existe
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            
            // Buscar la canción en los datos
            const song = songsData.find(s => s.pgm === pgmValue && s.da === daValue);
            
            if (song) {
                playSoundEffect('correctSound');
                
                // Mostrar información de la canción
                const songInfo = document.getElementById('song-info');
                document.getElementById('song-name').textContent = song.name;
                
                const songLink = document.getElementById('song-link');
                songLink.innerHTML = `<a href="${song.url}" target="_blank" style="color: #00a2ff;">JUGAR EN FUNKYMAKER</a>`;
                
                songInfo.style.display = 'block';
                
                // Si es una canción especial, mostrar imágenes
                if (song.imageTrigger) {
                    // Reproducir sonido especial (si existe)
                    currentAudio = document.getElementById('bloodSound');
                    if (currentAudio) {
                        currentAudio.play().catch(e => console.log("Error reproduciendo sonido especial:", e));
                    }
                    
                    // Mostrar imágenes aleatorias
                    showRandomImages();
                } else {
                    // Aquí podrías cargar y reproducir el sonido normal de la canción
                    // currentAudio = new Audio(song.audioFile);
                    // currentAudio.play();
                }
            } else {
                playSoundEffect('errorSound');
                document.getElementById('song-info').style.display = 'none';
            }
        }
        
        // Mostrar imágenes aleatorias
        function showRandomImages() {
            const container = document.getElementById('image-container');
            container.innerHTML = ''; // Limpiar contenedor
            
            // Mostrar entre 3 y 6 imágenes aleatorias
            const numImages = 3 + Math.floor(Math.random() * 4);
            
            for (let i = 0; i < numImages; i++) {
                setTimeout(() => {
                    const img = document.createElement('img');
                    const randomImage = imageList[Math.floor(Math.random() * imageList.length)];
                    img.src = randomImage;
                    img.className = 'random-image';
                    
                    // Posición aleatoria
                    const posX = Math.random() * (window.innerWidth - 200);
                    const posY = Math.random() * (window.innerHeight - 200);
                    img.style.left = `${posX}px`;
                    img.style.top = `${posY}px`;
                    
                    // Tamaño aleatorio (entre 50% y 120%)
                    const scale = 0.5 + Math.random() * 0.7;
                    img.style.transform = `scale(${scale})`;
                    
                    container.appendChild(img);
                    
                    // Mostrar la imagen
                    setTimeout(() => {
                        img.style.display = 'block';
                    }, 10);
                    
                    // Eliminar la imagen después de la animación
                    setTimeout(() => {
                        if (img.parentNode) {
                            img.parentNode.removeChild(img);
                        }
                    }, 3000);
                    
                }, i * 500); // Espaciar la aparición de imágenes
            }
        }
        
        // Volver atrás
        function goBack() {
            playSoundEffect('selectSound');
            // Detener todos los sonidos
            if (currentAudio) {
                currentAudio.pause();
            }
            document.getElementById('backgroundMusic').pause();
            
            // Redirigir al menú principal
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        }
    </script>
</body>
</html>
