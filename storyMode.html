<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Mode - Sonic.exe</title>
    <link rel="icon" type="image/png" href="images/logo_sonic_puto_exe.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: url('Assets/BG/storymodeBG.gif') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Escena principal ── */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Flecha lateral ── */
        .arrow-btn {
            position: absolute;
            top: 15%;
            width: 96px;
            height: 170px;
            cursor: pointer;
            background: none;
            border: none;
            outline: none;
            padding: 0;
            z-index: 20;
            transition: transform 0.15s;
        }

        .arrow-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 6px #e8547a);
        }

        .arrow-btn.left  { left: 26%; top: 15%; transform: none; }
        .arrow-btn.right { right: 27.5%; top: 15%; transform: none; }

        .arrow-btn:hover img  { filter: drop-shadow(0 0 14px #ff80a0) brightness(1.3); }
        .arrow-btn.left:active  { transform: scale(0.9); }
        .arrow-btn.right:active { transform: scale(0.9); }

        /* ── Contenedor de la caja ── */
        .box-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Caja roja — capa base, full wrapper */
        .red-box {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: fill;
            z-index: 1;
        }

        /* Caja gris — entre roja y amarilla */
        .grey-box {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: fill;
            z-index: 2;
        }

        /* BF — delante del grey, detrás del yellow, dentro del tronco de la T */
        .bf-layer {
            position: absolute;
            z-index: 4;
            bottom: 33.5%;
            left: 50%;
            transform: translateX(-50%);
        }

        .bf-img {
            height: auto;
            width: clamp(100px, 14vw, 200px);
            object-fit: contain;
            image-rendering: pixelated;
            animation: bfIdle 0.6s ease-in-out infinite alternate;
        }

        /* Caja amarilla — encima del BF */
        .yellow-box {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: fill;
            z-index: 5;
        }

        /* ── Contenido dentro de la caja ── */
        /* Posicionado en % para que escale con el wrapper 16:9 */
        .box-content {
            position: absolute;
            left: 29.5%;
            top: 12%;
            width: 40%;
            height: 78%;
            z-index: 3;
            display: flex;
            flex-direction: column;
        }

        /* Zona superior: imagen del mod */
        .mod-art {
            width: 68%;
            align-self: center;
            height: 32%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        /* Estática encima del artwork */
        .static-layer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 68%;
            height: 32%;
            background: url('Assets/StoryMode/StoryModeStatic.gif') center/cover;
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.15s ease;
        }

        .bf-img {
            height: auto;
            width: clamp(100px, 14vw, 200px);
            object-fit: contain;
            image-rendering: pixelated;
            animation: bfIdle 0.6s ease-in-out infinite alternate;
        }

        @keyframes bfIdle {
            from { transform: translateY(0); }
            to   { transform: translateY(-6px); }
        }

        /* ── Nombre del mod (debajo de la caja) ── */
        .mod-name-row {
            position: fixed;
            bottom: 13.5%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            white-space: nowrap;
            z-index: 10;
        }

        /* Flechitas decorativas del nombre */
        .name-arrow {
            width: 0; height: 0;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            flex-shrink: 0;
        }
        .name-arrow.left  { border-right: 18px solid #f5f500; }
        .name-arrow.right { border-left:  18px solid #f5f500; }

        .mod-name-text {
            color: #f5f500;
            font-size: clamp(1rem, 3vw, 1.8rem);
            text-shadow: 3px 3px 0 #000, 0 0 14px #f5f500;
            letter-spacing: 3px;
            transition: opacity 0.25s;
        }

        /* Botón ? */
        .info-btn {
            background: rgba(0,0,0,0.7);
            border: 2px solid #f5f500;
            color: #f5f500;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 6px #f5f500;
        }
        .info-btn:hover {
            background: rgba(245,245,0,0.2);
            box-shadow: 0 0 14px #f5f500;
        }

        /* Infobox */
        .info-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .info-box {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.92);
            border: 2px solid #f5f500;
            box-shadow: 0 0 16px #f5f500;
            border-radius: 8px;
            padding: 14px 16px 10px 16px;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.55rem;
            line-height: 1.9;
            text-align: center;
            z-index: 100;
            width: 220px;
            white-space: normal;
            display: none;
        }
        .info-box.visible { display: block; animation: fadeInUp 0.2s ease; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(6px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .info-close {
            margin-top: 10px;
            background: none;
            border: 1px solid rgba(245,245,0,0.4);
            color: #f5f500;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.55rem;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .info-close:hover { background: rgba(245,245,0,0.15); }

        /* ── Botón volver ── */
        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #e8547a;
            color: #e8547a;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 50;
            transition: background 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover {
            background: rgba(232,84,122,0.2);
            box-shadow: 0 0 10px #e8547a;
            color: #fff;
        }

        /* ── Botón JUGAR ── */
        .play-btn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #d10000;
            border: 2px solid #f5f500;
            color: #f5f500;
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.6rem, 2vmin, 0.85rem);
            padding: 12px 28px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 50;
            box-shadow: 0 0 14px #d10000;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            letter-spacing: 2px;
        }
        .play-btn:hover {
            background: #ff2222;
            box-shadow: 0 0 24px #ff2222;
            transform: translateX(-50%) scale(1.06);
        }
        .play-btn:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* ── Transición de cambio ── */
        .box-wrapper.switching .mod-art,
        .box-wrapper.switching .mod-name-text {
            opacity: 0;
        }

        /* ── Loading overlay ── */
        .loading-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #d10000;
            font-size: 1rem;
            gap: 20px;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #333;
            border-top-color: #d10000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Responsive Android/móvil ── */
        @media (max-width: 768px) {

            /* Cajas full screen igual que PC */
            .box-wrapper {
                width: 100vw;
                height: 56.25vw;
                max-height: 100vh;
                max-width: 177.78vh;
            }

            /* Artwork más pequeño y reposicionado */
            .box-content {
                left: 27%;
                top: 11%;
                width: 46%;
                height: 78%;
            }

            .mod-art {
                width: 72%;
                height: 30%;
            }

            /* BF más pequeño */
            .bf-img {
                width: clamp(70px, 18vw, 130px);
            }

            .bf-layer {
                bottom: 30%;
            }

            /* Flechas más pequeñas y pegadas a la caja */
            .arrow-btn {
                width: 56px;
                height: 100px;
                top: 12%;
            }

            .arrow-btn.left  { left: 22%; }
            .arrow-btn.right { right: 22%; }

            /* Nombre del mod más pequeño */
            .mod-name-text {
                font-size: clamp(0.7rem, 4vw, 1rem);
            }

            .name-arrow {
                border-top-width: 10px;
                border-bottom-width: 10px;
            }
            .name-arrow.left  { border-right-width: 13px; }
            .name-arrow.right { border-left-width:  13px; }

            .mod-name-row {
                bottom: 10%;
            }

            /* Botón jugar más pequeño */
            .play-btn {
                font-size: 0.65rem;
                padding: 10px 20px;
                bottom: 3%;
            }

            /* Botón volver */
            .back-btn {
                font-size: 0.5rem;
                padding: 6px 10px;
            }
        }

        /* Pantallas muy pequeñas (< 400px) */
        @media (max-width: 400px) {
            .arrow-btn {
                width: 40px;
                height: 72px;
            }

            .arrow-btn.left  { left: 18%; }
            .arrow-btn.right { right: 18%; }

            .bf-img { width: clamp(55px, 16vw, 100px); }

            .mod-name-text { font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <!-- Botón volver -->
    <a href="index.html" class="back-btn">&#9664; MENÚ</a>

    <div class="scene">
        <!-- Caja central -->
        <div class="box-wrapper" id="boxWrapper">
            <!-- Flechas dentro del wrapper para que escalen con la caja -->
            <button class="arrow-btn left" id="prevBtn" aria-label="Mod anterior">
                <img src="Assets/StoryMode/Arrows/arrow left.png" id="arrowLeftImg" alt="Anterior">
            </button>
            <button class="arrow-btn right" id="nextBtn" aria-label="Siguiente mod">
                <img src="Assets/StoryMode/Arrows/arrow right.png" id="arrowRightImg" alt="Siguiente">
            </button>
            <!-- Marco rojo (fondo) -->
            <img src="Assets/StoryMode/redbox.png" class="red-box" alt="">
            <!-- Marco gris (entre rojo y amarillo) -->
            <img src="Assets/StoryMode/greybox.png" class="grey-box" alt="">

            <!-- BF — delante del grey, detrás del yellow -->
            <div class="bf-layer">
                <img class="bf-img" src="Assets/StoryMode/Boyfriend.gif" alt="Boyfriend">
            </div>

            <!-- Marco amarillo (encima) -->
            <img src="Assets/StoryMode/yellowbox.png" class="yellow-box" alt="">

            <!-- Contenido (arte del mod, detrás de todo) -->
            <div class="box-content">
                <img id="modArt" class="mod-art" src="" alt="Mod art">
                <!-- Estática encima del artwork -->
                <div class="static-layer" id="staticLayer"></div>
            </div>
        </div>

        <!-- Nombre del mod — fuera de la caja, debajo -->
        <div class="mod-name-row">
            <span class="mod-name-text" id="modNameText">TOO SLOW</span>
            <div class="info-wrap">
                <button class="info-btn" id="infoBtn" aria-label="Info de dificultad">?</button>
                <!-- Infobox aparece al lado del ? -->
                <div class="info-box" id="infoBox">
                    <p>Solo está disponible <span style="color:#f5f500">HARD</span>.<br>No se planean otras dificultades por el momento.</p>
                    <button class="info-close" id="infoClose">✕</button>
                </div>
            </div>
        </div>
        </div>

        <!-- Flecha derecha -->
        </div>
    </div>

    <!-- Botón jugar -->
    <button class="play-btn" id="playBtn">&#9654; JUGAR</button>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <span>CARGANDO...</span>
    </div>

    <!-- Audio -->
    <audio id="bgMusic"      src="sounds/storymodemenumusic.ogg" loop></audio>
    <audio id="scrollSound"  src="sounds/pauseScrollMenu.ogg"></audio>
    <audio id="confirmSound" src="sounds/confirmMenu.ogg"></audio>

    <script src="Assets/js/christmas-lite.js"></script>
    <script>
        // ── Datos de mods ──────────────────────────────────────────────
        const mods = [
            {
                name: 'TOO SLOW',
                art:  'Assets/StoryMode/Artwork/too-slow.png',
                url:  'https://funkymaker.kingamescreator.com/_app/levels/01jqz2mp28q272fq6aqshg8ms7/releases/01jqz2mp39age2fjkfwh4ahtpt'
            },
            {
                name: "YOU CAN'T RUN",
                art:  'Assets/StoryMode/Artwork/you-cant-run.png',
                url:  'https://funkymaker.kingamescreator.com/_app/levels/01k7js7tzxzn2h2wa71d6g423r/releases/01k7js7v00xg1p5pdq5xfn3aej'
            },
            {
                name: 'TRIPLE TROUBLE',
                art:  'Assets/StoryMode/Artwork/triple-trouble.png',
                url:  'https://funkymaker.kingamescreator.com/_app/levels/01jqz2mp28q272fq6aqshg8ms7/releases/01jqz2mp39age2fjkfwh4ahtpt'
            }
        ];

        // ── DOM ────────────────────────────────────────────────────────
        const modArt       = document.getElementById('modArt');
        const modNameText  = document.getElementById('modNameText');
        const prevBtn      = document.getElementById('prevBtn');
        const nextBtn      = document.getElementById('nextBtn');
        const playBtn      = document.getElementById('playBtn');
        const boxWrapper   = document.getElementById('boxWrapper');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const scrollSound  = document.getElementById('scrollSound');
        const confirmSound = document.getElementById('confirmSound');
        const bgMusic      = document.getElementById('bgMusic');

        const staticLayer = document.getElementById('staticLayer');

        let current = 0;
        let switching = false;

        // Intensidad base de la estática
        const STATIC_BASE = 0.25;
        const STATIC_PEAK = 0.7;

        function burstStatic() {
            if (!staticLayer) return;
            staticLayer.style.transition = 'opacity 0.08s ease';
            staticLayer.style.opacity = STATIC_PEAK;
            setTimeout(() => {
                staticLayer.style.transition = 'opacity 1.2s ease';
                staticLayer.style.opacity = STATIC_BASE;
            }, 180);
        }

        // ── Mostrar mod ────────────────────────────────────────────────
        function showMod(index, direction) {
            if (switching) return;
            switching = true;

            // Estática sube rápido para cubrir el cambio
            burstStatic();
            playSound(scrollSound);

            // Quita fade — la estática cubre el swap, no hace falta
            modArt.style.transition   = 'none';
            modNameText.style.transition = 'none';

            // Cambia la imagen en el peak de la estática (80ms)
            setTimeout(() => {
                const mod = mods[index];
                modArt.src = mod.art;
                modNameText.textContent = mod.name;
                modArt.style.opacity      = '1';
                modNameText.style.opacity = '1';
                switching = false;
            }, 80);
        }

        const arrowLeftImg  = document.getElementById('arrowLeftImg');
        const arrowRightImg = document.getElementById('arrowRightImg');

        function pressArrow(imgEl, pressedSrc, normalSrc) {
            imgEl.src = pressedSrc;
            setTimeout(() => { imgEl.src = normalSrc; }, 150);
        }

        // ── Navegación ─────────────────────────────────────────────────
        prevBtn.addEventListener('click', () => {
            current = (current - 1 + mods.length) % mods.length;
            pressArrow(arrowLeftImg,
                'Assets/StoryMode/Arrows/arrow push left.png',
                'Assets/StoryMode/Arrows/arrow left.png');
            showMod(current, 'left');
            enableAudio();
        });

        nextBtn.addEventListener('click', () => {
            current = (current + 1) % mods.length;
            pressArrow(arrowRightImg,
                'Assets/StoryMode/Arrows/arrow push right.png',
                'Assets/StoryMode/Arrows/arrow right.png');
            showMod(current, 'right');
            enableAudio();
        });

        // Swipe táctil
        let touchX = 0;
        document.addEventListener('touchstart', e => { touchX = e.changedTouches[0].screenX; }, { passive: true });
        document.addEventListener('touchend', e => {
            const diff = touchX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 40) {
                if (diff > 0) { current = (current + 1) % mods.length; }
                else          { current = (current - 1 + mods.length) % mods.length; }
                showMod(current);
                enableAudio();
            }
        }, { passive: true });

        // Teclado
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft')  { current = (current - 1 + mods.length) % mods.length; showMod(current, 'left'); }
            if (e.key === 'ArrowRight') { current = (current + 1) % mods.length; showMod(current, 'right'); }
            if (e.key === 'Enter')      { launchMod(); }
        });

        // ── Jugar ──────────────────────────────────────────────────────
        function launchMod() {
            const url = mods[current].url;
            if (!url) { alert('Este mod no está disponible.'); return; }
            playSound(confirmSound);
            loadingOverlay.classList.add('active');
            setTimeout(() => { window.location.href = url; }, 900);
        }

        playBtn.addEventListener('click', () => { enableAudio(); launchMod(); });

        // ── Audio ──────────────────────────────────────────────────────
        function playSound(el) {
            if (!el) return;
            el.currentTime = 0;
            el.play().catch(() => {});
        }

        function enableAudio() {
            bgMusic.volume = 0.6;
            bgMusic.play().catch(() => {});
            document.removeEventListener('click',      enableAudio);
            document.removeEventListener('touchstart', enableAudio);
            document.removeEventListener('keydown',    enableAudio);
        }

        document.addEventListener('click',      enableAudio);
        document.addEventListener('touchstart', enableAudio);
        document.addEventListener('keydown',    enableAudio);

        // ── Init ───────────────────────────────────────────────────────
        showMod(0);

        // ── Infobox dificultad ─────────────────────────────────────────
        const infoBtn   = document.getElementById('infoBtn');
        const infoBox   = document.getElementById('infoBox');
        const infoClose = document.getElementById('infoClose');

        infoBtn.addEventListener('click', () => {
            infoBox.classList.toggle('visible');
        });
        infoClose.addEventListener('click', () => {
            infoBox.classList.remove('visible');
        });
        // Cerrar al hacer click fuera
        document.addEventListener('click', (e) => {
            if (!infoBox.contains(e.target) && e.target !== infoBtn) {
                infoBox.classList.remove('visible');
            }
        });
    </script>
</body>
</html>
