<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Historia - Sonic.exe</title>
    <link rel="icon" type="image/png" href="images/logo_sonic_puto_exe.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <!-- Fuente personalizada -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Reset y estilos base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        /* Sonic.exe Theme */
        :root {
            --blood-red: #d10000;
            --dark-red: #6a0000;
            --neon-yellow: #f5f500;
            --sonic-dark: #0a0a20;
            --sonic-blue: #0066ff;
            --glitch-purple: #b300ff;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: url('BG/storymodeBG.gif') no-repeat center center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
            text-shadow: 0 0 5px var(--blood-red);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Contenedor principal */
        .main-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Imagen del mod con altura controlada */
        .mod-image-container {
            width: 100%;
            height: 0;
            padding-bottom: 30%; /* Proporción más compacta */
            position: relative;
            border: 2px solid var(--blood-red);
            box-shadow: 0 0 15px var(--blood-red);
            border-radius: 6px;
            overflow: hidden;
        }

        .mod-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: rgba(0, 0, 0, 0.3);
            transition: opacity 0.4s ease-in-out;
        }

        /* Efecto glitch */
        .glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('BG/StaticNoise.gif') no-repeat center center;
            background-size: cover;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.3s;
            mix-blend-mode: screen;
        }

        /* Panel de información unificado */
        .info-panel {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--blood-red);
            box-shadow: 0 0 15px var(--blood-red);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.4s ease-in-out;
        }

        /* Navegación entre mods */
        .mod-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon-yellow);
            padding: 8px 10px;
            border-radius: 4px;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon-yellow);
            color: var(--neon-yellow);
            font-size: 0.9rem;
            transition: all 0.2s;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            min-height: 44px;
            min-width: 44px;
        }

        .nav-btn:hover {
            transform: scale(1.1);
            background: rgba(245, 245, 0, 0.2);
            box-shadow: 0 0 8px var(--neon-yellow);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .mod-title {
            color: var(--neon-yellow);
            text-shadow: 1px 1px 0 var(--blood-red);
            font-size: 0.85rem;
            text-align: center;
            flex-grow: 1;
            margin: 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.3s ease-in-out;
        }

        /* Contenedor unificado para personaje y botones */
        .game-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* Sección del personaje */
        .character-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .character-label {
            color: var(--sonic-blue);
            font-size: 0.65rem;
            text-shadow: 0 0 4px var(--sonic-blue);
        }

        .character-display {
            width: 100px;
            height: 100px;
            border: 2px solid var(--neon-yellow);
            border-radius: 6px;
            box-shadow: 0 0 15px var(--neon-yellow);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.5);
            transition: opacity 0.4s ease-in-out, background-image 0.4s ease-in-out;
        }

        .character-display.loading {
            opacity: 0.5;
        }

        /* Botones de acción */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            width: 100%;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 2px solid var(--neon-yellow);
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            padding: 8px 12px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            min-width: 100px;
            min-height: 44px;
            flex-grow: 1;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        /* Contador de mods */
        .mod-counter {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: var(--neon-yellow);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.6rem;
            border: 2px solid var(--neon-yellow);
            box-shadow: 0 0 10px var(--neon-yellow);
            font-weight: bold;
            transition: opacity 0.3s ease-in-out;
        }

        .mod-title {
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 1px 1px 0 var(--blood-red), 0 0 5px var(--neon-yellow); }
            50% { text-shadow: 1px 1px 0 var(--blood-red), 0 0 15px var(--neon-yellow); }
        }
        
        /* Transición suave para info-panel */
        .info-panel {
            animation: panelEnter 0.5s ease-out;
        }
        
        @keyframes panelEnter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }



        /* Animación de entrada suave */
        .mod-enter {
            animation: modEnter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modEnter {
            from {
                opacity: 0;
                transform: scale(0.95) translateX(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateX(0);
            }
        }
        
        /* Transición suave para personaje */
        .character-enter {
            animation: charEnter 0.5s ease-out;
        }
        
        @keyframes charEnter {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .play-btn {
            background-color: var(--blood-red);
            color: black;
            text-shadow: 1px 1px 0 var(--neon-yellow);
        }

        .play-btn:hover {
            background-color: var(--dark-red);
            color: white;
            box-shadow: 0 0 15px var(--blood-red);
            transform: translateY(-2px);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .menu-btn {
            background-color: transparent;
            color: var(--neon-yellow);
        }

        .menu-btn:hover {
            background-color: rgba(245, 245, 0, 0.1);
            box-shadow: 0 0 10px var(--neon-yellow);
            transform: translateY(-2px);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-text {
            color: var(--blood-red);
            text-shadow: 0 0 10px var(--neon-yellow);
            margin-top: 15px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Efectos especiales */
        .static-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.imgur.com/static-effect.gif');
            opacity: 0.03;
            pointer-events: none;
            z-index: 999;
        }

        /* Media queries para pantallas más grandes */
        @media (min-width: 500px) {
            .mod-image-container {
                padding-bottom: 35%;
            }
            
            .mod-title {
                font-size: 0.95rem;
            }
            
            .character-display {
                width: 110px;
                height: 110px;
            }
            
            .action-btn {
                font-size: 0.85rem;
                min-width: 110px;
            }
        }
        
        @media (min-width: 768px) {
            .mod-image-container {
                padding-bottom: 40%;
            }
            
            .mod-title {
                font-size: 1.2rem;
            }
            
            .character-display {
                width: 150px;
                height: 150px;
            }
            
            .action-btn {
                font-size: 1rem;
                min-width: 150px;
            }
            
            .game-content {
                flex-direction: row;
                justify-content: space-around;
                align-items: center;
            }
            
            .action-buttons {
                flex-direction: column;
                width: auto;
            }
        }

        /* Ajustes para pantallas muy pequeñas */
        @media (max-width: 400px) {
            body {
                padding: 8px;
            }
            
            .main-container {
                gap: 6px;
            }
            
            .mod-image-container {
                padding-bottom: 28%;
                border: 2px solid var(--blood-red);
            }
            
            .info-panel {
                padding: 8px;
                gap: 8px;
            }
            
            .mod-navigation {
                padding: 6px 8px;
            }
            
            .nav-btn {
                width: 40px;
                height: 40px;
                min-height: 48px;
                min-width: 48px;
                font-size: 0.8rem;
            }
            
            .mod-title {
                font-size: 0.7rem;
                margin: 0 6px;
            }
            
            .character-display {
                width: 90px;
                height: 90px;
            }
            
            .character-label {
                font-size: 0.6rem;
            }
            
            .action-buttons {
                gap: 6px;
            }
            
            .action-btn {
                padding: 6px 10px;
                font-size: 0.7rem;
                min-width: 90px;
                min-height: 48px;
            }
            
            .action-btn i {
                margin-right: 4px;
            }
        }
    </style>
</head>
<body>
    <!-- Efecto de estática sutil -->
    <div class="static-effect"></div>

    <div class="main-container">
        <!-- Imagen del mod actual -->
        <div class="mod-image-container">
            <img id="modImage" class="mod-image" alt="Imagen del Mod">
            <div class="glitch-overlay" id="glitchOverlay"></div>
        </div>

        <!-- Panel de información unificado -->
        <div class="info-panel">
            <!-- Navegación entre mods -->
            <div class="mod-navigation">
                <button id="prevButton" class="nav-btn" aria-label="Mod anterior" title="Mod anterior">
                    <i class="bi bi-arrow-left"></i>
                </button>
                
                <div style="display: flex; align-items: center; flex-grow: 1; justify-content: center; overflow: hidden;">
                    <div id="modTitle" class="mod-title" role="status" aria-live="polite">TOO SLOW</div>
                </div>
                
                <button id="nextButton" class="nav-btn" aria-label="Siguiente mod" title="Siguiente mod">
                    <i class="bi bi-arrow-right"></i>
                </button>
            </div>

            <!-- Contenido del juego (personaje y botones) -->
            <div class="game-content">
                <!-- Sección del personaje -->
                <div class="character-section">
                    <div class="character-label">PERSONAJE</div>
                    <div id="characterDisplay" class="character-display"></div>
                </div>

                <!-- Botones de acción -->
                <div class="action-buttons">
                    <button id="playButton" class="action-btn play-btn" aria-label="Jugar mod actual" title="Jugar">
                        <i class="bi bi-play-fill me-2"></i> JUGAR
                    </button>
                    <a href="index.html" class="action-btn menu-btn" aria-label="Volver al menú principal" title="Menú">
                        <i class="bi bi-house-door me-2"></i> MENÚ
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="loading-text">CARGANDO...</p>
    </div>

    <!-- Audio elements -->
    <audio id="bgMusic" src="sounds/storymodemenumusic.ogg" loop></audio>
    <audio id="scrollSound" src="sounds/pauseScrollMenu.ogg"></audio>
    <audio id="confirmSound" src="sounds/confirmMenu.ogg"></audio>

    <!-- Bootstrap JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Detectar móvil y Android
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isAndroid = /Android/i.test(navigator.userAgent);
        
        // Vibración táctil para Android
        function lightVibration() {
            if (isAndroid && navigator.vibrate) {
                navigator.vibrate(15);
            }
        }

        // Detectar conexión lenta
        if (isAndroid && 'connection' in navigator) {
            const connection = navigator.connection;
            if (connection.effectiveType === 'slow-2g' || connection.effectiveType === '2g') {
                document.documentElement.style.setProperty('--transition-time', '0.2s');
            }
        }

        // Datos de los mods
        const mods = [
            {
                id: 'too-slow',
                name: 'TOO SLOW',
                image: 'images/Too_Slow_Artwork.png',
                characterGif: 'images/Boyfriend.gif',
                playUrl: 'https://funkymaker.kingamescreator.com/_app/levels/01jqz2mp28q272fq6aqshg8ms7/releases/01jqz2mp39age2fjkfwh4ahtpt',
                description: 'Enfrenta a Sonic.exe en esta batalla épica de ritmo donde la velocidad es clave.'
            },
            {
                id: 'you-cant-run',
                name: "YOU CAN'T RUN",
                image: 'images/You-cant-runfp.png',
                characterGif: 'images/Boyfriend.gif',
                playUrl: 'https://funkymaker.kingamescreator.com/_app/levels/01jqz2mp28q272fq6aqshg8ms7/releases/01jqz2mp39age2fjkfwh4ahtpt',
                description: 'Escapa del terror en esta frenética persecución musical llena de adrenalina.'
            },
            {
                id: 'triple-trouble',
                name: 'TRIPLE TROUBLE',
                image: 'images/Triple-troublefp.png',
                characterGif: 'images/Boyfriend.gif',
                playUrl: 'https://funkymaker.kingamescreator.com/_app/levels/01jqz2mp28q272fq6aqshg8ms7/releases/01jqz2mp39age2fjkfwh4ahtpt',
                description: 'Enfrenta a los tres terrores en esta batalla triple de supervivencia.'
            }
        ];
        
        function isValidUrl(url) {
            try {
                new URL(url);
                return true;
            } catch {
                return false;
            }
        }

        // Cache de imágenes precargadas
        const imageCache = new Map();
        
        // Precargar imágenes críticas con manejo de errores
        mods.forEach(mod => {
            const img = new Image();
            img.onerror = () => console.warn('Error cargando imagen: ' + mod.image);
            img.src = mod.image;
            imageCache.set(mod.id + '-main', img);
            const gif = new Image();
            gif.onerror = () => console.warn('Error cargando GIF: ' + mod.characterGif);
            gif.src = mod.characterGif;
            imageCache.set(mod.id + '-char', gif);
        });
        
        // Precargar siguiente/anterior mod
        function precacheAdjacentMods() {
            const nextIdx = (currentModIndex + 1) % mods.length;
            const prevIdx = (currentModIndex - 1 + mods.length) % mods.length;
            
            [nextIdx, prevIdx].forEach(idx => {
                const mod = mods[idx];
                if (!imageCache.has(mod.id + '-main-preload')) {
                    const img = new Image();
                    img.src = mod.image;
                    imageCache.set(mod.id + '-main-preload', img);
                }
            });
        }

        // Variables de estado
        let currentModIndex = 0;
        let autoGlitchTimer;
        const DOM = {
            modImage: document.getElementById('modImage'),
            characterDisplay: document.getElementById('characterDisplay'),
            playButton: document.getElementById('playButton'),
            prevButton: document.getElementById('prevButton'),
            nextButton: document.getElementById('nextButton'),
            modTitle: document.getElementById('modTitle'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            glitchOverlay: document.getElementById('glitchOverlay')
        };

        // Función para mostrar efecto glitch
        function showGlitchEffect() {
            DOM.glitchOverlay.style.opacity = '0.7';
            setTimeout(() => {
                DOM.glitchOverlay.style.opacity = '0';
            }, 300);
        }

        // Glitch aleatorio automático
        function startAutoGlitch() {
            if (autoGlitchTimer) clearInterval(autoGlitchTimer);
            autoGlitchTimer = setInterval(() => {
                if (Math.random() < 0.3) {
                    showGlitchEffect();
                }
            }, 12000);
        }

        // Función para actualizar la interfaz
        function updateDisplay() {
            const currentMod = mods[currentModIndex];
            
            // Fade out
            DOM.modImage.style.opacity = '0';
            DOM.characterDisplay.style.opacity = '0';
            DOM.modTitle.style.opacity = '0';
            
            setTimeout(() => {
                // Cambiar contenido
                DOM.modImage.src = currentMod.image;
                DOM.modImage.alt = currentMod.name;
                DOM.modImage.onerror = () => {
                    console.error('Error cargando imagen: ' + currentMod.image);
                    DOM.modImage.style.opacity = '1';
                };
                DOM.modImage.onload = () => {
                    DOM.modImage.style.opacity = '1';
                };
                DOM.modTitle.textContent = currentMod.name;
                
                // Lazy load personaje
                DOM.characterDisplay.classList.add('loading');
                const charImg = new Image();
                charImg.onload = () => {
                    DOM.characterDisplay.style.backgroundImage = 'url(' + currentMod.characterGif + ')';
                    DOM.characterDisplay.classList.remove('loading');
                    DOM.characterDisplay.style.opacity = '1';
                };
                charImg.onerror = () => {
                    console.error('Error cargando GIF: ' + currentMod.characterGif);
                    DOM.characterDisplay.classList.remove('loading');
                    DOM.characterDisplay.style.opacity = '1';
                };
                charImg.src = currentMod.characterGif;
                
                // Fade in titulo
                DOM.modTitle.style.opacity = '1';
                
                updateCounter();
                showGlitchEffect();
                lightVibration();
                precacheAdjacentMods();
            }, 150);
            
            // Reproducir sonido de scroll
            const scrollSound = document.getElementById('scrollSound');
            if (scrollSound) {
                scrollSound.currentTime = 0;
                scrollSound.play().catch(() => {});
            }
        }

        function updateCounter() {
            let counter = document.querySelector('.mod-counter');
            if (!counter) {
                counter = document.createElement('div');
                counter.className = 'mod-counter';
                counter.setAttribute('aria-label', `Mod ${currentModIndex + 1} de ${mods.length}`);
                document.querySelector('.mod-image-container').appendChild(counter);
            }
            counter.textContent = `${currentModIndex + 1}/${mods.length}`;
            counter.setAttribute('aria-label', `Mod ${currentModIndex + 1} de ${mods.length}`);
        }

        function updateDescription() {
            // Función vacía - descripción eliminada
        }

        // Función para manejar el botón Jugar
        function playMod() {
            const currentMod = mods[currentModIndex];
            
            if (!isValidUrl(currentMod.playUrl)) {
                alert('Este mod no está disponible en este momento.');
                return;
            }
            
            // Reproducir sonido de confirmación
            const confirmSound = document.getElementById('confirmSound');
            if (confirmSound) {
                confirmSound.currentTime = 0;
                confirmSound.play().catch(() => {});
            }
            
            DOM.loadingOverlay.style.display = 'flex';
            
            setTimeout(() => {
                window.location.href = currentMod.playUrl;
            }, 1000);
        }

        // Swipe gestures para móvil
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > 30) {
                if (diff > 0) {
                    currentModIndex = (currentModIndex + 1) % mods.length;
                } else {
                    currentModIndex = (currentModIndex - 1 + mods.length) % mods.length;
                }
                if (navigator.vibrate) navigator.vibrate(50);
                updateDisplay();
                precacheAdjacentMods();
            }
        }, { passive: true });

        // Event Listeners
        DOM.prevButton.addEventListener('click', () => {
            currentModIndex = (currentModIndex - 1 + mods.length) % mods.length;
            if (navigator.vibrate) navigator.vibrate(50);
            updateDisplay();
            enableAudio();
            precacheAdjacentMods();
        });

        DOM.nextButton.addEventListener('click', () => {
            currentModIndex = (currentModIndex + 1) % mods.length;
            if (navigator.vibrate) navigator.vibrate(50);
            updateDisplay();
            enableAudio();
            precacheAdjacentMods();
        });

        DOM.playButton.addEventListener('click', () => {
            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
            enableAudio();
            playMod();
        });

        // Navegación con teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                currentModIndex = (currentModIndex - 1 + mods.length) % mods.length;
                if (navigator.vibrate) navigator.vibrate(50);
                updateDisplay();
                precacheAdjacentMods();
            }
            if (e.key === 'ArrowRight') {
                currentModIndex = (currentModIndex + 1) % mods.length;
                if (navigator.vibrate) navigator.vibrate(50);
                updateDisplay();
                precacheAdjacentMods();
            }
            if (e.key === 'Enter') {
                if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
                playMod();
            }
        });

        // Inicialización de audio
        function initAudio() {
            const bgMusic = document.getElementById('bgMusic');
            if (bgMusic) {
                bgMusic.volume = 0.6;
                bgMusic.play().catch(() => {});
            }
        }

        // Inicialización
        updateDisplay();
        startAutoGlitch();
        
        // Iniciar audio después de cualquier interacción del usuario
        const enableAudio = () => {
            initAudio();
            document.removeEventListener('click', enableAudio);
            document.removeEventListener('touchstart', enableAudio);
            document.removeEventListener('keydown', enableAudio);
        };
        
        document.addEventListener('click', enableAudio);
        document.addEventListener('touchstart', enableAudio);
        document.addEventListener('keydown', enableAudio);
        
        if (isMobile) {
            DOM.modImage.loading = 'lazy';
        }
    </script>
</body>
</html>
